      + '<button class="btn ghost" onclick="slotSel=[];render()">조건 초기화</button></div>';
    el.innerHTML=h; return;
  }

  nodes.forEach(function(nd){
    const nid = 'nd-'+nd.n.replace(/[^a-z0-9]/gi,'');
    /* 슬롯 필터가 걸리면 결과가 가려지지 않게 자동으로 펼친다 */
    const closed = !slotSel.length && nodeOpen.indexOf(nd.n)<0;
    const view = nd.slots.filter(function(x){ return !slotSel.length || slotSel.indexOf(x.st)>=0; });

    h += '<div class="ncard'+(closed?' closed':'')+'" id="'+nid+'">'
      /* 이름이 카드의 첫 값이다. 부제에 가속기 모델·주소를 내려 이름이 먼저 읽히게 한다 */
      + '<div class="ncard-head" onclick="tgNode(\'' + nd.n + '\')">'
      +   nodeIcon(nd.kind)
      +   '<div class="ncard-id">'
      +     '<div class="ncard-n mono">'+nd.n+'</div>'
      +     '<div class="ncard-sub">'+devSummary(nd.slots)+' · <span class="mono">'+nd.ip+'</span></div>'
      +   '</div>'
      +   '<span class="stbadge '+(nd.st==='정상'?'ok':'cr')+'">'+nd.st+'</span>'
      +   '<span class="foldbtn" title="'+(closed?'펼치기':'접기')+'">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'
      +   '</span>'
      + '</div>'

      /* 접힌 채로도 판단할 수 있게 한 줄에 담는다. 세 줄로 벌리면 노드 카드가
         전체 카드와 무게가 같아져 층위가 안 보인다 */
      + '<div class="ncard-m">'
      +   '<div class="nm-i nm-slot">'
      +     '<div class="nm-t">가속기 <b>'+usedOf(nd.slots)+'</b> / '+nd.slots.length+'</div>'
      +     barOf(nd.slots, nd.n)
      +   '</div>'
      +   miniBar('CPU', nd.cpu.use, nd.cpu.cap, 'Cores', 'nodecpu'+nd.n+range)
      +   miniBar('메모리', nd.mem.use, nd.mem.cap, 'GB', 'nodemem'+nd.n+range)
      + '</div>'

      /* 표는 펼쳤을 때만 — 격자가 요약이고 표가 상세다 */
      + '<div class="ncard-body">'
      +   '<div class="tblwrap plain"><table class="tbl"><thead><tr>'
      +   '<th style="width:74px">슬롯</th><th>가속기</th>'
      +   '<th class="thcell">'+thHelp('core','연산 코어')+'</th>'
      +   '<th class="thcell">'+thHelp('vram','VRAM')+'</th>'
      +   '<th>온도</th><th>전력</th>'
      +   '<th class="thcell">'+thFilterSt()+'</th>'
      +   '<th>점유 배포</th></tr></thead><tbody>'
      +   view.map(function(x){
            const dead = x.st==='확인 불가';
            return '<tr onclick="openSlot(\'' + nd.n + '\',' + x.no + ')" style="cursor:pointer">'
             + '<td class="num"><span class="mname mono">#'+x.no+'</span></td>'
             + '<td>'+vendorBadge(x.dev)+x.dev+'<span class="mver mono">'+x.id+'</span></td>'
             /* 막대(지금 값)에서 스파크라인(추세+호버 상세)으로 바꿨다 — 건전성 카드와 같은
                방식이다. 임계값 신호는 막대색 대신 값 색으로 옮겼다(기획 판단, 2026-08-28) */
             + '<td>'+(dead? dash()
                 : '<div class="pcwrap"><span class="pcv mono'+(x.core>=90?' crit':(x.core>=70?' warn':''))+'">'+x.core+'%</span>'
                   +'<div class="hspark">'+miniSpark('acccore'+nd.n+x.no+range, '%')+'</div></div>')+'</td>'
             + '<td>'+(dead? dash()
                 : (function(){
                     const vp=Math.round(x.vram.use/x.vram.cap*100);
                     return '<div class="pcwrap"><span class="pcv mono'+(vp>=90?' crit':(vp>=70?' warn':''))+'">'+x.vram.use.toFixed(1)+' / '+x.vram.cap+' GB</span>'
                       +'<div class="hspark">'+miniSpark('accvram'+nd.n+x.no+range, '%')+'</div></div>';
                   })())+'</td>'
             + '<td class="mono">'+(dead? dash() : x.temp+'°C')+'</td>'
             + '<td class="mono">'+(dead? dash() : x.pw+'W')+'</td>'
             + '<td><span class="stbadge '+(SLOTB[x.st]||'mu')+'">'+x.st+'</span></td>'
             /* 공유 슬롯은 배포가 여럿이다. 첫 배포만 보이고 나머지는 건수로 줄인다 —
        전부 늘어놓으면 행 높이가 들쭉날쭉해진다. 자세한 것은 패널에서 본다 */
     + '<td>'+(x.by.length
         ? '<span class="rname">'+x.by[0]+'</span>'
           + (x.by.length>1? '<span class="mver">외 '+(x.by.length-1)+'건</span>' : '')
         : dash())+'</td></tr>';
          }).join('')
      +   '</tbody></table></div>'
      + '</div>'
      + '</div>';
  });
  el.innerHTML=h;
}

/* ── 가속기 탭 공용 ──────────────────────────────
   전체와 노드가 같은 함수를 쓴다. 형태가 같아야 층위가 눈으로 읽힌다 */

const USEHELP = '사용 중과 공유를 합쳐 전체로 나눈 값입니다. 확인 불가도 분모에 넣습니다 — '
  + '쓸 수 없는 상태이지 자리가 없어진 것은 아닙니다.';

function usedOf(list){ return list.filter(function(x){ return x.st==='사용 중'||x.st==='공유'; }).length; }
function pcOf(list){ return list.length? Math.round(usedOf(list)/list.length*100) : 0; }

/* 가속기 모델별 집계 — 노드 부제에 쓴다 */
function devSummary(list){
  const by={};
  list.forEach(function(x){ by[x.dev]=(by[x.dev]||0)+1; });
  return Object.keys(by).map(function(d){ return d+' '+by[d]+'장'; }).join(' · ');
}

/* 가속기 모델별 목록 — 모델이 몇 가지든 화면이 무너지지 않게 넷까지만 펼치고 나머지는 접는다.
   `기타 N종` 으로 묶지 않는다 — 자원을 찾는 화면인데 특정 장비가 숨으면 안 된다.
   정렬은 사용률 내림차순이다. `어디가 남았나` 보다 `어디가 모자라나` 가 먼저 걸린다 */
const DEV_SHOWN=4;
let devMore=false;
function tgDevMore(){ devMore=!devMore; render(); }
function devList(byDev){
  const keys = Object.keys(byDev).sort(function(a,b){ return pcOf(byDev[b])-pcOf(byDev[a]); });
  const shown = devMore ? keys : keys.slice(0, DEV_SHOWN);
  const rest = keys.length - shown.length;
  return '<div class="devlist">'
   /* 전체를 쪼갠 것임이 드러나야 한다. 라벨 없이 아래에 붙이면 나열로 읽힌다.
      `모델` 만 쓰면 AI 모델(qwen3-32b)과 겹치므로 `가속기 모델` 로 쓴다 */
   + '<div class="devlist-t">가속기 모델별'+tip('전체 가속기를 모델로 나눈 것입니다. 각 막대의 합이 위 전체와 같습니다.')+'</div>'
   + shown.map(function(d){
       const g=byDev[d];
       return '<div class="devrow">'
        + '<div class="devrow-t">'+vendorBadge(d)+'<span class="devrow-n">'+d+'</span>'
        +   '<span class="devrow-c">'+g.length+'장</span>'
        +   '<span class="devrow-u"><b>'+usedOf(g)+'</b> / '+g.length+'<span class="devrow-pc">'+pcOf(g)+'%</span></span>'
        + '</div>'
        + barOf(g, d)
        + '</div>';
     }).join('')
   /* 목록이 여기서 끊긴다는 것이 드러나야 한다. 글자만 두면 앞 항목의 연장으로 읽힌다 —
      폭 전체를 쓰는 버튼으로 두고 가운데 정렬해 항목(왼쪽 정렬)과 형태를 가른다 */
   + (rest>0 || devMore
      ? '<button class="devmore'+(devMore?' on':'')+'" onclick="tgDevMore()">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'
        + (devMore ? '접기' : rest+'개 모델 더 보기')+'</button>'
      : '')
   + '</div>';
}

/* 점유 막대 — 상태별 길이를 이어 붙인다. 칸을 하나씩 그리던 격자를 대신한다.
   격자는 `몇 개 찼나` 만 답하면서 표와 같은 정보를 덜 정확하게 보여 주고 있었다.
   개별 슬롯은 표에서 본다 */
const SGRID={'사용 중':'used','공유':'shared','유휴':'idle','확인 불가':'dead'};
const SORDER=['사용 중','공유','확인 불가','유휴'];
/* 구간마다 말풍선을 둔다. `title` 은 1초 지연되고 여러 줄이 안 되며 꾸밀 수 없다.
   호버한 구간만 원색이 되고 나머지는 흐린 채로 남아, 지금 보는 것이 어느 상태인지 드러난다 */
const SDESC={
  '사용 중':'배포 하나가 점유한 상태입니다.',
  '공유':'둘 이상이 나눠 쓰고 있습니다.',
  '유휴':'점유한 배포가 없어 바로 쓸 수 있습니다.',
  '확인 불가':'상태를 읽지 못합니다. 노드나 수집 에이전트를 확인해 주세요.'
};
function barOf(list, scope){
  const tot=list.length||1;
  return '<div class="ubar">'
   + SORDER.map(function(st){
       const g=list.filter(function(x){ return x.st===st; });
       if(!g.length) return '';
       const pc = g.length/tot*100;
       /* 배포가 여럿이면 셋까지만 보이고 나머지는 건수로 줄인다 */
       const deps=[...new Set(g.reduce(function(a,x){ return a.concat(x.by); }, []))];
       const dl = deps.length
         ? '<span class="ubt-d">'+deps.slice(0,3).map(function(d){ return '<span>'+d+'</span>'; }).join('')
           + (deps.length>3? '<span class="ubt-m">외 '+(deps.length-3)+'건</span>' : '')+'</span>'
         : '';
       /* 좁은 구간도 잡히게 최소 폭을 둔다. 1장이면 폭이 4% 라 못 누른다 */
       return '<i class="'+SGRID[st]+'" style="width:'+pc+'%">'
        + '<span class="ubtip">'
        +   '<b>'+st+'</b>'
        +   '<span class="ubt-v">'+g.length+'장 · '+(scope? scope+' ' : '')+tot+'장 중 '+Math.round(pc)+'%</span>'
        +   '<span class="ubt-x">'+SDESC[st]+'</span>'
        +   dl
        + '</span></i>';
     }).join('')
   + '</div>';
}

/* 범례 — 색이 무엇을 뜻하는지 한 번만 밝힌다. 노드 카드마다 되풀이하지 않는다.
   건수를 함께 둔다 — 막대에 호버하지 않아도 몇 장인지 알 수 있어야 한다 */
function legend(list){
  return '<div class="sglg">'
   + [['used','사용 중'],['shared','공유'],['idle','유휴'],['dead','확인 불가']]
       .map(function(p){
         const c = list ? list.filter(function(x){ return SGRID[x.st]===p[0]; }).length : null;
         return '<span><i class="lg '+p[0]+'"></i>'+p[1]
          + (c===null? '' : '<b>'+c+'</b>')+'</span>';
       }).join('')
   + '</div>';
}

/* 노드 자원 — 가속기 막대와 한 줄에 놓이므로 라벨·값을 한 줄로 줄인다.
   막대(지금 값)에서 스파크라인(추세+호버 상세)으로 바꿨다. 임계값 신호는
   값 색으로 옮겼다(가속기 탭 스파크라인 전환, 기획 판단 2026-08-28) */
function miniBar(label, use, cap, unit, seed){
  const pc = Math.round(use/cap*100);
  const cls = pc>=90?'crit':(pc>=70?'warn':'');
  return '<div class="nm-i">'
   + '<div class="nm-t">'+label+' <b'+(cls?' class="'+cls+'"':'')+'>'+pc+'%</b>'
   +   '<span class="nm-v">'+use+' / '+cap+' '+unit+'</span></div>'
   + '<div class="hspark">'+miniSpark(seed, '%')+'</div>'
   + '</div>';
}

/* 전체 펼치기·접기 — 노드가 열 개면 하나씩 누를 수 없다.
   체크박스로 둔다. 켜고 끄는 것이라 라벨이 바뀌지 않고 지금 상태가 체크로 드러난다.
   세그먼트로 두면 하나씩 열었을 때 어느 쪽도 아닌 상태를 표현할 수 없다 —
   체크박스는 `일부만 펼침`을 중간 상태로 받는다(파일 탐색기 트리와 같은 방식) */
function nodeFold(){
  const list=visibleNodes();
  const open = list.filter(function(nd){ return nodeOpen.indexOf(nd.n)>=0; }).length;
  const allOpen = open===list.length;
  /* `.chk` 는 커스텀 체크박스다. input 은 숨기고 `.cbx` 가 네모를 그린다 */
  return '<label class="chk foldall">'
   + '<input type="checkbox" id="foldAll"'+(allOpen?' checked':'')
   +   ' onchange="setAllNodes(this.checked)"><span class="cbx"></span>'
   /* 라벨은 상태다. `모두 펼치기` 로 두면 동작이 되어 체크 표시와 어긋난다 —
      체크가 켜져 있는데 `펼치기` 라고 적혀 있으면 아직 안 펼쳐진 것으로 읽힌다 */
   + '<span class="cbt">모두 펼침</span></label>';
}
/* 일부만 펼쳐진 상태 — HTML 로는 못 적고 JS 로만 걸린다 */
function syncFoldAll(){
  const el=document.getElementById('foldAll');
  if(!el) return;
  const list=visibleNodes();
  const open = list.filter(function(nd){ return nodeOpen.indexOf(nd.n)>=0; }).length;
  el.indeterminate = open>0 && open<list.length;
}
function setAllNodes(open){
  nodeOpen = open ? NODES.map(function(nd){ return nd.n; }) : [];
  render();
}

/* 워크스페이스 합산 요약 — 배포 기준은 유지하되, 그 위에 이 범위(스위처가 좁힌 워크스페이스
   또는 전체) 배포들의 건전성 분포를 먼저 보여준다(기획 판단, 2026-08-28).
   지표를 합산하지 않는다 — 배포마다 모델·규모가 달라 처리량·지연 같은 값은 더해도 뜻이 없다.
   건전성 라벨(안정·주의·위험)은 배포와 무관하게 같은 축이라 셀 수 있다.
   ⚠ v1(2026-08-28 오전) — "확인 필요 수 / 전체" 큰 숫자 하나 + 칩 나열로 만들었으나
   "2가 5개 중 몇 개를 말하는지, 어떤 배포인지, 유휴·중지됨은 확인 필요인지"가
   한 카드 안에서 안 읽힌다는 지적을 받았다(사용자 지적, 2026-08-28).
   v2 — 5개 상태를 전부 펼쳐 보이는 표로 바꾸고, 확인 필요 기준(주의·위험만 해당,
   유휴·중지됨은 의도된 상태라 제외)을 문장으로 밝힌다. 클릭해 정렬·필터하는 기능은
   넣지 않았다 — 아래는 배포 하나만 보는 드롭다운이라 목록 자체가 없다. "어떤 배포인지"는
   위의 확인 필요 항목 배너가 이미 답하고 있어 그쪽으로 안내만 한다 */
function wsPerfSummary(){
  const list = depList();
  const total = list.length;
  if(!total) return '';
  const counts = {'안정':0,'주의':0,'위험':0,'유휴':0,'중지됨':0};
  list.forEach(function(d){
    const label = DEPM[d.n]? DEPM[d.n].label : d.st;
    counts[label] = (counts[label]||0)+1;
  });
  const bad = counts['주의'] + counts['위험'];
  /* '전체'와 특정 워크스페이스가 지금까지 같은 모양(그냥 이어붙인 텍스트)이라
     "지금 뭔가 골라져 있다"는 느낌이 안 났다(사용자 지적, 2026-08-28).
     v2 — 옅은 텍스트 vs 칩으로 위계만 갈랐으나, "이게 뭘 고르는 자리인지"가
     여전히 안 읽힌다는 후속 지적을 받았다. 셰브런을 붙여 리드온리 드롭다운처럼
     보이게 한다 — 위 배포 드롭다운(depPick)·헤더 스위처와 같은 생김새를 공유해
     "이것도 선택 지점이다"가 형태로 전달되게 한다. 눌러도 동작하진 않는다 —
     실제 스위처는 헤더에 있고 이건 그 값을 그대로 보여주는 요약이다 */
  const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="wssum-chev"><path d="M6 9l6 6 6-6"/></svg>';
  const scope = wsCur==='전체'
    ? '<span class="wssum-scope">전체'+chev+'</span>'
    : '<span class="wssum-scope sel">'+wsCur+chev+'</span>';
  /* v2(숫자 5개 나열)가 "1 안정 1 주의 1 위험..." 식으로 값이 다 1일 때 특히
     지루하고 조잡해 보인다는 지적을 받았다(사용자 지적, 2026-08-28).
     v3 — 세그먼트 막대 + 범례로 바꾼다. 이건 새 패턴이 아니라 가속기 탭 점유 막대와
     같은 논리다 — "카테고리 구성비는 막대가 맞는 표현"이라고 이미 정한 적이 있다.
     전체 중 몇 개가 이 상태인지는 막대 비율로, 정확한 수는 범례 옆 숫자로 본다 */
  const order = [['안정','ok'],['주의','wa'],['위험','cr'],['유휴','mu'],['중지됨','mu']];
  /* 이 카드가 워크스페이스 범위라는 걸 문구로 설명하는 대신, 헤더 스위처와 같은
     아이콘을 붙였다 — 같은 아이콘 = 같은 개념(워크스페이스)이라는 걸 잇는다.
     스위처가 라벨 없이 아이콘만으로 통하는 것과 같은 방식이다(사용자 지적, 2026-08-28) */
  return '<div class="wssum">'
   + '<div class="wssum-h">'
   +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="wssum-ic"><rect x="4" y="3" width="10" height="18" rx="1"/><path d="M14 8h5a1 1 0 011 1v11a1 1 0 01-1 1H4"/><path d="M7 7h3M7 11h3M7 15h3"/></svg>'
   +   '배포 현황'+scope
   /* "지금 보고 있는 범위"가 추상적이라는 지적을 받았다. 옆에 scope 칩이
      이미 `전체`나 워크스페이스명을 보여주고 있어 툴팁이 또 설명할 필요가
      없었다 — 그래서 "워크스페이스"로 바꾸는 대신 아예 뺐다. `전체`일 때는
      워크스페이스 하나가 아니라 여럿이 섞인 상태라 "워크스페이스"라고 부르면
      부정확해진다(사용자 지적, 2026-08-28) */
   +   tip('배포 '+total+'개를 건전성·상태별로 나눕니다.')
   +   '<span class="wssum-tot">배포 '+total+'개</span>'
   + '</div>'
   /* 막대에 호버하면 그 구간의 값을 본다 — 색만 보고 몇 건인지 눈대중해야 했다.
      정적인 5구간이라 lineChart처럼 좌표 추적할 필요 없이 구간마다 값을 심어 둔다
      (사용자 요청, 2026-08-28).
      ⚠ 말풍선(.ctip)을 막대 안 자식으로 뒀더니 막대의 overflow:hidden(둥근 모서리로
      자르려던 것)이 말풍선까지 잘라 안 보였다. 막대를 감싸는 래퍼를 새로 두고
      말풍선은 그 밖(래퍼의 자식, 막대의 형제)으로 옮긴다(사용자 지적, 2026-08-28) */
   + '<div class="wsbar-wrap">'
   +   '<div class="wsbar">'
   +     order.map(function(o){
           const cnt = counts[o[0]];
           const pc = Math.round(cnt/total*100);
           return pc? '<i class="'+o[1]+'" style="width:'+pc+'%" onmouseenter="wsBarHover(event,\''+o[0]+'\','+cnt+','+pc+')" onmouseleave="wsBarOut(event)"></i>' : '';
         }).join('')
   +   '</div>'
   +   '<div class="ctip" style="display:none"></div>'
   + '</div>'
   + '<div class="wslg">'
   +   order.map(function(o){
         return '<span><i class="lg '+o[1]+'"></i>'+o[0]+'<b>'+counts[o[0]]+'</b></span>';
       }).join('')
   + '</div>'
   /* ⚠ "확인이 필요한 배포 N건 · 바로 보기" 노트가 있었는데, 확인 필요 항목이
      이제 페이지 상단 개요 행에 탭과 무관하게 항상 떠 있어 여기서 또 그리로
      가는 링크를 두는 게 중복이 됐다. 뺀다 — 주의·위험 건수는 위 막대·범례
      색으로 이미 보인다(사용자 지적, 2026-08-28) */
   + '</div>';
}
/* ⚠ 배포 선택·시간 범위를 이 카드 안에 넣었었는데(가속기 탭 "전체+모델별" 중첩을
   따라한다고), 실제로는 이 카드의 어떤 값도 dep나 range를 안 쓴다 — 요약 막대·
   범례·건수는 순전히 워크스페이스 스코프(depList)만으로 계산된다. 즉 이 카드
   안에 있으면서 이 카드의 아무것도 바꾸지 못하는 컨트롤이었다. 실제로 이걸
   바꾸는 대상(건전성·게이트웨이 등 상세 카드) 바로 위로 옮긴다(사용자 지적,
   2026-08-28) */

/* 건전성 라벨 임계값 — [가안]. 실제 산출 로직·임계값은 확인 대상이다(정책 7. 7번).
   그 답이 오기 전까지, 화면 안에서는 최소한 점수·색·라벨이 서로 다른 값을 가리키지
   않게 자체 기준을 둔다 — 이전엔 라벨이 고정값이라 range를 바꾸면(byRange 계수 적용)
   점수만 움직이고 라벨·색은 그대로라 서로 어긋나는 표시 오류가 있었다(기획 판단, 2026-08-28) */
const HEALTH_TH = {stable:85, risk:50}; // [가안] 85 이상 안정 · 50~84 주의 · 50 미만 위험
/* 하위 지표 인사이트 — 값이 좋은지 나쁜지를 화살표가 아니라 말로 답한다.
   방향(dir)만 알려주는 것과 판단(양호/주의/위험)을 주는 것은 다르다(기획 판단, 2026-08-28).
   th 임계값은 [가안] — 실제 값이 오면 healthInsight 안 숫자만 바꾼다 */
function healthInsight(v, dir, th){
  if(dir==='low'){
    if(v<=th.good) return {cls:'ok', label:'양호'};
    if(v<=th.warn) return {cls:'wa', label:'주의'};
    return {cls:'cr', label:'위험'};
  }
  if(dir==='high'){
    if(v>=th.good) return {cls:'ok', label:'양호'};
    if(v>=th.warn) return {cls:'wa', label:'주의'};
    return {cls:'cr', label:'위험'};
  }
  return null;
}

function healthLabel(score){
  if(score>=HEALTH_TH.stable) return '안정';
  if(score>=HEALTH_TH.risk) return '주의';
  return '위험';
}

/* ── 탭 2 · 배포 성능 ─────────────────────────── */
function drawPerf(el){
  if(state==='empty'){
    el.innerHTML = emptyBox('표시할 배포가 없습니다.','배포를 생성하면 지표가 수집됩니다.');
    return;
  }
  /* 워크스페이스 합산 요약 — 이 카드 자체는 dep·range를 안 쓴다(워크스페이스
     스코프만으로 계산). */
  let h = wsPerfSummary();
  /* ⚠ "배포 상세"를 그냥 텍스트 라벨(.grouph)로만 뒀는데, 그 아래 건전성·게이트웨이·
     서빙엔진·인프라가 다 이 배포 하나의 상세인데도 서로 남남처럼 개별 카드로 떠 있어
     "배포 상세"라는 껍데기에 속해 있다는 게 안 보인다는 지적을 받았다.
     실제로 카드 셸(depshell)을 만들고, 그 안에서 구분선(depsub)으로 나눈다
     (사용자 지적, 2026-08-28).
     ⚠ 다만 이 프로젝트의 다른 상세 화면들(배포 상세 등)은 섹션마다 각자 카드(.dsec)로
     독립해 쌓는 방식이 관행이었다(가속기 탭 "노드"도 그렇다 — 그룹 헤더 하나 아래
     개별 카드 여럿). 이번 요청은 그 관행과 다르게, 대신 배포 하나의 상세를 통째로
     한 카드 안에 모으는 쪽을 택한 것이다 — 배포 상세 안 하위 항목들끼리는 서로 다른
     자산이 아니라 한 배포를 보는 여러 관점이라 이 경우엔 이쪽이 더 맞는다고 본다 */
  h += '<div class="dsec depshell">';
  h += '<h4>배포 상세</h4>';
  /* 어느 배포를, 어느 시간 범위로 볼지 — 아래 전부가 이 둘에 따라 값이 바뀐다.
     셸의 헤더 컨트롤 자리에 둔다 */
  h += '<div class="rangerow">'+depPick()+rangeSeg()+'</div>';

  /* 확인 필요 항목은 이제 탭 줄 위(#monTrouble)에서 탭과 무관하게 그린다.
     여기서 다시 그리지 않는다(기획 판단, 2026-08-28) */
  /* 건전성 — 점수와 라벨을 함께 둔다. 숫자만으로는 좋은지 나쁜지 알 수 없다 */
  const m = dm();
  /* 돌지 않는 배포는 지표가 없다. 점수 자리에 `-` 를 두고 왜 없는지 밝힌다 */
  const nom = m.score===null;
  /* 점수가 있으면 라벨을 점수에서 직접 뽑는다(healthLabel, [가안]).
     점수가 없는 배포(유휴·오류·중지됨)는 건전성이 아니라 배포 상태를 말하는 것이라
     m.label을 그대로 쓴다 — 이 둘을 같은 축에 두는 것 자체가 별도 확인 대상이다(정책 7. 7번) */
  const curScore = nom? null : +byRange(m.score);
  const hLabel = nom? m.label : healthLabel(curScore);

  h+='<div class="depsub"><h4>건전성'
    + tip('아래 지표를 종합해 산출한 점수입니다. 100에 가까울수록 안정적입니다.')+'</h4>'
    + '<div class="hbox">'
    /* 점수 옆에 링을 둔다. `72 / 100` 은 읽어야 알고 링은 보면 안다.
       색은 라벨과 같은 축을 쓴다 — 안정·주의·위험. 점수·색·라벨이 모두 같은 값(curScore)에서 나온다 */
    +   '<div class="hscore">'
    +     ring(nom? 0 : curScore, HB[hLabel]||'mu')
    +     '<div class="hsv"><b>'+(nom? '<span class="dash">-</span>' : curScore)+'</b>'
    +       (nom? '' : '<small>/ 100</small>')
    +       '<span class="stbadge '+(HB[hLabel]||'mu')+'">'+hLabel+'</span></div>'
    +   '</div>'
    +   '<div class="hitems">'
    /* 값만 두면 얼마나 찼는지는 보이나 오르는 중인지 내리는 중인지는 안 보인다.
       막대(비중)에서 스파크라인(추세)으로 바꿨다 — 대시보드에서 단일 지표는 보통
       "지금 값 + 최근 추세"로 함께 본다(기획 판단, 2026-08-28).
       ⚠ 색을 칠하지 않는다 — 지표마다 좋고 나쁨의 방향이 다르고(정체 지수는 낮을수록,
         연산 효율성은 높을수록 좋다) 임계값이 문서에 없다. 확인 뒤에 색을 넣는다(정책 7. 7번).
       ⚠ 스파크라인 값은 데모 시드로 만든 것이다. 실제 시계열 제공 여부는 백엔드 확인 대상 */
    +     HEALTH.items.map(function(x,ix){
            const raw = m.items[ix];
            const v = raw===null? null : byRange(raw);
            const sd = 'health'+x.t+dep+range;
            const tr = v===null? null : trendOf(sd, x.u);
            /* 인사이트 칩 — 임계값(th)이 있는 지표만 판정한다. dir이 mid인 지표는
               th가 없어 칩을 달지 않는다(구간 미정, 정책 7. 11번) */
            const ins = (v===null || !x.th)? null : healthInsight(+v, x.dir, x.th);
            /* 캡션(주의·위험일 때 상시 노출)과 호버 툴팁이 같은 텍스트(x.d)를
               쓰고 있었다. 캡션이 뜨면 호버는 뺀다 — 이미 보이는 글을 또
               호버로 반복할 이유가 없다(사용자 지적, 2026-08-28) */
            const showCap = ins && ins.cls!=='ok' && x.d;
            return '<div class="hitem"><span class="ht">'+x.t
                + (ins? '<span class="hflag '+ins.cls+'">'+ins.label+'</span>' : '')
                + (x.d && !showCap? tip(x.d) : '')+'</span>'
              + '<span class="hv">'+(v===null? '<span class="dash">-</span>' : v+'<small>'+x.u+'</small>'
                  + (tr? '<span class="htrend">'+tr.arrow+tr.text+'</span>' : ''))+'</span>'
              /* 주의·위험 지표는 설명을 호버 없이 바로 보여준다. 진짜 원인 진단은 아니다 —
                 이 지표가 뭘 재는지 설명해 뭘 조심해야 하는지 짐작하게 하는 것이다.
                 배포 단위 원인·조치(m.why·m.todo)와는 다른 층위다(기획 판단, 2026-08-28) */
              + (showCap ? '<div class="hcap">'+x.d+'</div>' : '')
              /* 값이 없는 지표는 스파크라인도 못 그린다. 자리는 비워 카드 높이를 맞춘다 —
                 들쭉날쭉하면 한 묶음으로 읽히지 않는다 */
              + (v!==null
                 ? '<div class="hspark">'+miniSpark(sd, x.u)+'</div>'
                 : '<div class="hbar-none"></div>')
              + '</div>';
          }).join('')
    +   '</div>'
    + '</div>'
    /* 원인과 조치를 함께 둔다. 점수만 보이면 무엇을 해야 할지 알 수 없다(기술문서 10.5).
       점수·지표를 다 본 뒤 읽는 것이라 아래에 둔다. 안정이면 짚을 것이 없어 두지 않는다 */
    + (m.why ? alertBox(nom? 'crit' : 'warn', m.why, m.todo, nom? goDepBtn() : '') : '')
    + '</div>';

  /* 계층 셋 — 요청이 지나가는 순서다(정책 5.1) */
  /* 계층별 지표도 고른 배포의 값이다. 값이 없으면 `-` 로 두고 사유를 밝힌다 */
  const bind=function(items, vals){
    return items.map(function(x,ix){
      const v = vals[ix];
      return Object.assign({}, x, {v: v===null? '-' : v, nodata: v===null || x.nodata});
    });
  };
  h+=perfSec('게이트웨이','요청이 들어오는 지점입니다.',bind(PERF.gw, m.gw||[null,null,null]))
   + perfSec('서빙 엔진','모델이 실행되는 지점입니다.',bind(PERF.eng, m.eng))
   + perfSec('인프라','자원을 사용하는 지점입니다.',bind(PERF.infra, m.infra));
  h += '</div>'; /* depshell 닫기 */
  el.innerHTML=h;
}

/* ══════════ 라인 차트 ══════════
   시계열은 라인으로 그린다. 축 눈금은 넣지 않는다 — 카드 위 숫자가 지금 값이고
   차트는 흐름을 보는 자리다. 값을 읽어야 하면 그때 축을 붙인다.
   ⚠ 실제 구현은 차트 라이브러리를 쓴다. 여기서는 형태와 배치를 전달한다.

   계열이 둘인 지표는 색과 선 모양을 함께 가른다 — 색만으로 가르면 색각 이상에서 묻힌다 */
const SERIES2 = {
  '게이트웨이': ['들어온 요청','나간 응답'],
  '서빙 엔진':  ['TTFT','TPOT'],
  '인프라':     ['사용률','VRAM']
};

/* 데모 값 — 제목마다 같은 모양이 나오게 고정한다. 새로 그릴 때마다 흔들리면
   무엇이 바뀐 것인지 알 수 없다 */
function seed(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return h; }
function wave(str, n){
  let h=seed(str), out=[];
  for(let i=0;i<n;i++){
    h=(h*1103515245+12345)&0x7fffffff;
    out.push(28 + (h%44) + Math.sin(i/3.1)*11);
  }
  return out;
}
function pathOf(vals, w, hgt){
  const step = w/(vals.length-1);
  return vals.map(function(v,i){
    return (i?'L':'M') + (i*step).toFixed(1) + ' ' + (hgt - v/100*hgt).toFixed(1);
  }).join(' ');
}
/* 건전성 하위 지표용 미니 스파크라인 — 값만 보이던 것에 호버 상세를 더한다.
   lineChart와 같은 방식(data-chart + chartHover)을 쓰되, 계열이 하나뿐이고
   범례가 없어 별도 함수(sparkHover)로 가볍게 둔다(사용자 요청, 2026-08-28) */
function miniSpark(sd, unit){
  const W=100, H=26, N=16;
  const vals = wave(sd, N);
  const d = pathOf(vals, W, H);
  const xt = XTICK[range]||XTICK['1h'];
  const data = JSON.stringify({a:vals.map(function(v){return Math.round(v);}), x:xt.min, n:N, u:unit||''});
  return '<div class="hspark-body" data-chart=\''+data.replace(/'/g,'&#39;')+'\''
   +   ' onmousemove="sparkHover(event,this)" onmouseleave="sparkOut(this)">'
   + '<svg class="hspark-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
   +   '<path class="ar" d="'+d+' L'+W+' '+H+' L0 '+H+' Z"/>'
   +   '<path class="ln" d="'+d+'"/>'
   +   '<line class="cur" x1="0" y1="0" x2="0" y2="'+H+'" vector-effect="non-scaling-stroke" style="display:none"/>'
   + '</svg>'
   + '<div class="ctip" style="display:none"></div>'
   + '</div>';
}
/* lineChart의 chartHover와 같은 방식이나 범례·둘째 계열이 없다. 스파크라인은 카드
   폭이 좁아 말풍선이 카드 밖으로 나가기 쉽다 — 항상 왼쪽에 붙여 잘리지 않게 한다 */
function sparkHover(e, el){
  const d = JSON.parse(el.getAttribute('data-chart').replace(/&#39;/g,"'"));
  const r = el.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const i = Math.round(ratio * (d.n - 1));
  const x = i / (d.n - 1) * 100;

  const ln = el.querySelector('.cur');
  ln.setAttribute('x1', x); ln.setAttribute('x2', x);
  ln.style.display = '';

  const tp = el.querySelector('.ctip');
  tp.innerHTML = '<b>'+relTime(i, d.n, d.x)+'</b><span>'+d.a[i]+d.u+'</span>';
  tp.style.display = '';
  tp.style.left = '0'; tp.style.right = 'auto';
}
function sparkOut(el){
  el.querySelector('.cur').style.display='none';
  el.querySelector('.ctip').style.display='none';
}
/* 워크스페이스 요약 막대 — 구간이 5개로 고정이고 값이 안 바뀌는 정적 막대라
   lineChart처럼 좌표를 추적할 필요가 없다. 구간(호버한 <i>)의 위치만 읽어
   그 자리 위에 말풍선을 띄운다(사용자 요청, 2026-08-28) */
function wsBarHover(e, label, cnt, pct){
  const seg = e.target, bar = seg.parentElement, wrap = bar.parentElement;
  const tp = wrap.querySelector('.ctip');
  const r = seg.getBoundingClientRect(), br = bar.getBoundingClientRect();
  const leftPct = ((r.left + r.width/2 - br.left) / br.width) * 100;
  tp.innerHTML = '<b>'+label+'</b><span>'+cnt+'건 · '+pct+'%</span>';
  tp.style.display = '';
  tp.style.left = Math.max(0, Math.min(80, leftPct))+'%';
}
function wsBarOut(e){
  e.target.parentElement.parentElement.querySelector('.ctip').style.display='none';
}
/* 스파크라인과 같은 값에서 처음과 끝을 비교해 방향만 알린다.
   좋다·나쁘다는 말하지 않는다 — 임계값이 없어 판단할 수 없다(정책 7. 7번) */
function trendOf(sd, unit){
  const vals = wave(sd, 16);
  const delta = Math.round(vals[vals.length-1] - vals[0]);
  if(delta===0) return {arrow:'', text:'변화 없음'};
  return {arrow: delta>0? '\u25b2' : '\u25bc', text: Math.abs(delta)+(unit||'')};
}

/* 시간 범위마다 X축 눈금이 다르다. 왼쪽 끝이 언제인지 보여야 지금 무엇을 보는지 안다.
   lbl은 축에 쓰는 표시 문구, min은 그 구간의 실제 분(정수)이다.
   ⚠ 이전엔 relTime이 lbl 텍스트(`1시간 전`)를 파싱해 단위를 골랐는데, `시간`이 들어간
   문구엔 `분` 이 없어 늘 시간 단위로만 계산됐다 — 1시간 범위 안에서도 호버가
   `지금`·`1시간 전` 둘로만 갈렸다. min을 직접 넘겨 분 단위까지 정확히 계산한다
   (사용자 지적, 2026-08-28) */
const XTICK={
  '1h':  {lbl:['1시간 전','30분 전','지금'], min:60},
  '6h':  {lbl:['6시간 전','3시간 전','지금'], min:360},
  '24h': {lbl:['24시간 전','12시간 전','지금'], min:1440}
};
/* 지표마다 범위가 다르다. 사용률은 0~100 이 고정이고 처리량은 값에 따라 달라진다.
   최댓값을 안 보이면 선이 위로 붙었을 때 그것이 한계인지 아닌지 알 수 없다 */
const YMAX={
  '가속기 사용률':'100%', 'KV 캐시 사용률':'100%', '에러율':'100%',
  '게이트웨이':'2,000 req/s', '서빙 엔진':'2,000 tok/s', '인프라':'100%'
};

function lineChart(title, seedExtra){
  const W=100, H=100, N=32;
  /* 시간 범위와 대상을 씨앗에 넣는다. 넣지 않으면 범위나 배포를 바꿔도 선이 그대로라
     무엇이 달라졌는지 알 수 없다 */
  const sd = title + range + (seedExtra||'');
  const a=wave(sd+'a', N), b=wave(sd+'b', N);
  const two = !!SERIES2[title];
  const lg = SERIES2[title]||[];
  const xt = XTICK[range]||XTICK['1h'];
  const ymax = YMAX[title]||'100%';
  /* 호버 좌표를 계산하려면 값이 필요하다. 요소에 담아 두고 이벤트에서 읽는다 */
  const data = JSON.stringify({a:a.map(function(v){return Math.round(v);}),
                               b:two? b.map(function(v){return Math.round(v);}) : null,
                               lg:lg, x:xt.min, n:N});
  return '<div class="lcbody" data-chart=\''+data.replace(/'/g,'&#39;')+'\''
   +   ' onmousemove="chartHover(event,this)" onmouseleave="chartOut(this)">'
   + '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
   /* 눈금선 셋 — 위·가운데·아래. 값을 가늠하는 최소한만 둔다 */
   + [25,50,75].map(function(y){
       return '<line class="grid" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" vector-effect="non-scaling-stroke"/>';
     }).join('')
   + '<path class="ar" d="'+pathOf(a,W,H)+' L'+W+' '+H+' L0 '+H+' Z"/>'
   + '<path class="ln" d="'+pathOf(a,W,H)+'" vector-effect="non-scaling-stroke"/>'
   + (two ? '<path class="ln2" d="'+pathOf(b,W,H)+'" vector-effect="non-scaling-stroke"/>' : '')
   /* 호버 지시선 — 어느 시점을 읽고 있는지 표시한다 */
   + '<line class="cur" x1="0" y1="0" x2="0" y2="'+H+'" vector-effect="non-scaling-stroke" style="display:none"/>'
   + '</svg>'
   + '<div class="ctip" style="display:none"></div>'
   + '</div>'
   /* Y축 — 최댓값과 0 만 둔다. 눈금을 촘촘히 두면 선이 묻힌다 */
   + '<div class="yax"><span>'+ymax+'</span><span>0</span></div>'
   /* X축 — 시간 범위에 맞춘 세 지점 */
   + '<div class="xax">'+xt.lbl.map(function(t){ return '<span>'+t+'</span>'; }).join('')+'</div>'
   + (two ? '<div class="lgd"><span><i></i>'+lg[0]+'</span>'
          + '<span class="s2"><i></i>'+lg[1]+'</span></div>' : '');
}

/* ── 호버 ──────────────────────────────────────────
   가장 가까운 지점을 잡아 값과 시각을 보인다. 계열이 둘이면 둘 다 보인다 */
function chartHover(e, el){
  const d = JSON.parse(el.getAttribute('data-chart').replace(/&#39;/g,"'"));
  const r = el.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const i = Math.round(ratio * (d.n - 1));
  const x = i / (d.n - 1) * 100;

  const ln = el.querySelector('.cur');
  ln.setAttribute('x1', x); ln.setAttribute('x2', x);
  ln.style.display = '';

  const tp = el.querySelector('.ctip');
  tp.innerHTML = '<b>'+relTime(i, d.n, d.x)+'</b>'
   + '<span><i class="s1"></i>'+(d.lg[0]||'값')+' '+d.a[i]+'</span>'
   + (d.b ? '<span><i class="s2"></i>'+(d.lg[1]||'')+' '+d.b[i]+'</span>' : '');
  tp.style.display = '';
  /* 오른쪽 끝에서는 왼쪽으로 뒤집는다. 화면 밖으로 나가면 읽을 수 없다 */
  tp.style.left = ratio > .6 ? 'auto' : (ratio*100)+'%';
  tp.style.right = ratio > .6 ? ((1-ratio)*100)+'%' : 'auto';
}
function chartOut(el){
  el.querySelector('.cur').style.display='none';
  el.querySelector('.ctip').style.display='none';
}
/* 왼쪽 끝이 전체 구간(totalMin, 분)이면 오른쪽 끝은 `지금` 이다. 그 사이를 분 단위로 나눈다.
   60분이 넘으면 `1시간 20분 전` 처럼 시간+분으로 보여준다 */
function relTime(i, n, totalMin){
  const back = Math.round(totalMin * (1 - i/(n-1)));
  if(back<=0) return '지금';
  if(back<60) return back+'분 전';
  const h = Math.floor(back/60), m = back%60;
  return m? h+'시간 '+m+'분 전' : h+'시간 전';
}

/* 링 게이지 — 0~100 단일 값에 쓴다. 원 둘레를 값만큼 채운다 */
function ring(v, cls){
  const R=26, C=2*Math.PI*R;
  const off = C * (1 - Math.max(0,Math.min(100,v))/100);
  return '<svg class="ring '+cls+'" viewBox="0 0 64 64">'
   + '<circle class="rbg" cx="32" cy="32" r="'+R+'"/>'
   + '<circle class="rfg" cx="32" cy="32" r="'+R+'" '
   +   'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
   + '</svg>';
}

/* 요약 카드는 그 범위의 평균·합계다. 범위를 바꾸면 값도 달라져야 한다 —
   차트만 바뀌고 숫자가 고정이면 무엇을 보고 있는지 어긋난다.
   ⚠ 데모라 범위별 계수를 곱한다. 실제 값은 계측 파이프라인에서 온다 */
const RCOEF={'1h':1, '6h':0.92, '24h':0.86};
function byRange(v){
  if(v==='-' ) return v;
  const num = parseFloat(String(v).replace(/,/g,''));
  if(isNaN(num)) return v;
  const r = num * (RCOEF[range]||1);
  return (num>=1000) ? Math.round(r).toLocaleString() : (num%1? r.toFixed(1) : String(Math.round(r)));
}

function perfSec(title, note, items){
  const nodata = items.every(function(x){ return x.nodata; });
  return '<div class="depsub"><h4>'+title+tip(note)+'</h4>'
    + '<div class="mgrid">'
    +   items.map(function(x){
          /* 건전성 카드와 같은 인사이트 칩을 쓴다(healthInsight 재사용) — 방향(dir)과
             임계값(th)이 있는 지표만 판정한다(사용자 요청, 2026-08-28) */
          const ins = (x.nodata || !x.th) ? null : healthInsight(+byRange(x.v), x.dir, x.th);
          return '<div class="mcard"><div class="mt">'+x.t
            + (ins? '<span class="hflag '+ins.cls+'">'+ins.label+'</span>' : '')
            + (x.d? tip(x.d) : '')+'</div>'
            + '<div class="mv">'+(x.nodata? '<span class="dash">-</span>' : byRange(x.v))+'</div>'
            + '<div class="mu">'+x.u+'</div></div>';
        }).join('')
    + '</div>'
    /* 차트를 통째로 숨기면 지표가 없는 것으로 읽힌다. 축과 틀은 남기고 값만 비운다
       (정책 8. 1번 개정 제안) */
    + '<div class="lchart'+(nodata?' nodata':'')+'">'
    /* 차트 안과 아래에 같은 말을 두 번 두지 않는다. 한 자리에서 상태와 사유를 함께 밝힌다.
       `계측 파이프라인` 은 내부 용어라 쓰지 않는다(공통정책 7.9) */
    +   (nodata ? '<span class="cnote">아직 값이 들어오지 않습니다.</span>' : lineChart(title, dep))
    + '</div>'
    /* 값이 없는 이유는 그 배포가 지금 돌지 않기 때문이다(dm().why) — 세 구간이 같은 사유를
       쓴다. 예전엔 게이트웨이만 "계측 파이프라인 준비 중"이라는 별도 문구를 썼는데,
       게이트웨이도 이제 배포별 값을 갖게 돼(gw) 그 배포가 안 도는 게 진짜 이유다
       (기획 판단, 2026-08-28) */
    + (nodata
       ? '<p class="secnote">'+(dm().why || '값이 수집되지 않았습니다.')+'</p>'
       : '')
    + '</div>';
}

/* ── 탭 3 · 알림 규칙 ─────────────────────────── */
/* 행 메뉴 — 하나만 열리게 하고 바깥을 누르면 닫는다(다른 목업과 같은 규격) */
function tgMore(e,id){
  e.stopPropagation();
  const t=document.getElementById(id), o=t.classList.contains('open');
  document.querySelectorAll('.more').forEach(function(m){ m.classList.remove('open'); });
  if(!o) t.classList.add('open');
}
document.addEventListener('click', function(){
  document.querySelectorAll('.more').forEach(function(m){ m.classList.remove('open'); });
});

/* 알림 규칙 목록 — 다른 목록과 같은 규격을 적용한다(공통정책 3.1·3.3·3.7).
   건수가 적다는 이유로 검색·정렬을 빼지 않는다. 3.7 은 페이지 기준이고
   3.1·3.3 에는 건수 조건이 없다 */
let rq='', rSort='at', rDir='desc', rScope=[], rPage=1, rPer=20;
/* 최근 발생 행 확장 — 트레이스 탭과 같은 방식(한 번에 한 건만, 다시 누르면 접힘) */
let ruleOpen=null;
function toggleRuleFire(i){ ruleOpen = ruleOpen===i? null : i; render(); }

/* 대상 범위 — 그 워크스페이스 안에서의 범위다. `워크스페이스 전체` 로 적으면
   워크스페이스 컬럼과 같은 말이 두 번 나온다 */
const SCOPES=['전체','llama-3-2-1b-prod','gpt-oss-120b-symphony','furiosa-qwen3-32b-npu'];

function ruleList(){
  const q=rq.trim().toLowerCase();
  const dir = rDir==='asc'? 1 : -1;
  return RULES.filter(function(r){
    /* 스위처가 고른 워크스페이스의 규칙만 본다. 대상 범위가 배포면 그 배포의 워크스페이스로 판정한다 */
    /* 규칙에 워크스페이스가 붙어 있으므로 그대로 견준다 */
    if(wsCur!=='전체' && r.ws!==wsCur) return false;
    if(rScope.length && rScope.indexOf(r.scope)<0) return false;
    if(!q) return true;
    return (r.n+' '+metricName(r.metric)+' '+r.scope+' '+(r.ws||'')+' '+r.by).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){
    const k = rSort==='n'? 'n' : 'at';
    return String(a[k]).localeCompare(String(b[k]))*dir;
  });
}
function tgRSort(k){
  if(rSort===k){ rDir = rDir==='asc'? 'desc':'asc'; }
  else { rSort=k; rDir = (k==='at')? 'desc':'asc'; }
  rPage=1; render();
}
function rSortTh(k,label,w){
  const on=rSort===k;
  return '<th class="sortable'+(on?' on':'')+'"'+(w?' style="width:'+w+'"':'')
   + ' onclick="tgRSort(\''+k+'\')">'+label
   + (on? ' <span class="sar">'+(rDir==='asc'?'\u25b2':'\u25bc')+'</span>' : '')+'</th>';
}
function tgRScope(v){ const i=rScope.indexOf(v); if(i<0) rScope.push(v); else rScope.splice(i,1); rPage=1; render(); }
function thFilterScope(){
  return '<span class="thwrap">대상 범위'
   + '<button class="thfilter'+(rScope.length?' on':'')+'" onclick="tgFdd(event)" title="필터">'
   +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>'
   + '</button></span>'
   + '<span class="fdd" onclick="event.stopPropagation()">'
   +   SCOPES.map(function(o){
         /* 필터에서는 `전체` 만으로 무엇의 전체인지 모른다. 라벨을 풀어 쓴다 */
         return '<label><input type="checkbox"'+(rScope.indexOf(o)>=0?' checked':'')
              + ' onchange="tgRScope(\'' + o + '\')"><span>'
              + (o==='전체'? '워크스페이스 전체' : o)+'</span></label>'; }).join('')
   + '</span>';
}
function resetRule(){ rq=''; rScope=[]; rPage=1; render(); }

function drawRules(el){
  const focus = document.activeElement && document.activeElement.id==='rq';
  const pos = focus ? document.activeElement.selectionStart : 0;
  if(!RULES.length || state==='empty'){
    /* 빈 상태에도 진입 수단을 둔다. 헤더 버튼이 있으나 시선이 본문에 있을 때
       바로 시작할 수 있어야 한다(워크스페이스·모델 목업과 같은 규격) */
    el.innerHTML = '<div class="dsec">'
      + emptyBox('등록된 알림 규칙이 없습니다.','임계값을 설정하면 초과 시 알림이 발생합니다.',
                 canEdit()? '<button class="btn" onclick="openRule(-1)">규칙 추가</button>' : '')
      + '</div>';
    return;
  }
  const rows=ruleList();
  const filtered = rq || rScope.length;
  const tot=rows.length, pages=Math.max(1,Math.ceil(tot/rPer));
  if(rPage>pages) rPage=pages;
  const view=rows.slice((rPage-1)*rPer, rPage*rPer);

  /* .tblwrap 이 이미 카드다. .dsec 로 한 번 더 감싸지 않는다 —
     다른 목업은 목록에 .dsec 를 쓰지 않는다 */
  el.innerHTML = toolbarRule()
    + (view.length ? '' : searchEmpty())
    + (view.length
    ? '<div class="tblwrap"><table class="tbl"><thead><tr>'
    + rSortTh('n','규칙명')
    + '<th>감시 대상</th>'
    + '<th class="thcell">'+thHelp('cond','조건')+'</th>'
    /* 스위처가 워크스페이스를 고르면 이 열이 한 값으로 고정된다. 같은 값이 열 줄
       반복되므로 `전체` 일 때만 둔다 — 배포 드롭다운과 같은 기준이다.
       `대상 범위` 는 그 워크스페이스 안에서 전체인지 특정 배포인지다 */
    + (wsCur==='전체' ? '<th style="width:132px">워크스페이스</th>' : '')
    + '<th class="thcell">'+thFilterScope()+'</th>'
    + '<th>알림 채널</th>'
    /* 최근 발생 — 규칙이 등록만 되고 실제로 울리는지는 목록만으론 알 수 없다.
       가장 최근 발생 시각을 두고, 눌러서 펴면 최근 5건을 본다(확정 문서 4장 #2) */
    + '<th class="thcell">'+thHelp('fire','최근 발생')+'</th>'
    + '<th>등록자</th>'
    + rSortTh('at','등록일시','148px')
    + '<th style="width:64px">작업</th></tr></thead><tbody>'
    + view.map(function(r){
        const i=RULES.indexOf(r);
        const hasFire = r.fires && r.fires.length;
        const open = ruleOpen===i;
        return '<tr'+(hasFire?' style="cursor:pointer" onclick="toggleRuleFire('+i+')"':'')+'>'
          + '<td><span class="rname">'+r.n+'</span></td>'
          + '<td>'+metricName(r.metric)+'</td>'
          /* 조건을 한 문장으로 읽히게 둔다. 컬럼을 셋으로 나누면 눈이 오간다 */
          + '<td>'+r.th+metricUnit(r.metric)+' '+r.op+'가 '+r.dur+'초 지속</td>'
          + (wsCur==='전체' ? '<td><span class="mver">'+(r.ws||dash())+'</span></td>' : '')
    + '<td>'+r.scope+'</td>'
          + '<td>'+(r.ch.length? r.ch.join(' · ') : dash())+'</td>'

/* 목록 안 요약 막대 — 구간 비중만 보인다. 자세한 것은 펼쳐서 본다 */
function miniSpan(x){
  const by={};
  x.spans.forEach(function(s){ by[s.s]=(by[s.s]||0)+s.d; });
  return '<div class="ubar">'
   + ['gateway','api','engine'].map(function(k){
       if(!by[k]) return '';
       const pc=by[k]/x.tot*100;
       return '<i class="'+SPANC[k]+'" style="width:'+pc+'%" title="'+by[k]+'ms · '+Math.round(pc)+'%"></i>';
     }).join('')
   + '</div>';
}

/* Waterfall — 스팬을 시작 시각만큼 밀고 지속 시간만큼 그린다.
   어느 구간에서 시간이 먹혔는지 가로 위치로 드러난다.
   ⚠ 예전엔 구간별 소요 → 입출력 → 진단을 세로로 쌓았는데, 900px 고정폭 1단이라
   표 전체 폭(펼친 행) 안에서 오른쪽이 비어 있었다. 좌(구간별 소요)·우(입출력)
   2단으로 바꾸고, 진단은 입출력 위로 올린다 — 결론(진단)을 원문보다 먼저
   읽게 한다(결정만 해두고 코드에 안 넣었던 것을 반영, 2026-08-28) */
function waterfall(x){
  /* 진단 — 결론을 먼저 읽도록 입출력 칼럼 맨 위에 둔다 */
  const diag = (x.st==='실패')
     ? alertBox('crit','프리필 단계에서 응답이 끊겼습니다.','서빙 엔진 파드가 응답하지 않습니다. 진단 로그에서 그 시각의 컨테이너 로그를 확인해 주세요.')
     : (x.st==='느림'
        ? alertBox('warn','프리필이 전체의 '+Math.round(x.spans.find(function(s){return s.n.indexOf('프리필')>=0;}).d/x.tot*100)+'%를 차지했습니다.',
                   '입력 토큰이 길면 프리필이 길어집니다. 최대 컨텍스트 길이를 줄이거나 PD 분리 배치를 검토해 주세요.')
        : '');
  return '<div class="wfbox">'
   /* 왼쪽 — 얼마나 걸렸나 */
   + '<div class="wf-col">'
   +   '<div class="wf-h">구간별 소요 <span class="wf-tot">전체 '+x.tot.toLocaleString()+'ms</span></div>'
   +   x.spans.map(function(s){
         const l=s.at/x.tot*100, w=Math.max(s.d/x.tot*100, .6);
         return '<div class="wf-r'+(s.err?' err':'')+'">'
          + '<div class="wf-n">'+s.n+(s.err? '<span class="wf-e">실패</span>' : '')+'</div>'
          + '<div class="wf-t">'
          +   '<i class="'+SPANC[s.s]+'" style="left:'+l+'%;width:'+w+'%"></i>'
          + '</div>'
          + '<div class="wf-d">'+s.d.toLocaleString()+'ms</div>'
          + '</div>';
       }).join('')
   + '</div>'
   /* 오른쪽 — 무엇을 주고받았나. 같은 요청의 두 면이라 나란히 둔다.
      게이트웨이 단에서 수집하므로 외부 배포도 입출력은 볼 수 있다 */
   + '<div class="wf-col">'
   +   diag
   +   '<div class="io">'
   +     '<div class="wf-h">주고받은 내용'
   +       '<span class="wf-tot">'+(x.key? 'API Key '+x.key : '')+'</span></div>'
   +     '<div class="io-r"><div class="io-t">입력<span>'+x.tok.in+' 토큰</span></div>'
   +       '<pre class="io-b">'+esc2(x.io.in)+'</pre></div>'
   +     '<div class="io-r"><div class="io-t">출력<span>'+x.tok.out+' 토큰</span></div>'
   +       (x.io.out
          ? '<pre class="io-b">'+esc2(x.io.out)+'</pre>'
          : '<div class="io-none">응답이 생성되지 않았습니다.</div>')+'</div>'
   +   '</div>'
   + '</div>'
   + '</div>';
}

function tgFeed(k){ const i=feedOn.indexOf(k); if(i<0) feedOn.push(k); else feedOn.splice(i,1); render(); }

function drawLogs(el){
  if(state==='empty'){
    el.innerHTML = emptyBox('표시할 로그가 없습니다.','배포가 기동되면 로그가 쌓입니다.');
    return;
  }
  const rows=(LOGS[dep]||[]).filter(function(x){
    if(x.f==='hc') return !hideHc;
    return feedOn.indexOf(x.f)>=0;
  });

  let h = '<div class="rangerow">'
    + depPick()
    + rangeSeg() + '</div>';

  /* 피드 선택 — 셋을 섞어 보는 것이 이 화면의 목적이라 기본은 전부 켬 */
  h += '<div class="feedbar">'
    + FEEDS.map(function(p){
        return '<label class="chk"><input type="checkbox"'+(feedOn.indexOf(p[0])>=0?' checked':'')
         + ' onchange="tgFeed(\'' + p[0] + '\')"><span class="cbx"></span>'
         + '<span class="cbt"><i class="fdot '+p[0]+'"></i>'+p[1]+'</span></label>';
      }).join('')
    + '<span class="fsep"></span>'
    /* 헬스체크는 몇 초마다 찍혀 다른 줄을 밀어낸다. 기본으로 감춘다(기술문서 10.4) */
    + '<label class="chk"><input type="checkbox"'+(hideHc?' checked':'')
    +   ' onchange="tgHc(this.checked)"><span class="cbx"></span>'
    +   '<span class="cbt">헬스체크 감추기</span></label>'
    + '</div>';

      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>'

         ? '<h3>표시할 로그가 없습니다.</h3><p>피드를 하나 이상 선택해 주세요.</p>'
         : '<h3>수집된 로그가 없습니다.</h3>'
           + '<p>배포가 기동되면 로그가 쌓입니다. 배포 상세에서 상태를 확인해 주세요.</p>'

function feedName(k){
  if(k==='hc') return '헬스체크';
  const p=FEEDS.find(function(x){ return x[0]===k; });
  return p? p[1] : k;
}
function esc2(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ── 슬롯 상세 패널 ───────────────────────────── */
function openSlot(nodeName, no){
  const nd=visibleNodes().find(function(x){ return x.n===nodeName; });
  if(!nd) return;
  const x=nd.slots.find(function(s){ return s.no===no; });
  if(!x) return;
  curSlot={nd:nd, s:x};
  const dead = x.st==='확인 불가';
  document.getElementById('spName').innerHTML =
    '슬롯 #'+x.no+'<span class="mver">'+nd.n+'</span>';
  /* 같은 배포가 쓰는 다른 슬롯 — 배포 하나가 여러 장을 쓰면 한 장만 봐서는 판단이 안 선다 */
  /* 배포가 여럿이면 그중 하나라도 겹치는 슬롯을 모은다 */
  const sib = x.by.length
    ? visibleNodes().reduce(function(a,n2){
        n2.slots.forEach(function(s2){
          const same = s2.by.some(function(d){ return x.by.indexOf(d)>=0; });
          if(same && !(n2.n===nd.n && s2.no===x.no)) a.push({n:n2.n, no:s2.no});
        });
        return a;
      }, [])
    : [];

  document.getElementById('spBody').innerHTML =
      '<div class="pnsum">'+vendorBadge(x.dev)+x.dev
    +   '<span class="mver">'+x.id+'</span>'
    +   '<span class="stbadge '+(SLOTB[x.st]||'mu')+'">'+x.st+'</span></div>'
    /* 표는 지금 값이고 패널은 추이다. 같은 71°C 라도 원래 그랬는지 방금 올랐는지에 따라
       판단이 갈린다 — 그것이 패널에 오는 이유다.
       ⚠ 슬롯 단위 시계열 조회 API 는 확인 대상(정책 7. 13번) */
    + '<div class="rangerow">'+rangeSeg()+'</div>'
    + (dead
       ? ''
       : '<div class="dsec"><h4>연산 코어<span class="pnv">'+x.core+'%</span></h4>'
         + '<div class="lchart sm">'+lineChart('slot'+x.no+'core')+'</div></div>'
       + '<div class="dsec"><h4>VRAM<span class="pnv">'+x.vram.use.toFixed(1)+' / '+x.vram.cap+' GB</span></h4>'
         + '<div class="lchart sm">'+lineChart('slot'+x.no+'vram')+'</div></div>'
       + '<div class="dsec"><h4>온도<span class="pnv">'+x.temp+'°C</span></h4>'
         + '<div class="lchart sm">'+lineChart('slot'+x.no+'temp')+'</div></div>'
       + '<div class="dsec"><h4>전력<span class="pnv">'+x.pw+'W</span></h4>'
         + '<div class="lchart sm">'+lineChart('slot'+x.no+'pw')+'</div></div>')
    /* 점유 배포는 링크로만 둔다. 조치는 그 배포 화면에서 한다(공통정책 2.1 · 정책 1장 원칙 2) */
    + '<div class="dsec"><h4>점유 배포</h4>'
    /* 공유 슬롯은 배포가 여럿이다. 하나씩 줄을 나눠 각각 링크로 둔다 */
    +   (x.by.length
        ? '<dl class="dl">'
          + x.by.map(function(d){
              return '<dt>배포</dt><dd><button class="lnk" onclick="act(\'배포 상세로 이동합니다.\')">'+d+'</button></dd>';
            }).join('')
          + '</dl>'
        : '<div class="emptyline">이 슬롯을 쓰는 배포가 없습니다.</div>')
    + '</div>'
    /* 배포가 여러 장을 쓰면 나머지도 함께 봐야 한다 — 한 장만 보고는 판단이 안 선다 */
    + (sib.length
       ? '<div class="dsec"><h4>같은 배포가 쓰는 슬롯</h4>'
         + sib.map(function(y){
             return '<button class="lnk sibrow" onclick="openSlot(\''+y.n+'\','+y.no+')">'
              + y.n+' 슬롯 '+y.no+'</button>';
           }).join('')
         + '</div>'
       : '')
    + (dead
       ? alertBox('warn','상태를 읽지 못했습니다.','가속기가 응답하지 않거나 수집 에이전트가 끊긴 상태입니다. 노드를 확인해 주세요.')
       : '');
  document.getElementById('slotPanel').classList.add('on');
}
function closeSlot(){
  const p=document.getElementById('slotPanel');
  if(p) p.classList.remove('on');
  curSlot=null;
}
/* 패널은 닫기 버튼과 ESC 로 닫는다. 배경 클릭을 가로채는 레이어를 두지 않는다
   (공통정책 4.2.4·4.2.5) */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(document.getElementById('mdRule').classList.contains('on')){ closeRule(); return; }
  if(document.getElementById('mdConfirm').classList.contains('on')){ closeConfirm(); return; }
  closeSlot();
});

  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>',
  warn: '<path d="M10.3 3.9 2.4 18a1.8 1.8 0 0 0 1.6 2.7h16a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  crit: '<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>'
};
function alertBox(kind,title,body,act){
  return '<div class="alertbox '+kind+'">'
    + '<svg class="aic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
    +   (ALERT_IC[kind]||ALERT_IC.info)+'</svg>'
    + '<div class="atx">'
    +   (title? '<b>'+title+'</b>' : '')
    +   (body || '')
    /* 조치를 말했으면 갈 길을 준다(정책 1장 원칙 5). 라이브러리 `.aact` 규격 */
    +   (act || '')
    + '</div></div>';
}

/* 배포 상세로 가는 버튼 — 조치가 그 화면에서 이뤄지는 경우에 붙인다 */
function goDepBtn(label){
  return '<div class="aact"><button class="btn ghost sm" onclick="act(\'' + dep + ' 상세로 이동합니다.\')">'
   + (label||'배포 상세로')+'<span class="ar">\u2192</span></button></div>';
}
function emptyBox(title,body,action){
  return '<div class="state">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'
    + '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>'
    + '<h3>'+title+'</h3><p>'+body+'</p>'+(action||'')+'</div>';
}
function skel(){
  let r='';
  for(let i=0;i<6;i++) r+='<div class="skrow" style="margin:'+(i?'14px':'0')+' 0 0;width:'+[92,78,86,70,88,74][i]+'%"></div>';
  return '<div class="tblwrap" style="padding:18px 20px">'+r+'</div>';
}
function errBox(){
  return '<div class="state">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'
    + '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'
    + '<h3>데이터를 불러오지 못했습니다.</h3><p>잠시 후 다시 시도해 주세요.</p>'
    + '<button class="btn ghost" onclick="setState(\'default\')">다시 시도</button></div>';
}

/* 확인 알럿 · 토스트 — 배포 목업과 같은 규격 */
function openConfirm(title,body,onOk,okLabel){
  document.getElementById('cfTitle').textContent=title;
  document.getElementById('cfBody').innerHTML=body;
  const ok=document.getElementById('cfOk');
  ok.textContent=okLabel||'확인';
  ok.className='btn'+(okLabel==='삭제'?' danger':'');
  ok.onclick=function(){ closeConfirm(); if(onOk) onOk(); };
  document.getElementById('mdConfirm').classList.add('on');
}
function closeConfirm(){ document.getElementById('mdConfirm').classList.remove('on'); }

function toast(t,msg){
  const w=document.getElementById('toasts');
  const d=document.createElement('div');
  d.className='toast '+t;
  d.innerHTML='<span class="dot"></span><span>'+msg+'</span>'
    + '<button class="x" onclick="this.parentNode.remove()">✕</button>';
  w.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}
function act(msg){ toast('ok',msg); }

/* 데모 바 */
function setState(s,btn){
  state=s;
  if(btn){ document.querySelectorAll('#demoBar .st').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
  render();
}
function setRole(r,btn){
  role=r; tab=0; closeSlot();
  document.querySelectorAll('#demoBar .rl').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  /* 퍼스널 영역은 GNB 하단 — 워크스페이스를 벗어난 자리라 플랫폼 역할만 표시한다.
     워크스페이스 역할은 대상마다 달라 한 값으로 적을 수 없다 */
  document.getElementById('roleName').textContent = isSuper()? '최고 관리자' : '일반 사용자';
  render();
}

drawWsBtn();
render();
</script>
