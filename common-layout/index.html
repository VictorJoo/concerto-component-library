<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콘체르토 매니저 · 레이아웃 (전사 공통 규격, 7/16 검토용)</title>
<!--
  콘체르토 매니저 — 공통 레이아웃 목업 (프론트 핸드오프용)
  작성: 서비스파트 기획 / 2026-07-14 회의 결정 반영

  [구성]
  · 헤더        : 로고 · 워크스페이스 전환  (언어는 퍼스널 영역으로 이관)
  · 좌측 GNB(6) : 개요 · 워크스페이스 · 모델 · 배포 · 모니터링 · 플랫폼 설정
  · 플랫폼 설정 : 호버 시 플라이아웃 서브메뉴(사용자 및 역할·보안 및 감사·외부 연동·알림 채널) / 스토리지 연결은 화면 제외
  ·                (승인 처리·이력은 플랫폼 설정이 아니라 '내 작업함'에서 처리)
  · 사이드바 하단: 내 작업함(신규) · 알림 · 마이페이지(프로필·접속이력·테마 전환·로그아웃)

  [사용법]
  · 하단 우측 [변경 요소 표시] : TO-BE 변경 영역 강조 ON/OFF

  ※ 실제 아이콘·색·간격은 디자인 라이브러리로 확정. 본 파일은 구조·배치 전달용.
-->
<style>
  :root{
    --bg:#0a0b0e; --sidebar:#0f1115; --flyout:#161b26; --card:#15181e; --card-2:#1a1e25;
    --border:#23262d; --border-soft:#1c1f26;
    --text:#e8eaed; --muted:#969ca6; --faint:#5c626c;
    --active:#242932; --accent:#6f9bef; --tobe:#c98adf;
    --ok:#46b17f; --warn:#d9a441; --crit:#e0585f;
    --header-h:58px; --gnb-w:236px; --radius:12px;
    --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{display:grid;grid-template-columns:var(--gnb-w) 1fr;grid-template-rows:var(--header-h) 1fr;height:100vh;overflow:hidden;grid-template-areas:"brand header" "gnb main"}

  /* 브랜드(로고 텍스트) */
  .brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--sidebar);border-bottom:1px solid var(--border-soft)}
  .logo-mark{display:grid;place-items:center;width:24px;height:24px;flex:0 0 auto;color:#ffffff}
  .logo-mark svg{width:24px;height:24px}
  .brand b{font-size:15.5px;font-weight:700}

  /* 헤더 */
  .header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--sidebar);border-bottom:1px solid var(--border-soft)}
  .breadcrumb{color:var(--muted);font-size:13px}.breadcrumb b{color:var(--text);font-weight:600}
  .hr{display:flex;align-items:center;gap:9px}
  .ws{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;font-size:13px}
  .ws .chev{color:var(--muted)}
  .ico{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;position:relative;color:var(--muted);background:transparent}
  .ico:hover{background:var(--card-2);border-color:var(--border);color:var(--text)}
  .ico svg{width:18px;height:18px}
  .dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--crit)}

  /* GNB(사이드바) */
  .gnb{grid-area:gnb;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border-soft);overflow:visible}
  /* 브랜드 배너(전사 공통 규격) */
  .banner{margin:14px 12px 8px;height:120px;border-radius:12px;background:linear-gradient(135deg,#3a56c9,#5b76e6);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 18px}
  .banner .bt{font-size:20px;font-weight:800;color:#fff;line-height:1.1;z-index:1}
  .banner::after{content:"";position:absolute;right:-20px;top:-20px;width:160px;height:160px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.12),transparent 55%)}
  .banner .ph-tag{position:absolute;bottom:8px;right:10px;font-size:9px;color:rgba(255,255,255,.6);z-index:1}
  .nav{padding:6px 12px;flex:0 0 auto}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:3px;position:relative}
  .nav a svg{width:19px;height:19px;flex:0 0 auto}
  .nav a:hover{background:var(--card);color:var(--text)}
  .nav a.active{background:var(--active);color:#fff;font-weight:600}
  .nav a.has-fly::after{content:"›";margin-left:auto;color:var(--faint);font-size:16px}

  /* 플라이아웃 (플랫폼 설정 호버 시) */
  .flywrap{position:relative}
  .flyout{position:absolute;left:calc(100% + 6px);top:0;width:210px;background:var(--flyout);border:1px solid var(--border);border-radius:11px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateX(-6px);transition:.13s;z-index:70}
  .flywrap:hover .flyout{opacity:1;visibility:visible;transform:translateX(0)}
  .flyout .fh{font-size:11px;color:var(--faint);padding:4px 10px 8px;letter-spacing:.3px;text-transform:uppercase}
  .flyout a{display:flex;align-items:center;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:2px}
  .flyout a:hover{background:var(--card);color:var(--text)}
  .flyout a.on{background:var(--active);color:#fff;font-weight:600}
  .flyout a .tb{font-size:9.5px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;margin-left:6px}
  .flyout .note{margin-top:8px;padding:9px 10px;border:1px dashed #6b4e86;border-radius:8px;font-size:10.5px;color:#d8b6ea;line-height:1.5}
  .flyout .note b{color:var(--tobe)}

  /* 하단 영역: 내 작업함 + 퍼스널 */
  .gnb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border-soft)}
  .worklist{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--text);background:var(--card);border:1px solid var(--border);position:relative;margin-bottom:8px}
  .worklist svg{width:19px;height:19px;color:var(--muted)}
  .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#0a0b0e;font-size:12px;font-weight:700;display:grid;place-items:center}
  .tobe-dot{width:7px;height:7px;border-radius:50%;background:var(--tobe);position:absolute;top:-3px;left:-3px;box-shadow:0 0 0 3px var(--sidebar)}

  .notice-common{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:8px;position:relative}
  .notice-common svg{width:19px;height:19px}
  .notice-common:hover{background:var(--card);color:var(--text)}
  .notice-common .rdot2{position:absolute;left:24px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--crit)}
  .persona{position:relative}
  .persona .pbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--card-2);border:1px solid var(--border);cursor:pointer}
  .persona .pbtn:hover{border-color:#3a4152}
  .av{width:30px;height:30px;border-radius:50%;background:#2c3240;display:grid;place-items:center;font-size:12px;color:#cdd6ff;flex:0 0 auto}
  .persona .who{line-height:1.25;min-width:0}
  .persona .who b{font-size:13px;display:block}
  .persona .who span{font-size:11px;color:var(--faint)}
  .persona .up{margin-left:auto;color:var(--faint)}
  .pmenu{position:absolute;left:0;bottom:calc(100% + 8px);width:100%;background:var(--flyout);border:1px solid var(--border);border-radius:11px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(6px);transition:.13s;z-index:70}
  .persona.open .pmenu{opacity:1;visibility:visible;transform:translateY(0)}
  .persona.open .pbtn{border-color:#3a4152}
  .persona .up{transition:transform .15s}
  .persona.open .up{transform:rotate(180deg)}
  .pmenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px}
  .pmenu a:hover{background:var(--card);color:var(--text)}
  .pmenu a svg{width:16px;height:16px}
  .pmenu .theme{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;font-size:13px;color:var(--muted)}
  .toggle{width:38px;height:20px;border-radius:11px;background:var(--card-2);border:1px solid var(--border);position:relative}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
  .pmenu hr{border:0;border-top:1px solid var(--border-soft);margin:6px 0}
  .pm-head{display:flex;align-items:center;gap:10px;padding:6px 10px 8px}
  .pm-head .av{width:32px;height:32px;flex:0 0 auto}
  .pm-who{line-height:1.35;min-width:0}
  .pm-who b{font-size:13px;display:block}
  .pm-who span{font-size:11px;color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 화면 본문 플레이스홀더 (레이아웃 전달용 — 내용은 화면정의서에서) */
  .body-ph{border:1px dashed #2c313d;border-radius:12px;min-height:340px;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center;line-height:1.9;background:repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(255,255,255,.012) 12px,rgba(255,255,255,.012) 24px)}
  .body-ph b{color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
  /* 마이페이지 */
  .mp-form{max-width:560px}
  .mp-sec{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:20px 22px;margin-bottom:14px}
  .mp-sec h3{font-size:14px;margin:0 0 14px}
  .mp-f{margin-bottom:14px}
  .mp-f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .mp-f input{width:100%;padding:9px 12px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
  .mp-f input:disabled{color:var(--faint)}
  .mp-act{display:flex;justify-content:flex-end;gap:8px}
  .mp-hint{font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5}
  .btn-ghost2{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;font-family:inherit;cursor:pointer}
  .btn-ghost2:hover{border-color:#3a4152;color:var(--text)}
  .mp-sel{width:100%;padding:9px 12px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
  .mp-tg{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
  .mp-tg span{font-size:13px;color:var(--muted)}
  /* 2안: 언어·테마를 마이페이지로 → 팝오버에서 숨김 */
  body.opt2 #langRow, body.opt2 #langList, body.opt2 #themeRow, body.opt2 #hrLang, body.opt2 #hrTheme, body.opt2 #pwRow{display:none}
  body:not(.opt2) #mpPrefs, body:not(.opt2) #mpSec{display:none}
  /* 언어: 한 줄 → 클릭 시 인라인 펼침 */
  .lang-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
  .lang-row:hover{background:var(--card);color:var(--text)}
  .lang-row svg.gl{width:16px;height:16px;flex:0 0 auto}
  .lang-row .cur{margin-left:auto;color:var(--faint);font-size:12px}
  .lang-row .cv{margin-left:6px;color:var(--faint);transition:transform .15s}
  .lang-row .cv svg{width:13px;height:13px;display:block}
  .lang-row.open .cv{transform:rotate(180deg)}
  .lang-list{max-height:0;overflow:hidden;transition:max-height .18s ease}
  .lang-list.open{max-height:140px}
  .lang-list button{display:flex;align-items:center;width:100%;gap:10px;padding:8px 10px 8px 36px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-size:12.5px;text-align:left;cursor:pointer}
  .lang-list button:hover{background:var(--card);color:var(--text)}
  .lang-list button .ck{margin-left:auto;color:var(--accent);opacity:0}
  .lang-list button.sel .ck{opacity:1}
  .lang-list button.sel{color:var(--text)}
  .lang-list button .ck svg{width:14px;height:14px;display:block}


  /* 확정 전 영역 — 블러 처리 */
  .mp-sec.tbd{position:relative;overflow:hidden}
  .mp-sec.tbd > *:not(.tbd-tag){filter:blur(3.5px);opacity:.5;user-select:none;pointer-events:none}
  .tbd-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(21,24,30,.94);border:1px dashed #4a3a5c;border-radius:9px;padding:9px 14px;font-size:12px;color:#d8b6ea;white-space:nowrap;text-align:center;line-height:1.7}
  .tbd-tag b{display:block;color:var(--tobe);font-size:12.5px;margin-bottom:1px}

  /* 메인 영역 — 이 안에서만 스크롤(GNB·헤더 고정) */
  .main{grid-area:main;overflow-y:auto;overflow-x:hidden;padding:24px 28px;min-height:0}

  /* 하단 중앙 옵션 바 */
  .abbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 12px;box-shadow:0 6px 22px rgba(0,0,0,.5)}
  .abbar .lb{color:var(--faint);font-size:12px}
  .abbar button{border:1px solid var(--border);background:var(--card-2);color:var(--muted);padding:6px 11px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer}
  .abbar button:hover{border-color:#3a4152;color:var(--text)}
  .abbar button.on{background:var(--active);color:#fff;border-color:#3a4152}

  /* === TO-BE 변경 요소 강조 (토글) === */
  .tobe-el{position:relative}
  body.show-tobe .tobe-el{outline:1.5px dashed var(--tobe);outline-offset:2px;border-radius:9px}
  body.show-tobe .tobe-el::before{content:attr(data-tobe-label);position:absolute;left:50%;top:-9px;transform:translate(-50%,-100%);background:#2a1830;border:1px solid #6b4e86;color:#e8d4f2;font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:85;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  /* 배너용(아래쪽 라벨) */
  body.show-tobe .tobe-el.lbl-bottom::before{top:auto;bottom:-9px;transform:translate(-50%,100%)}
  .switchbar{position:fixed;right:16px;bottom:16px;z-index:90;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;box-shadow:0 6px 22px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .switchbar .sw{width:38px;height:20px;border-radius:11px;background:var(--card-2);border:1px solid var(--border);position:relative;transition:.15s}
  .switchbar .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--faint);transition:.15s}
  body.show-tobe .switchbar .sw{background:rgba(201,138,223,.3);border-color:#6b4e86}
  body.show-tobe .switchbar .sw::after{left:20px;background:var(--tobe)}

  /* 페이지 내용(동작 목업) */
  #page .cards3{display:grid;grid-template-columns:1fr 1.1fr 1.4fr;gap:14px;margin-bottom:14px}
  #page .cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  #page .muted-s{color:var(--faint);font-size:12px;margin-top:6px}
  #page .big{font-size:30px;font-weight:800;margin-top:10px}
  #page .big small{font-size:13px;color:var(--muted);font-weight:600}
  #page .li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--border-soft);font-size:12.5px}
  #page .li:first-of-type{border-top:0;margin-top:6px}
  #page .li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  #page .tg{font-size:9.5px;padding:2px 5px;border-radius:5px;border:1px solid var(--border);color:var(--muted)}
  #page .res{background:var(--card-2);border:1px solid var(--border);border-radius:9px;padding:10px;margin-top:8px}
  #page .res .rn{font-weight:700;font-size:12.5px;margin-bottom:7px}
  #page .bar{height:5px;background:#20242c;border-radius:4px;overflow:hidden;margin:5px 0}
  #page .bar>span{display:block;height:100%;background:var(--accent)}
  #page .big-bar{height:8px;margin:12px 0 8px}
  #page .empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
  #page .st-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border-soft);font-size:13px}
  #page .st-row:first-of-type{border-top:0}
  #page .st-row .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
  #page .d.ok{background:var(--ok)}#page .d.wa{background:var(--warn)}#page .d.cr{background:var(--crit)}
  #page .ph-row{display:flex;align-items:flex-start;justify-content:space-between}
  #page .ws-card .ws-h{font-size:15px;font-weight:700;margin-bottom:4px}
  #page .chips{display:flex;gap:6px;margin:12px 0}
  #page .chip{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
  #page .chip.ok{color:#8ee0b4;border-color:#2c5c44}
  #page .chip.cr{color:#ff9ba0;border-color:#5c2c30}
  #page .ws-f{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border-soft);padding-top:11px;margin-top:4px}
  #page .ws-f a{color:var(--accent);text-decoration:none}
  #page .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
  #page .tab{padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
  #page .tab.on{color:#fff;border-bottom-color:var(--accent)}
  .toolbar{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;box-shadow:0 6px 22px rgba(0,0,0,.5);font-size:11.5px;color:var(--muted)}
  .toolbar b{color:var(--tobe)}
</style>
</head>
<body class="opt2">
<div class="abbar">
  <span class="lb">언어 · 테마 위치</span>
  <button id="optA" onclick="setOpt(1)">1안 · 팝오버</button>
  <button id="optB" class="on" onclick="setOpt(2)">2안 · 마이페이지</button>
</div>
<div class="app">

  <div class="brand"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9.2" stroke-width="1.4" opacity="0.35"/><circle cx="12" cy="12" r="6" stroke-width="1.5" opacity="0.6"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span><b>Concerto AI</b></div>

  <header class="header">
    <div class="breadcrumb">콘체르토 플랫폼 / <b>플랫폼 설정</b></div>

function setCrumb(main, sub){
  var el=document.querySelector('.breadcrumb');
  el.innerHTML = '콘체르토 플랫폼 / <b>'+ (sub? main+' ▸ '+sub : main) +'</b>';
}
function render(key, subLabel){
  var p=PAGES[key]; if(!p) return;
  document.getElementById('page').innerHTML = p.html;
  setCrumb(p.crumb, subLabel || p.sub);
}
function nav(key){
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  var link=document.querySelector('.nav a[data-page="'+key+'"]');
  if(link) link.classList.add('active');
  render(key);
  return false;
}
function go(key){
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  render(key);
  document.querySelector('.main').scrollTop=0;
  return false;
}
function navSub(key, label){
  nav(key);
  // 플라이아웃 항목 활성 표시
  document.querySelectorAll('.flyout a').forEach(function(a){a.classList.toggle('on', a.textContent.indexOf(label)===0)});
  render(key, label);
  return false;
}
// 초기 개요 렌더
render('overview');

// 모든 '#' 링크의 기본 이동을 막음 (아티팩트 외부링크 모달 방지)
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[href="#"]');
  if(a){ e.preventDefault(); }
}, true);

function togglePersona(e){
  if(e) e.stopPropagation();
  document.querySelector('.persona').classList.toggle('open');
}
function openPersona(){
  document.querySelector('.persona').classList.add('open');
}
document.addEventListener('click',function(e){
  var p=document.querySelector('.persona');
  if(p && !p.contains(e.target) && !e.target.closest('.abbar')) p.classList.remove('open');
});
function setOpt(n){
  document.body.classList.toggle('opt2', n===2);
  document.getElementById('optA').classList.toggle('on', n===1);
  document.getElementById('optB').classList.toggle('on', n===2);
  openPersona();                    // 차이를 바로 볼 수 있게 팝오버를 연다
  if(n===2) render('mypage');       // 2안은 마이페이지에 설정이 있으므로 함께 표시
}
function toggleLang(e){
  e.stopPropagation();
  document.getElementById('langRow').classList.toggle('open');
  document.getElementById('langList').classList.toggle('open');
}
function pickLang(btn,name){
  event.stopPropagation();
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('langCur').textContent=name;
  document.getElementById('langRow').classList.remove('open');
  document.getElementById('langList').classList.remove('open');
}
