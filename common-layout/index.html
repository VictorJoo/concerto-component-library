<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>콘체르토 매니저 · 공통 레이아웃 (v0.2)</title>
  <!--
    콘체르토 매니저 — 공통 레이아웃 (프론트 핸드오프용) v0.2
    · 컴포넌트 라이브러리 v0.1 색상 토큰에 맞춤.
    · 언어·테마 위치: 1안(프로필 팝오버) 확정 반영.
    · 프로토타입 비교 요소(안 토글·변경요소 표시·TO-BE 마킹) 제거.
    · GNB 키비주얼: 제공된 키비주얼 이미지 기준 CSS 재현(디자인 확정 시 교체).
    · 실제 아이콘·간격·모션은 디자인 라이브러리로 확정. 본 파일은 구조·배치 전달용.
  -->
  <style>
    :root{
      --bg:#0d0f14; --sidebar:#111318; --flyout:#181b22; --card:#16181f; --card-2:#1c1f27;
      --border:#262a33; --border-soft:#1e222a;
      --text:#e6e8ee; --muted:#969ba6; --faint:#5f636d;
      --active:#232a3a; --accent:#7d97f0; --primary:#4159d6;
      --ok:#46b17f; --warn:#d9a441; --crit:#e0585f;
      --header-h:58px; --gnb-w:236px; --radius:12px;
      --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
    button{font-family:inherit;color:inherit;cursor:pointer}
    .app{display:grid;grid-template-columns:var(--gnb-w) 1fr;grid-template-rows:var(--header-h) 1fr;height:100vh;overflow:hidden;grid-template-areas:"brand header" "gnb main"}

    /* 브랜드 */
    .brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--sidebar);border-bottom:1px solid var(--border-soft)}
    .logo-mark{display:grid;place-items:center;width:24px;height:24px;flex:0 0 auto;color:var(--text)}
    .logo-mark svg{width:24px;height:24px}
    .brand b{font-size:15.5px;font-weight:700}
    .brand b .ai{color:#8ea8f5}

    /* 헤더 */
    .header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--sidebar);border-bottom:1px solid var(--border-soft)}
    .breadcrumb{color:var(--muted);font-size:13px}.breadcrumb b{color:var(--text);font-weight:600}
    .hr{display:flex;align-items:center;gap:9px}
    .ws{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;font-size:13px}
    .ws .chev{color:var(--muted)}

    /* GNB */
    .gnb{grid-area:gnb;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border-soft);overflow:visible}
    /* 브랜드 키비주얼 배너 */
    .banner{margin:14px 12px 8px;height:120px;border-radius:12px;background:linear-gradient(135deg,#7386b2 0%,#8698c4 100%);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 18px}
    .banner .bt{font-size:21px;font-weight:800;color:#fff;line-height:1.05;z-index:1;letter-spacing:.5px}
    .banner .kv{position:absolute;right:-26px;bottom:-34px;width:170px;height:170px;z-index:0}
    .banner .ph-tag{position:absolute;bottom:8px;right:10px;font-size:9px;color:rgba(255,255,255,.62);z-index:1}
    .nav{padding:6px 12px;flex:0 0 auto}
    .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:3px;position:relative}
    .nav a svg{width:19px;height:19px;flex:0 0 auto}
    .nav a:hover{background:var(--card);color:var(--text)}
    .nav a.active{background:var(--active);color:var(--text);font-weight:600}
    .nav a.has-fly::after{content:"›";margin-left:auto;color:var(--faint);font-size:16px}

    /* 플라이아웃 (플랫폼 설정 호버) */
    .flywrap{position:relative}
    .flyout{position:absolute;left:calc(100% + 6px);top:0;width:210px;background:var(--flyout);border:1px solid var(--border);border-radius:11px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateX(-6px);transition:.13s;z-index:70}
    .flywrap:hover .flyout{opacity:1;visibility:visible;transform:translateX(0)}
    .flyout a{display:flex;align-items:center;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:2px}
    .flyout a:hover{background:var(--card);color:var(--text)}
    .flyout a.on{background:var(--active);color:var(--text);font-weight:600}
    .flyout a .tb{font-size:9.5px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;margin-left:6px}

    /* 하단: 내 작업함 + 퍼스널 */
    .gnb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border-soft)}
    .worklist{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--text);background:var(--card);border:1px solid var(--border);position:relative;margin-bottom:8px}
    .worklist svg{width:19px;height:19px;color:var(--muted)}
    .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#0a0b0e;font-size:12px;font-weight:700;display:grid;place-items:center}
    .notice-common{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:8px;position:relative}
    .notice-common svg{width:19px;height:19px}
    .notice-common:hover{background:var(--card);color:var(--text)}
    .notice-common .rdot2{position:absolute;left:24px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--crit)}
    .persona{position:relative}
    .persona .pbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--card-2);border:1px solid var(--border);cursor:pointer;width:100%}
    .persona .pbtn:hover{border-color:#3a4152}
    .av{width:30px;height:30px;border-radius:50%;background:#2c3240;display:grid;place-items:center;font-size:12px;color:#cdd6ff;flex:0 0 auto}
    .persona .who{line-height:1.25;min-width:0;text-align:left}
    .persona .who b{font-size:13px;display:block}
    .persona .who span{font-size:11px;color:var(--faint)}
    .persona .up{margin-left:auto;color:var(--faint);transition:transform .15s}
    .persona.open .up{transform:rotate(180deg)}
    .pmenu{position:absolute;left:0;bottom:calc(100% + 8px);width:100%;background:var(--flyout);border:1px solid var(--border);border-radius:11px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(6px);transition:.13s;z-index:70}
    .persona.open .pmenu{opacity:1;visibility:visible;transform:translateY(0)}
    .persona.open .pbtn{border-color:#3a4152}
    .pmenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px}
    .pmenu a:hover{background:var(--card);color:var(--text)}
    .pmenu a svg{width:16px;height:16px}
    .pmenu hr{border:0;border-top:1px solid var(--border-soft);margin:6px 0}
    .pm-head{display:flex;align-items:center;gap:10px;padding:6px 10px 8px}
    .pm-head .av{width:32px;height:32px;flex:0 0 auto}
    .pm-who{line-height:1.35;min-width:0}
    .pm-who b{font-size:13px;display:block}
    .pm-who span{font-size:11px;color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pmenu .theme{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;font-size:13px;color:var(--muted);cursor:pointer}
    .toggle{width:38px;height:20px;border-radius:11px;background:var(--card-2);border:1px solid var(--border);position:relative;transition:.15s;flex:0 0 auto}
    .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--faint);transition:.15s}
    .toggle.on{background:rgba(111,155,239,.3);border-color:#3c5896}
    .toggle.on::after{left:20px;background:var(--accent)}
    /* 언어: 한 줄 → 클릭 시 인라인 펼침 */
    .lang-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
    .lang-row:hover{background:var(--card);color:var(--text)}
    .lang-row svg.gl{width:16px;height:16px;flex:0 0 auto}
    .lang-row .cur{margin-left:auto;color:var(--faint);font-size:12px}
    .lang-row .cv{margin-left:6px;color:var(--faint);transition:transform .15s}
    .lang-row .cv svg{width:13px;height:13px;display:block}
    .lang-row.open .cv{transform:rotate(180deg)}
    .lang-list{max-height:0;overflow:hidden;transition:max-height .18s ease}
    .lang-list.open{max-height:140px}
    .lang-list button{display:flex;align-items:center;width:100%;gap:10px;padding:8px 10px 8px 36px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-size:12.5px;text-align:left;cursor:pointer}
    .lang-list button:hover{background:var(--card);color:var(--text)}
    .lang-list button .ck{margin-left:auto;color:var(--accent);opacity:0}
    .lang-list button.sel .ck{opacity:1}
    .lang-list button.sel{color:var(--text)}
    .lang-list button .ck svg{width:14px;height:14px;display:block}

    /* 메인 */
    .main{grid-area:main;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:24px 28px;min-height:0}
    .body-ph{border:1px dashed #2c313d;border-radius:12px;min-height:340px;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center;line-height:1.9;background:repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(255,255,255,.012) 12px,rgba(255,255,255,.012) 24px)}
    .body-ph b{color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
    #page .ph{margin-bottom:20px}
    #page .ph h1{font-size:22px;margin:0 0 6px;letter-spacing:-.2px}
    #page .ph p{font-size:12.5px;color:var(--muted);margin:0}
    #page .ph-row{display:flex;align-items:flex-start;justify-content:space-between}
    #page .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
    #page .tab{padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
    #page .tab.on{color:var(--text);border-bottom-color:var(--accent)}
    .addbtn{padding:8px 15px;background:var(--text);color:var(--bg);border:0;border-radius:8px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
    .addbtn:hover{opacity:.88}
    /* 마이페이지 */
    .mp-form{max-width:560px}
    .mp-sec{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:20px 22px;margin-bottom:14px}
    .mp-sec h3{font-size:14px;margin:0 0 14px}
    .mp-f{margin-bottom:14px}
    .mp-f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
    .mp-f input{width:100%;padding:9px 12px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}
    .mp-f input:disabled{color:var(--faint)}
    .mp-act{display:flex;justify-content:flex-end;gap:8px}
    .mp-hint{font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5}
    .btn-ghost2{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;font-family:inherit;cursor:pointer}
    .btn-ghost2:hover{border-color:#3a4152;color:var(--text)}
    /* 세부 미확정 — 흐리게 처리(화면정의서에서 정의) */
    .mp-sec.tbd{position:relative;overflow:hidden}
    .mp-sec.tbd > *:not(.tbd-tag){filter:blur(3.5px);opacity:.45;user-select:none;pointer-events:none}
    .tbd-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:var(--card);border:1px dashed var(--border);border-radius:9px;padding:10px 16px;font-size:12px;color:var(--muted);white-space:nowrap;text-align:center;line-height:1.7}
    .tbd-tag b{display:block;color:var(--text);font-size:12.5px;margin-bottom:2px}

    /* 라이트 테마 (컴포넌트 라이브러리 규격) */
    body.light{
      --bg:#f4f6fc; --sidebar:#fff; --flyout:#fff; --card:#fff; --card-2:#eef1f9;
      --border:#dce2f1; --border-soft:#e9edf7; --active:#eaf0fd;
      --text:#171d33; --muted:#565f7e; --faint:#8f95a1;
    }
    body.light .logo-mark{color:#3346c9}
    body.light .brand b .ai{color:#3346c9}
    body.light .nav a.active{background:#eaf0fd;color:#26368f;font-weight:600}
    body.light .nav a:hover{background:#eef1f9}
    body.light .flyout a.on{background:#eaf0fd;color:#26368f}
    body.light .pmenu,body.light .flyout{box-shadow:0 10px 28px rgba(20,25,40,.12)}
    body.light .addbtn{background:#1b1f27;color:#fff}
    body.light .body-ph{border-color:#dfe3e8;background:repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(0,0,0,.012) 12px,rgba(0,0,0,.012) 24px)}
  </style>
</head>

      <a href="#" data-page="workspaces" onclick="return nav('workspaces')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>워크스페이스</a>

    </div>

    <div class="gnb-bottom">
      <div class="worklist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>
        내 작업함 <span class="badge">3</span>
      </div>
      <a href="#" class="notice-common"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 8a6 6 0 1112 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10 21a2 2 0 004 0"/></svg>알림<span class="rdot2"></span></a>

      <div class="persona" id="persona">
        <div class="pbtn" onclick="togglePersona(event)">
          <span class="av">유</span>
          <span class="who"><b>성유진</b><span>일반 사용자</span></span>
          <span class="up">▴</span>
        </div>
        <div class="pmenu">
          <div class="pm-head">
            <span class="av">유</span>

            <span>언어</span>
            <span class="cur" id="langCur">한국어</span>

          <div class="lang-list" id="langList">
            <button onclick="pickLang(this,'English')">English<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg></span></button>
            <button class="sel" onclick="pickLang(this,'한국어')">한국어<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg></span></button>
            <button onclick="pickLang(this,'日本語')">日本語<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg></span></button>
          </div>
          <hr>
          <div class="theme" onclick="toggleTheme(event)"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;vertical-align:-3px;margin-right:8px"><path d="M20 14.5A8 8 0 019.5 4a7 7 0 100 10.5 7 7 0 0010.5 0z" stroke-linejoin="round"/></svg>다크 테마</span><span class="toggle on"></span></div>
          <hr>
          <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>로그아웃</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="main"><div id="page"></div></main>
</div>

<script>
  var PAGES = {
    overview: {crumb:'홈', html:`
    <div class="ph"><h1>환영합니다, 성유진님</h1><p>클러스터 전체의 AI 인프라 및 모델 배포 개요를 확인하세요.</p></div>
    <div class="body-ph"><div><b>홈 대시보드</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃(헤더·GNB·플라이아웃·사이드바 하단) 전달용입니다.</div></div>`},
    workspaces: {crumb:'워크스페이스', html:`
    <div class="ph-row"><div class="ph"><h1>워크스페이스</h1><p>논리적 환경, 팀 액세스 및 리소스 할당량을 관리합니다.</p></div><button class="addbtn">＋ 워크스페이스 생성</button></div>
    <div class="body-ph"><div><b>워크스페이스 목록</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃 전달용입니다.</div></div>`},
    models: {crumb:'모델', html:`
    <div class="ph-row"><div class="ph"><h1>모델 레지스트리</h1><p>등록된 모델과 사양을 관리합니다.</p></div><button class="addbtn">＋ 모델 등록</button></div>
    <div class="body-ph"><div><b>모델 레지스트리</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃 전달용입니다.</div></div>`},
    deployments: {crumb:'배포', html:`
    <div class="ph-row"><div class="ph"><h1>배포</h1><p>운영 중인 추론 배포를 관리합니다.</p></div><button class="addbtn">＋ 새 배포</button></div>
    <div class="body-ph"><div><b>배포 목록</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃 전달용입니다.</div></div>`},
    monitoring: {crumb:'모니터링', html:`
    <div class="ph"><h1>글로벌 모니터링</h1><p>가속기 자원과 추론 성능을 실시간으로 확인합니다.</p></div>
    <div class="tabs"><span class="tab on">가속기 모니터링</span><span class="tab">오버뷰 대시보드</span><span class="tab">알림 규칙 탐색기</span></div>
    <div class="body-ph"><div><b>글로벌 모니터링</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃 전달용입니다.</div></div>`},
    settings: {crumb:'플랫폼 설정', sub:'사용자 및 역할', html:`
    <div class="ph"><h1>플랫폼 설정</h1><p>글로벌 인프라 연결 및 시스템 전체 역할을 관리합니다.</p></div>
    <div class="body-ph"><div><b>사용자 및 역할(RBAC)</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃 전달용입니다.</div></div>`},
    mypage: {crumb:'마이페이지', html:`
    <div class="ph"><h1>마이페이지</h1><p>본인 계정 정보를 확인하고 수정합니다.</p></div>
    <div class="mp-form">
      <section class="mp-sec tbd">
        <span class="tbd-tag"><b>내 정보</b>표시·수정 항목은 화면정의서에서 정의합니다</span>
        <h3>내 정보</h3>
        <div class="mp-f"><label>계정 아이디</label><input value="yj.seong" disabled><p class="mp-hint">로그인에 사용하는 아이디입니다. 변경할 수 없습니다.</p></div>
        <div class="mp-f"><label>전체 이름</label><input value="성유진"></div>
        <div class="mp-f"><label>이메일 주소</label><input value="yj.seong@okestro.com"><p class="mp-hint">알림 수신에 사용됩니다.</p></div>
        <div class="mp-act"><button class="btn-ghost2">취소</button><button class="addbtn">저장</button></div>
      </section>
    </div>`}
  };

  function setCrumb(main, sub){
    var el=document.querySelector('.breadcrumb');
    el.innerHTML = '콘체르토 플랫폼 / <b>'+ (sub? main+' ▸ '+sub : main) +'</b>';
  }
  function render(key, subLabel){
    var p=PAGES[key]; if(!p) return;
    document.getElementById('page').innerHTML = p.html;
    setCrumb(p.crumb, subLabel || p.sub);
  }
  function nav(key){
    document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
    var link=document.querySelector('.nav a[data-page="'+key+'"]');
    if(link) link.classList.add('active');
    render(key);
    return false;
  }
  function go(key){
    document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
    render(key);
    document.querySelector('.main').scrollTop=0;
    return false;
  }
  function navSub(key, label){
    nav(key);
    document.querySelectorAll('.flyout a').forEach(function(a){a.classList.toggle('on', a.textContent.indexOf(label)===0)});
    render(key, label);
    return false;
  }
  render('overview');

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href="#"]');
    if(a){ e.preventDefault(); }
  }, true);

  function toggleTheme(e){
    if(e) e.stopPropagation();
    var dark = !document.body.classList.toggle('light');
    document.querySelectorAll('.toggle').forEach(function(t){t.classList.toggle('on', dark)});
  }
  function togglePersona(e){
    if(e) e.stopPropagation();
    document.getElementById('persona').classList.toggle('open');
  }
  document.addEventListener('click',function(e){
    var p=document.getElementById('persona');
    if(p && !p.contains(e.target)) p.classList.remove('open');
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ document.getElementById('persona').classList.remove('open'); }});
  function toggleLang(e){
    e.stopPropagation();
    document.getElementById('langRow').classList.toggle('open');
    document.getElementById('langList').classList.toggle('open');
  }
  function pickLang(btn,name){
    event.stopPropagation();
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    document.getElementById('langCur').textContent=name;
    document.getElementById('langRow').classList.remove('open');
    document.getElementById('langList').classList.remove('open');
  }
</script>
</body>
</html>
