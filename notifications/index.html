  .flowsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
    padding:11px 14px;background:var(--card-2);border:1px solid var(--border);border-radius:10px}
  .flowsum .fnode{font-size:12.5px;font-weight:600;color:var(--foreground)}
  .flowsum .farr{color:var(--muted-foreground);font-size:13px}
  .flowsum .fvia{font-size:11.5px;color:var(--muted-foreground);margin-left:6px}
  /* 두 갈래는 가로. 설명 길이가 달라도 카드 높이를 맞춘다 */
  .pick.row{flex-direction:row;align-items:stretch}
  .pick.row .pk{flex:1 1 0;min-width:0}
  @media (max-width:860px){ .pick.row{flex-direction:column} }
.pick .pk{flex:1 1 220px;text-align:left;padding:13px 15px;border-radius:10px;
  background:var(--card);border:1.5px solid var(--border);cursor:pointer;
  font-family:inherit;transition:border-color .12s}
.pick .pk:hover{border-color:var(--border-strong)}
.pick .pk.on{border-color:var(--primary);background:var(--selected-soft)}
.pick .pk b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
    margin-bottom:4px;color:var(--foreground);min-height:20px}
.pick .pk span{display:block;font-size:11.5px;color:var(--muted-foreground);line-height:1.55}

/* 읽기 전용 값 */
.ro{padding:9px 12px;background:var(--muted);border:1px solid var(--border);
  border-radius:8px;font-size:13px;color:var(--foreground)}
.ro .dash{margin-left:6px;font-size:11.5px}

/* 인라인 오류 */
.ferr{margin:0;font-size:11.5px;color:var(--destructive);line-height:1.55}
.inp.err{border-color:var(--destructive)}

/* 입력 + 버튼 */
.inline{display:flex;gap:8px;align-items:center}
.inline .inp{flex:1;min-width:0}

/* 자원 풀 블록 — 자원 단위 하나가 블록 하나다.
   블록이 셋이 되어도 같은 방식으로 늘어난다 */
.pools{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.pool{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.pool .ph2{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.pool .ph2 h5{margin:0;font-size:13px;font-weight:600}
.pool .pcnt{margin-left:auto;font-size:12px;color:var(--muted-foreground);
  font-variant-numeric:tabular-nums}
.pool .pnote{margin:0 0 12px;font-size:11.5px;color:var(--muted-foreground)}
.pool .fgrid{margin-top:10px}

/* 총 사용량 — 입력하는 자리에서 결과가 보여야 한다 */
.restot{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:14px;
  padding:12px 15px;background:var(--muted);border:1px solid var(--border);border-radius:10px}
.restot .rl{font-size:12px;color:var(--muted-foreground)}
.restot .rv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.restot .rs{font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.restot.over{background:color-mix(in srgb,var(--destructive) 8%,transparent);
  border-color:color-mix(in srgb,var(--destructive) 30%,transparent)}
.restot .rmsg{flex:0 0 100%;margin-top:4px;font-size:11.5px;color:var(--destructive);line-height:1.6}

/* 엔드포인트 미리보기 */
.epprev{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:14px;
  padding:11px 14px;background:var(--muted);border:1px solid var(--border);border-radius:9px}
.epprev .el{font-size:11.5px;color:var(--muted-foreground);flex:0 0 auto}
.epprev .ev{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--foreground);
  word-break:break-all}

/* 고급 설정 — 접은 상태에서도 값이 바뀐 것을 알 수 있어야 한다 */
/* overflow:hidden 을 두면 안쪽 툴팁이 잘린다. 모서리는 헤더·본문에서 다듬는다 */
.advb{margin-top:20px;border:1px solid var(--border);border-radius:10px}
.advb .advh{border-radius:9px 9px 0 0}
.advb:not(.open) .advh{border-radius:9px}
.advb .advbody{border-radius:0 0 9px 9px}
.advb .advh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 15px;
  background:var(--card);border:0;cursor:pointer;font-family:inherit;font-size:13px;
  font-weight:600;color:var(--foreground);text-align:left}
.advb .advh:hover{background:var(--hover)}
.advb
.advb .advh .chg{margin-left:auto;font-size:11px;font-weight:600;color:var(--primary);
  padding:2px 8px;background:var(--selected-soft);border-radius:20px}
.advb .advh .fold{flex:0 0 auto;width:16px;height:16px;color:var(--muted-foreground);
  transition:transform .15s}
.advb .advh .fold svg{width:16px;height:16px;display:block}
.advb.open .advh .fold{transform:rotate(180deg)}
.advb .advbody{padding:16px 15px;border-top:1px solid var(--border);background:var(--card-2)}

/* 검수 */
.rverr{margin-bottom:20px;padding:14px 16px;border-radius:10px;
  background:color-mix(in srgb,var(--destructive) 7%,transparent);
  border:1px solid color-mix(in srgb,var(--destructive) 28%,transparent)}
.rverr b{display:block;font-size:12.5px;color:var(--destructive);margin-bottom:4px}
  .rverr > span{font-size:11.5px;color:var(--muted-foreground)}
.rverr a{display:block;padding:5px 0;font-size:12px;color:var(--foreground);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rverr a:hover{color:var(--destructive)}
  /* 검수 — 단계 순으로 세로. 마법사 진행 방향과 맞춘다 */
  .rvlist{display:flex;flex-direction:column;gap:12px}
.rvsec{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .rvsec.err{border-color:var(--destructive)}
  /* 헤더 전체가 펼침 버튼이다. 훑다가 필요한 것만 연다 */
  .rvh{display:flex;align-items:center;gap:10px;width:100%;padding:0;
    background:transparent;border:0;font-family:inherit;cursor:pointer;text-align:left}
  .rvh h5{margin:0;flex:0 0 auto}
  .rvsec.open .rvh{margin-bottom:10px}
  /* 요약이 없어도 자리를 남긴다. 그래야 상태가 늘 같은 자리에 온다 */
  .rvsum{flex:1;min-width:0;font-size:12px;color:var(--muted-foreground);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rvh .rvic,.rvh .rvst{flex:0 0 auto}
  .rvfold{flex:0 0 auto;width:16px;height:16px;color:var(--muted-foreground);transition:transform .15s}
  .rvfold svg{width:16px;height:16px;display:block}
  .rvsec.open .rvfold{transform:rotate(180deg)}
  .rvbody{display:flex;flex-direction:column}
  .rvbody .rvfix{align-self:flex-start;margin-top:10px}
  /* 두 상태를 같은 형태로 둔다. 하나만 배지면 짝이 안 맞아 통과가 안 보인다 */
  .rvic{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;
    font-size:11px;font-weight:700;flex:0 0 auto}
  .rvic.ok{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success)}
  .rvic.bad{background:color-mix(in srgb,var(--destructive) 14%,transparent);color:var(--destructive)}
  .rvst{font-size:11.5px;font-weight:500}
  .rvst.ok{color:var(--success)}
  .rvst.bad{color:var(--destructive)}
  .rvfix{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
    background:transparent;border:1px solid var(--border-strong);border-radius:7px;
    color:var(--foreground);font-family:inherit;font-size:11.5px;cursor:pointer}
  .rvfix:hover{border-color:var(--foreground)}
  .rvr.bad .rvv{color:var(--destructive)}
  /* 고급 설정 요약 — 설정한 것만. 값이 여럿이라 한 줄에 붙여 쌓는다 */
  .rvadv{display:flex;gap:12px;padding:7px 0;font-size:12.5px;border-top:1px solid var(--border);margin-top:5px}
  .rvak{flex:0 0 auto;color:var(--muted-foreground)}
  .rvav{flex:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .rvarg{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;
    background:var(--muted);font-size:11.5px}
  .rvarg code{font-family:ui-monospace,Menlo,monospace;color:var(--muted-foreground)}
  .rvarg em{font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--foreground)}
  .rvmsg{color:var(--destructive)}
  /* 관측성 — 켜고 끄는 값이라 토글. 드롭다운은 셋 이상일 때 쓴다 */
  /* 캐시 안 된 모델 안내 — 기동 시간이 크게 달라진다 */
  .mcwarn{margin-top:12px;max-width:560px;padding:11px 14px;border-radius:9px;
    font-size:12px;line-height:1.6;color:var(--foreground);
    background:color-mix(in srgb,var(--warning) 9%,transparent);
    border:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}
  .mcwarn b{display:block;font-weight:600;margin-bottom:2px}
  .mcst{margin-top:7px}
  /* 켜고 끄는 값 — 카드 대신 세그먼트 + 한 줄 설명 */
  .segrow{display:flex}
  .segmented{display:inline-flex;background:var(--muted);border:1px solid var(--border);
    border-radius:8px;padding:3px;gap:3px}
  .segmented button{border:0;background:transparent;color:var(--muted-foreground);
    font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 16px;
    border-radius:6px;cursor:pointer}
  .segmented button:hover{color:var(--foreground)}
  .segmented button.on{background:color-mix(in srgb,var(--primary) 14%,transparent);
    color:var(--foreground);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);
    font-weight:700}
  .segnote{margin:8px 0 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.6}
  /* 관측성 — 라벨이 왼쪽·값이 오른쪽인 폼 배치를 따른다 */
  .rvsec.obs{padding:14px 16px}
  /* 운영룸 상태 안내 — 막는 이유와 갈 곳을 함께 알린다 */
  .roomwarn{margin-top:14px;max-width:560px;padding:11px 14px;border-radius:9px;
    font-size:12px;line-height:1.6;color:var(--foreground);
    background:color-mix(in srgb,var(--destructive) 8%,transparent);
    border:1px solid color-mix(in srgb,var(--destructive) 28%,transparent)}
  .rwgo{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px;
    background:transparent;border:1px solid var(--border-strong);border-radius:7px;
    color:var(--foreground);font-family:inherit;font-size:11.5px;cursor:pointer}
  .rwgo:hover{border-color:var(--foreground)}
  .obsrow{display:flex;align-items:center;gap:14px}
  .obstx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .obstx b{font-size:12.5px;font-weight:600;color:var(--foreground)}
  .obstx span{font-size:11.5px;color:var(--muted-foreground);line-height:1.6}
.rvsec.lock{background:var(--muted)}
.rvsec h5{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--muted-foreground)}
  .rvsec.err h5{color:var(--destructive)}
.rvr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12.5px}
.rvr .rk{color:var(--muted-foreground);flex:0 0 auto}
.rvr .rvv{text-align:right;color:var(--foreground);word-break:break-all}
.rvsec .pnote{margin:10px 0 0;font-size:11px;color:var(--faint);line-height:1.55}

/* 하단 */

/* 자원 잔여 — 입력 아래에 두어 값을 정할 때 함께 본다 */
.resnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding:9px 11px;
  background:var(--muted);border:1px solid var(--border);border-radius:8px;
  font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.resnote .sep{color:var(--faint)}
.resnote.over{background:color-mix(in srgb,var(--destructive) 8%,transparent);
  border-color:color-mix(in srgb,var(--destructive) 30%,transparent)}
.resnote .over-msg{flex:0 0 100%;margin-top:5px;color:var(--destructive);line-height:1.6}
/* 확인이 필요한 단계를 밝히는 자리라 오류일 때만 색을 준다 */
/* 가져올 워크로드 — 드롭다운이 선택 역할을 겸하므로 체크박스를 두지 않고
   고른 행을 좌측 선으로 표시한다. 하단 문장만으로는 어느 행을 골랐는지 훑기 어렵다 */
.tbl tr.imppick{background:var(--selected-soft)}
.tbl tr.imppick td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* 생성 페이지 폼 */
/* 폼 폭은 요소에서만 제한한다.
   컨테이너와 요소 양쪽에 제한을 걸면 여백이 두 겹으로 생긴다.
   입력 필드는 .f / .fsec > .f 에서 폭을 잡고, 컨테이너는 페이지 폭을 그대로 쓴다 */
.formpage{max-width:560px}   /* 사유만 받는 신청 폼 — 요소가 하나라 컨테이너로 제한한다 */
.formpage.two,.formpage.mid{max-width:none}
.fsec{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:18px 20px;margin-bottom:14px}
.fsec > h4{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:13px;font-weight:600}
.fsec:last-of-type{margin-bottom:0}
/* 카드가 이미 경계를 갖는다. 그 아래에 줄을 또 그으면 구분선이 두 번이다 */
  .formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* 룸 페이지 */
.roomhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.roomnote{display:flex;gap:9px;padding:12px 14px;border:1px solid var(--border);background:var(--muted);border-radius:9px;font-size:12px;line-height:1.65;color:var(--muted-foreground);margin-bottom:18px}
.roomnote svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px;color:var(--accent)}

/* 폼 2열 배치 — 좁아지면 1열로 */
/* 폼은 단일 열 기준(공통정책 4.6). 짧은 숫자 입력만 한 줄에 묶는다 */
.fgrid2 .full,.fgridn .full{grid-column:1/-1}
/* 폼 2열 배치 — .fgridn 은 같은 규격의 별칭.
   폼 폭이 넓어져도 입력 칸이 늘어지지 않게 칸 폭 상한을 둔다 */
.fgrid2,.fgridn{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:14px 16px}
.fgrid2 > div,.fgridn > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.sublb{display:block;font-size:12.5px;color:var(--muted-foreground)}
.fgrid2 .inp,.fgridn .inp{width:100%}
@media (max-width:900px){ .fgrid2,.fgridn{grid-template-columns:1fr} }

/* 자원 카드 — 화면 폭에 따라 열 수 조정 */
.qcard .qn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 가용 자원 행 — 값이 잘리지 않게 */
@media (max-width:820px){
  }

/* 룸 화면 상단 요약 — 이 환경 몫 대비 점유. 할당량 배분은 워크스페이스 상세에서 본다 */
.rsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.rst{font-size:11.5px;color:var(--muted-foreground);margin-bottom:4px}
.rsv{font-size:14px;font-weight:600;color:var(--foreground);margin-bottom:6px}
.rsq{font-size:11.5px;font-weight:400;color:var(--muted-foreground)}

/* 이동 버튼 — 라벨과 화살표를 붙인다. 양끝으로 벌리면 셀렉트 박스로 읽힌다.
   화살표는 방향 표시이므로 라벨보다 흐리게 두고, 색은 버튼 종류가 결정한다 */
.go{gap:6px}
.ar{color:var(--muted-foreground);font-weight:400}
.go .ar{margin-left:0}
.btn:hover:not(:disabled) .ar{color:inherit}
/* 설명 셀 — 한 줄 말줄임. 전문은 패널·상세에서 확인한다(공통정책 1.2) */
.celldesc{display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-foreground)}

/* 알림 박스 — 조건에 따라 나타나는 상태 알림.
   항목 설명(툴팁)과 구분한다. 조치가 없는 안내만 닫을 수 있다 */
.alertbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:14px;
  border:1px solid var(--border);background:var(--muted)}
.alertbox.info{border-color:color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.alertbox.warn{border-color:color-mix(in srgb,var(--warning) 32%,transparent);background:color-mix(in srgb,var(--warning) 8%,transparent)}
.alertbox.crit{border-color:color-mix(in srgb,var(--destructive) 30%,transparent);background:color-mix(in srgb,var(--destructive) 7%,transparent)}
.alertbox .aic{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.alertbox.info .aic{color:var(--accent)}
.alertbox.warn .aic{color:var(--warning)}
.alertbox.crit .aic{color:var(--destructive)}
.alertbox .atx{flex:1;min-width:0;font-size:12.5px;line-height:1.65;color:var(--foreground)}
.alertbox .atx b{display:block;margin-bottom:3px}
.alertbox .aact{margin-top:9px;display:flex;gap:7px}
.alertbox .aclose{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;border:0;background:transparent;
  color:var(--muted-foreground);cursor:pointer;border-radius:5px;font-size:13px;line-height:1}
.alertbox .aclose:hover{background:var(--card);color:var(--foreground)}

/* 워크스페이스 전환 드롭다운 — 조회 컨텍스트를 바꾼다.
   검색은 항목 수와 무관하게 항상 노출한다. 노출 기준값에 근거가 없어 조건 분기를 두지 않았다 */
.wswrap{position:relative}
.ws{font-family:inherit;color:var(--foreground)}
.ws:disabled{cursor:default;opacity:.75}
.ws:disabled .chev{display:none}
/* 헤더 우측에 있으므로 오른쪽 끝을 버튼에 맞추고 왼쪽으로 펼친다.
   left:0 으로 두면 버튼보다 넓은 목록이 화면 밖으로 밀려난다 */
.wsdd{display:none;position:absolute;top:calc(100% + 5px);right:0;min-width:262px;max-width:min(320px,calc(100vw - 40px));z-index:120;
  background:var(--flyout);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 14px 34px var(--shadow);overflow:hidden}
.wswrap.open .wsdd{display:block}
.wsdd .wssearch{padding:9px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--flyout)}
.wsdd .wssearch input{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;
  background:transparent;color:var(--foreground);font-size:12.5px;font-family:inherit}
.wsdd .wslist{max-height:274px;overflow-y:auto;padding:5px}
.wsdd .wsitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;background:transparent;
  border-radius:7px;font-size:12.5px;color:var(--foreground);font-family:inherit;cursor:pointer;text-align:left}
.wsdd .wsitem:hover{background:var(--hover)}
.wsdd .wsitem.on{background:var(--selected);font-weight:600}
.wsdd .wsitem .wic{width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.wsdd .wsitem .wic svg{width:12px;height:12px}
.wsdd .wsitem .wnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsdd .wsitem .wck{color:var(--accent);flex:0 0 auto}
.wsdd hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.wsdd .wsempty{padding:16px 12px;text-align:center;font-size:12px;color:var(--faint)}

/* 진입 표 — 행 전체가 다른 화면으로 가는 표.
   호버 전에도 이동 대상임이 보이도록 우측에 라벨을 둔다 */
.tbl.enter tbody tr .entgo{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;
  border:1px solid var(--border-strong);color:var(--muted-foreground);vertical-align:middle;margin-left:7px}
.tbl.enter tbody tr .entgo svg{width:11px;height:11px}
.tbl.enter tbody tr:hover .entgo{border-color:var(--foreground);color:var(--foreground);background:var(--card)}

.rolesel:disabled{opacity:.6;cursor:default}
.cbtn:disabled{opacity:.4;cursor:default;border-color:var(--border)}
.cbtn:disabled:hover{background:transparent;border-color:var(--border)}
/* 값 옆에 붙는 자리라 한 치수 작게 둔다 */
.cbtn.sm{width:26px;height:26px;border-radius:6px}
.cbtn.sm svg{width:13px;height:13px}
/* 엔드포인트는 장문이라 말줄임으로 두고 버튼을 우측에 붙인다 */
.eprow{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0}
.eprow .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ── 다중 선택 목록 ────────────────────────────────
   항목이 늘어도 모달 높이가 고정되도록 검색 + 스크롤 영역으로 둔다.
   체크박스 나열은 항목 수가 적을 때만 쓴다 */
.mselect{border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;background:var(--card)}
.mselect .mshead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--muted)}
.mselect .mssearch{flex:1;min-width:0;position:relative}
.mselect .mssearch svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted-foreground);pointer-events:none}
.mselect .mssearch input{width:100%;padding:6px 9px 6px 27px;border:1px solid var(--border);border-radius:7px;
  background:var(--card);color:var(--foreground);font-size:12px;font-family:inherit}
.mselect .msall{flex:0 0 auto;border:0;background:transparent;color:var(--muted-foreground);
  font-size:11.5px;font-family:inherit;cursor:pointer;padding:2px 4px;white-space:nowrap}
.mselect .msall:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
.mselect .mslist{max-height:186px;overflow-y:auto}
.mselect .msitem{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--border)}
.mselect .msitem:last-child{border-bottom:0}
.mselect .msitem:hover{background:var(--hover)}
.mselect .msitem input{width:15px;height:15px;flex:0 0 auto;accent-color:var(--primary);margin:0}
.mselect .msitem .mnm{flex:1;min-width:0;font-size:12.5px;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mselect .msitem.off{opacity:.5;cursor:default}
.mselect .msitem.off:hover{background:transparent}
.mselect .msfoot{padding:7px 11px;border-top:1px solid var(--border);background:var(--muted);
  font-size:11.5px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.mselect .msfoot b{color:var(--foreground);font-weight:600}
.mselect .msempty{padding:18px 12px;text-align:center;font-size:12px;color:var(--faint)}

/* 패널 환경 행 — 두 룸을 나란히 두고 바로 진입한다.
   우측 아이콘은 패널 확장 버튼과 같은 모양으로 두어 '화면으로 이동'임을 드러낸다 */
.pnroom{display:flex;align-items:center;gap:9px;width:100%;padding:10px 11px;margin-bottom:7px;
  border:1px solid var(--border);background:transparent;border-radius:9px;
  font-family:inherit;font-size:12.5px;color:var(--foreground);cursor:pointer;text-align:left}
.pnroom:last-of-type{margin-bottom:0}
.pnroom:hover{border-color:var(--foreground)}
.pnroom .prn{font-weight:600;flex:0 0 auto}
.pnroom .prc{margin-left:auto;color:var(--muted-foreground);font-size:12px;white-space:nowrap}
.pnroom .prgo{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;
  border:1px solid var(--border-strong);color:var(--muted-foreground)}
.pnroom .prgo svg{width:12px;height:12px}
.pnroom:hover .prgo{border-color:var(--foreground);color:var(--foreground);background:var(--hover)}
.pnroom.off{cursor:default;opacity:.6}
.pnroom.off:hover{border-color:var(--border)}

/* 할당량 입력 행 — 입력과 근거를 한 덩어리로 둔다 */
/* 세그먼트 — 컴포넌트 라이브러리 .segmented 규격.
   선택지가 2~3개이고 양쪽 모두 유효한 결정일 때 쓴다.
   부가 기능을 켜고 끄는 경우는 .optcard(체크박스)를 쓴다 */
.segmented{display:inline-flex;background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px}
.segmented button{border:0;background:transparent;color:var(--muted-foreground);font-family:inherit;
  font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer}
.segmented button:hover{color:var(--foreground)}
.segmented button.on{background:rgba(79,111,230,.14);color:var(--foreground);border:1px solid rgba(79,111,230,.30);font-weight:700}

/* 개발룸 입력 — 지금 만들기를 고르면 펼쳐진다. 상위 선택에 딸린 값임을 들여쓰기로 드러낸다 */
.devbox{margin-top:14px;padding-left:16px;border-left:2px solid var(--border)}
/* 읽기 전용 값 — 다른 화면에서 정해져 이 화면에서는 고칠 수 없다 */
.rov{display:inline-flex;align-items:baseline;gap:9px;font-size:13px;color:var(--foreground);padding:9px 0}

.rov span{font-size:11.5px;color:var(--faint)}
.fnote{margin-top:6px;font-size:11.5px;color:var(--faint);line-height:1.6}
.devbox .qrowbox:last-of-type{border-bottom:0}
.qrowbox{padding:11px 0;border-bottom:1px solid var(--border)}
.qrowbox:last-child{border-bottom:0;padding-bottom:0}
.qrowbox:first-child{padding-top:0}
/* 라벨 폭을 고정한다. flex:1 이면 짧은 라벨도 칸을 다 차지해 스테퍼가 멀리 밀린다 */
/* 스펙 보조 텍스트가 붙는 행이 있어 상단 정렬로 둔다 */
.qrhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:9px}
.qrhead .stepper,.qrhead .qrcap,.qrhead .qrdel{margin-top:1px}
.qrhead .qrlb{flex:0 0 150px;min-width:0;font-size:12.5px;color:var(--muted-foreground)}
.qrhead .qrname{display:block}
/* 항목의 스펙 — 이름과 구분되도록 아래 줄에 흐린 색으로 둔다 */
.qrhead .qrsub{display:block;margin-top:2px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.qrhead .qrcap{flex:0 0 auto;font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
/* 제거 버튼 자리를 모든 행에 두어 우측 정렬을 맞춘다 */
.qrhead .qrdel{flex:0 0 26px;display:flex;justify-content:flex-end}
.qrowbox.err .qrcap{color:var(--destructive)}
/* 부가정보 블록 — 입력이 아닌 참조값·계산 결과는 표면 배경으로 분리한다.
   간격은 4의 배수로 맞춘다 */
.subbox{padding:16px;border-radius:10px;background:var(--muted);border:1px solid var(--border);
  display:flex;flex-direction:column;gap:12px}
.subbox > .sbt{font-size:12px;font-weight:600;color:var(--muted-foreground)}
.splitbar{margin-top:24px;max-width:520px}
.splitbar .sb{display:flex;align-items:center;gap:12px;font-size:12px}
.splitbar .sbl{width:64px;flex:0 0 auto;color:var(--muted-foreground)}
.splitbar .sbar{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--success) 38%,var(--card));overflow:hidden;min-width:64px}
.splitbar .sdev{display:block;height:100%;background:var(--primary)}
.splitbar .sbv{flex:0 0 auto;color:var(--foreground);font-variant-numeric:tabular-nums}
/* 선택 카드 3열 — 항목이 3개일 때 */
@media (max-width:520px){ }

/* 클러스터 잔여 카드 — 표면 박스 위에 놓이므로 막대 트랙을 카드색으로 둔다 */
.clgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.clbar{height:6px;border-radius:3px;background:var(--card);overflow:hidden}
.clfill{height:100%;border-radius:3px;background:var(--primary)}
.clfill.wa{background:var(--warning)}
.clfill.cr{background:var(--destructive)}
.clt{font-size:11.5px;color:var(--muted-foreground);margin-bottom:4px}
.clv{font-size:15px;font-weight:600;color:var(--foreground);margin-bottom:8px;font-variant-numeric:tabular-nums}
.clq{font-size:11.5px;font-weight:400;color:var(--muted-foreground)}
.clitem.none .clv{color:var(--destructive)}
.clnote{font-size:11px;color:var(--destructive);margin-top:6px}
.clsub{font-size:11px;color:var(--muted-foreground);margin-top:7px;font-variant-numeric:tabular-nums}
.clpc{color:var(--faint)}
/* 가속기 잔여 — 종류가 계속 늘어나므로 카드로 흩뿌리지 않고 한 블록에 목록으로 모은다 */
.clacctitle{display:flex;align-items:center;gap:6px;margin-top:18px;padding-top:16px;margin-bottom:10px;
  border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground)}
.clacclist{display:flex;flex-direction:column;gap:9px}
.clacc{display:grid;grid-template-columns:1fr 74px 120px 150px 70px;align-items:center;gap:12px;font-size:12px}
.clacc .can{color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clacc .cav{color:var(--faint);font-size:11px}
.clacc .caf{text-align:right;font-size:14px;font-weight:600;color:var(--foreground);font-variant-numeric:tabular-nums}
.clacc.none .caf{color:var(--destructive)}
.clacc .cab .clbar{display:block}
.clacc .cas{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.clacc .clnote{margin-top:0;font-size:11px}
@media (max-width:900px){
  .clacc{grid-template-columns:1fr auto;gap:4px 12px}
  .clacc .cab,.clacc .cas{grid-column:1 / -1}
}

/* 가속기 — 라벨은 자원 유형 하나. 종류는 그 아래 행으로 반복한다.
   종류가 늘어도 라벨·컬럼 구조는 그대로다 */
.qrhead.accgrp{align-items:flex-start}
.accbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.accrow{display:flex;flex-direction:column;gap:4px}
.accline{display:flex;align-items:center;gap:14px}
.accname{flex:0 0 200px;min-width:0;font-size:12.5px;color:var(--foreground);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow.err .accname{color:var(--destructive)}
/* 합계 — vRAM 총량이 판단 기준이다.
   행마다 환산값을 두지 않고 아래 한 줄로 모은다 */
.accsum{margin-top:2px;padding-top:10px;border-top:1px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--foreground);font-variant-numeric:tabular-nums}
.accsum span{display:block;margin-top:4px;font-size:11.5px;font-weight:400;color:var(--muted-foreground)}

/* 가속기 추가 드롭다운 */
/* 필터 드롭다운(.fdd)과 같은 층에 둔다. 60이면 다른 떠 있는 요소에 가린다.
   버튼 우측 기준이면 왼쪽으로 열려 좁은 폭에서 잘리므로 좌측 기준으로 연다 */
.accpop{position:absolute;top:calc(100% + 5px);left:0;min-width:220px;max-height:240px;overflow-y:auto;z-index:80;padding:5px;
  background:var(--flyout);border:1px solid var(--border);border-radius:9px;box-shadow:0 12px 30px var(--shadow)}
.accpop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;
  border-radius:6px;font-size:12.5px;color:var(--foreground);font-family:inherit;cursor:pointer;text-align:left}
.accpop button:hover:not(:disabled){background:var(--hover)}
.accpop button:disabled{opacity:.45;cursor:default}
.accpop .af{margin-left:auto;font-size:11px;color:var(--muted-foreground)}
/* 폼 필드 폭 — 입력이 가로로 늘어나면 시선 이동이 커진다.
   모달은 모달 폭이 이미 좁아 제한하지 않는다 */
.fsec .f{max-width:520px}
.fsec .f textarea.inp{max-width:none}

/* 필수·선택 표시 — 라이브러리 규격. 필수는 별표, 선택은 라벨 */
.req{color:var(--destructive);margin-left:2px}
.opt{margin-left:5px;padding:1px 6px;border-radius:4px;background:var(--muted);
  color:var(--muted-foreground);font-size:10.5px;font-weight:400;vertical-align:middle}

/* 칩 입력 — 목록형 값을 자유 입력 대신 항목으로 관리한다 */
.chipin{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 10px;
  border:1px solid var(--border-strong);border-radius:8px;background:var(--card);min-height:42px}
.ichip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:6px;
  background:var(--muted);font-size:12px;color:var(--foreground)}
.ichip button{width:16px;height:16px;display:grid;place-items:center;border:0;background:transparent;
  color:var(--muted-foreground);cursor:pointer;border-radius:4px;font-size:10px;line-height:1}
.ichip button:hover{background:var(--card);color:var(--destructive)}
.chipadd{border:1px dashed var(--border-strong);background:transparent;border-radius:6px;
  padding:4px 10px;font-size:12px;color:var(--muted-foreground);font-family:inherit;cursor:pointer}
.chipadd:hover{border-color:var(--foreground);color:var(--foreground)}

/* 섹션 안 소제목 — 한 섹션에 성격이 다른 묶음이 들어갈 때 */
.sublb2{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--muted-foreground);margin:28px 0 12px;padding-top:20px;border-top:1px solid var(--border)}
.fsec > .sublb2:first-of-type{margin-top:0;padding-top:0;border-top:0}
.subbox + .sublb2{margin-top:24px;padding-top:0;border-top:0}

/* 숫자 스테퍼 — 버튼·입력을 한 덩어리로 둔다.
   .fld 가 flex-column 기본 정렬(stretch)이라 align-self 없이 두면
   필드 폭 전체로 늘어나 버튼 사이가 벌어져 보인다 */
.stepper{display:inline-flex;align-items:center;flex:0 0 auto;align-self:flex-start;
  border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--card)}
.stepper.err{border-color:var(--destructive)}
.stepper .stbtn{width:30px;height:32px;flex:0 0 auto;display:grid;place-items:center;border:0;
  background:transparent;color:var(--muted-foreground);cursor:pointer;padding:0}
.stepper .stbtn svg{width:12px;height:12px}
.stepper .stbtn:hover:not(:disabled){background:var(--hover);color:var(--foreground)}
.stepper .stbtn:disabled{opacity:.3;cursor:default}
/* 단위를 입력 안 우측에 붙인다.
   절대 위치 대신 흐름 배치를 써서 단위 길이에 맞춰 폭이 잡히게 한다 */
.stepper .stfield{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;
  border-left:1px solid var(--border);border-right:1px solid var(--border)}
.stepper .inp{width:56px;height:auto;border:0;padding:0;border-radius:0;background:transparent;
  text-align:right;font-variant-numeric:tabular-nums}
.stepper .inp:focus{outline:none}
.stepper .stfield:focus-within{background:var(--hover)}
.stepper .stunit{flex:0 0 auto;font-size:11.5px;color:var(--muted-foreground);pointer-events:none}
/* 스테퍼 전용 배치 — 폭이 고정이라 그리드 칸에 맞추지 않고 내용 크기로 둔다.
   2열 그리드(300px 칸)에 넣으면 남는 폭만큼 항목 사이가 벌어진다 */
.stgrid{display:flex;flex-wrap:wrap;gap:16px 24px}
.stgrid > div{display:flex;flex-direction:column;gap:6px}
.stgrid .stepper .inp{width:56px}

/* 가속기 추가 — 목록 끝에 두고 무엇을 추가하는지 라벨에 밝힌다 */
.accadd{position:relative;display:inline-block;margin:12px 0 4px}

/* 검색어 지우기 — 입력 안 우측. 그 입력값만 지운다.
   조건 초기화(검색어+필터 전부)는 별도 버튼이라 범위가 갈린다 */
.searchbar{position:relative}
.searchbar .qclr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;display:grid;place-items:center;border:0;background:transparent;
  color:var(--muted-foreground);cursor:pointer;border-radius:4px;padding:0}
.searchbar .qclr svg{width:12px;height:12px}
.searchbar .qclr:hover{background:var(--hover);color:var(--foreground)}
/* 화면에 보이지 않으나 보조기기에 읽히는 텍스트 */
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 사용률 막대 — 컨테이너와 무관하게 정의한다.
   `.quota .qfill` 로 감싸 두었으나 `.quota` 는 마크업에 없어 룸 자원 막대에 색이 안 걸렸다.
   70% 이상 주의, 90% 이상 위험 */
.qbar{height:5px;border-radius:3px;background:var(--muted);overflow:hidden}
.qfill{height:100%;border-radius:3px;background:var(--primary)}
.qfill.hi{background:var(--warning)}
.qfill.full{background:var(--destructive)}
.rsitem .qbar{height:4px;border-radius:2px}
.rsitem .qfill{border-radius:2px}

/* 자격 증명 표시 — 값 대신 상태와 조작을 둔다 */
.credbox{display:flex;align-items:center;gap:10px;padding:9px 11px;
  border:1px solid var(--border);border-radius:8px;background:var(--muted)}
.credat{font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.credact{margin-left:auto;display:flex;gap:6px}

/* 처리 중 스피너 — 라이브러리 규격 */
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:currentColor;animation:sp .7s linear infinite;display:inline-block;
  vertical-align:-2px;margin-right:7px}
.btn.ghost .spin,.btn.danger-line .spin{border-color:var(--border);border-top-color:var(--muted-foreground)}
@keyframes sp{to{transform:rotate(360deg)}}

  /* 연결 — 수정·취소·저장을 제목 옆 같은 자리에 둔다 */
  .ssechd .secbtns{display:flex;gap:6px;flex:0 0 auto}
  .btn.sm{padding:5px 11px;font-size:12px}
  /* 여기서 정한 값이 배포에서 어떻게 쓰이는지 */
  .cnnprev{display:flex;align-items:center;gap:12px;margin-top:16px;padding:11px 14px;
    background:var(--muted);border-radius:9px;font-size:12px}
  .cnnprev .el{flex:0 0 auto;color:var(--muted-foreground)}
  .cnnprev .ev{font-family:ui-monospace,Menlo,monospace;color:var(--foreground);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ══════════ 플랫폼 설정 전용 ══════════ */
  /* 설정 안 된 항목 표시 — 빈도순만으로는 처음 설치할 때 무엇을 먼저 할지 안 보인다 */
  .flyout a{display:flex;align-items:center}
  .flyout a.on{background:var(--selected);color:var(--foreground);font-weight:600}

  /* 설정 섹션 — 폼과 상태를 한 덩이로 묶는다 */
  /* 워크스페이스 목업 `.dsec` 과 같은 규격으로 둔다 */
  .ssec{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px}
  .ssechd{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
  .ssechd > div{flex:1;min-width:0}
  .ssechd h4,
  .ssec > h4{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--foreground);
    display:flex;align-items:center;gap:6px}
  .ssechd h4{margin-bottom:4px}
  .sdesc{margin:0;font-size:12.5px;color:var(--muted-foreground);line-height:1.6}
  .secact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn.sm{padding:6px 13px;font-size:12px}

  /* 정의 목록 — 읽기만 하는 값 */
  .dlist{display:flex;flex-direction:column}

/* 정렬 — 발생 일시가 기본이고 내림차순이다. 지나간 기록을 보는 목록이라
   최근 것이 위에 온다(공통정책 3.1). 심각도로도 정렬한다 — 오류부터 보고 싶을 때 쓴다 */
let sortKey='at', sortDir='desc';
let sel=[];          /* 선택한 알림 인덱스 */
let page=1, per=20;

const $=function(id){ return document.getElementById(id); };
function esc(v){ return String(v).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ══════════ 시각 표기 ══════════
   하루 이내는 상대 시각, 그 이상은 절대 시각이다(알림 정책 5.4).
   ⚠ 데모라 기준 시각을 고정한다 */
const NOW = new Date('2026-08-27T10:00:00');
function when(at){
  const d = new Date(at.replace(' ','T'));
  const m = Math.floor((NOW - d)/60000);
  if(m < 1)  return '방금';
  if(m < 60) return m+'분 전';
  if(m < 60*24) return Math.floor(m/60)+'시간 전';
  return at.slice(0,16);
}

/* ══════════ 목록 ══════════ */
function base(){
  if(dstate==='empty') return [];
  /* 받는 범위는 역할에 따라 다르다(알림 정책 5.7).
     플랫폼 전체에 걸리는 사건은 최고 관리자만 받는다. 나머지는 소속 워크스페이스 것만 본다 */
  return NOTI.filter(function(x){
    if(role==='super') return true;
    return !x.admin;
  });
}
function list(){
  const s=q.trim().toLowerCase();
  return base().filter(function(x){
    if(readTab==='unread' && x.read) return false;
    if(sevSel.length && sevSel.indexOf(x.sev)<0) return false;
    if(catSel.length && catSel.indexOf(x.cat)<0) return false;
    if(wsSel.length && wsSel.indexOf(x.ws)<0) return false;
    if(!s) return true;
    return (x.t+' '+x.b+' '+x.cat+' '+x.ws).toLowerCase().indexOf(s)>=0;
  });
}
function unread(){ return base().filter(function(x){ return !x.read; }).length; }

/* 심각도는 글자순이 아니라 급한 순으로 센다 — 오류 · 주의 · 정보 */
const SEVORD={'오류':0,'주의':1,'정보':2};
function tgSort(k){
  if(sortKey===k){ sortDir = sortDir==='asc'? 'desc':'asc'; }
  else { sortKey=k; sortDir = (k==='at')? 'desc':'asc'; }
  page=1; drawList();
}
function sortTh(k,label){
  const on=sortKey===k;
  return '<th class="sortable'+(on?' on':'')+'" style="width:'+(k==='at'?'148':'104')+'px"'
   + ' onclick="tgSort(\''+k+'\')">'+label
   + (on? ' <span class="sar">'+(sortDir==='asc'?'\u25b2':'\u25bc')+'</span>' : '')+'</th>';
}
function applySort(rows){
  const dir = sortDir==='asc'? 1 : -1;
  return rows.slice().sort(function(a,b){
    if(sortKey==='sev') return (SEVORD[a.sev]-SEVORD[b.sev])*dir;
    return String(a.at).localeCompare(String(b.at))*dir;
  });
}

/* ══════════ 필터 ══════════ */
/* 필터 드롭다운은 th 에 클래스를 붙여 연다. 다시 그리지 않아 입력 포커스가 살아 있다 */
function tgFdd(e){
  e.stopPropagation();
  const th=e.target.closest('th'); const o=th.classList.contains('fdd-on');
  document.querySelectorAll('th').forEach(function(x){ x.classList.remove('fdd-on'); });
  if(!o) th.classList.add('fdd-on');
}
function tgSev(v){ const i=sevSel.indexOf(v); if(i<0) sevSel.push(v); else sevSel.splice(i,1); page=1; drawList(); }
function tgCat(v){ const i=catSel.indexOf(v); if(i<0) catSel.push(v); else catSel.splice(i,1); page=1; drawList(); }
function tgWsF(v){ const i=wsSel.indexOf(v); if(i<0) wsSel.push(v); else wsSel.splice(i,1); page=1; drawList(); }
document.addEventListener('click', function(){
  document.querySelectorAll('th').forEach(function(x){ x.classList.remove('fdd-on'); });
});

function thFilter(label,opts,sel,fn,defKey){
  const def=COLDEF[defKey];
  return '<span class="thwrap">'+label
   + (def? '<span class="thic" tabindex="0">?</span>' : '')
   + '<button class="thfilter'+(sel.length?' on':'')+'" onclick="tgFdd(event)" title="필터">'
   +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>'
   + '</button></span>'
   + (def? '<div class="thpop">'+def+'</div>' : '')
   + '<span class="fdd" onclick="event.stopPropagation()">'
   +   opts.map(function(o){
         return '<label class="chk"><input type="checkbox"'+(sel.indexOf(o)>=0?' checked':'')
              + ' onchange="'+fn+'(\''+o+'\')"><span class="cbx"></span>'
              + '<span class="cbt">'+o+'</span></label>'; }).join('')
   + '</span>';
}

/* ══════════ 렌더 ══════════ */
function drawList(){
  drawAct();
  /* 팝오버와 같은 데이터를 쓰므로 배지도 함께 갱신한다 */
  drawPop();

  /* 로딩은 스켈레톤으로 둔다. 목록 골격이 유지돼 값이 온 뒤에 자리가 흔들리지 않는다
     (공통정책 4.1 · 라이브러리 데이터 상태) */
  if(dstate==='loading'){
    $('listArea').innerHTML='<div class="tblwrap" style="padding:14px">'
      + Array(5).fill('<div class="skrow" style="margin:13px 0"></div>').join('')
      + '</div>';
    $('pager').innerHTML=''; return;
  }
  if(dstate==='error'){
    $('listArea').innerHTML='<div class="state">'
     + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'
     + '<h3>데이터를 불러오지 못했습니다.</h3><p>잠시 후 다시 시도해 주세요.</p>'
     + '<button class="btn ghost" onclick="setState(\'default\')">다시 시도</button></div>';
    $('pager').innerHTML=''; return;
  }

  const rows=applySort(list());
  const filtered = q || sevSel.length || catSel.length || readTab==='unread';

  /* 빈 상태 — 걸러서 없는 것과 처음부터 없는 것을 가른다(공통정책 4.1) */
  if(!filtered && !rows.length){
    $('listArea').innerHTML='<div class="state">'
     + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'
     +   '<path d="M6 8a6 6 0 1112 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10 21a2 2 0 004 0"/></svg>'
     + '<h3>받은 알림이 없습니다.</h3>'
     + '<p>작업이 끝나거나 조치가 필요한 일이 생기면 여기에 표시됩니다.</p></div>';
    $('pager').innerHTML=''; return;
  }

  const tot=rows.length, pages=Math.max(1,Math.ceil(tot/per));
  if(page>pages) page=pages;
  const view=rows.slice((page-1)*per, page*per);

  $('listArea').innerHTML =
     toolbar()
   + (view.length
      ? '<div class="tblwrap"><table class="tbl"><thead><tr>'
        /* 선택 열 — 이동하지 않고 읽음만 처리하고 싶을 때 쓴다.
           행 클릭은 이동이므로 이 열은 전파를 막는다 */
        /* 표 안 체크박스도 같은 규격을 쓴다. 기본 input 은 OS 마다 모양이 달라
           화면 안에서 형태가 갈린다 */
        /* 이 열은 지금 페이지만 고른다. 전체를 처리하려면 툴바의 `모두 읽음` 을 쓴다 */
        + '<th style="width:40px" onclick="event.stopPropagation()">'
        +   '<label class="chk"><input type="checkbox"'+(allSel(view)?' checked':'')+' onchange="tgAll(this.checked)"'
        +   ' aria-label="이 페이지 모두 선택" title="이 페이지 '+view.length+'건 선택"><span class="cbx"></span></label></th>'
        /* 심각도는 필터와 정렬을 함께 둔다 — 오류만 보거나 오류부터 보는 두 방식이 다 쓰인다 */
        + '<th class="thcell sortable'+(sortKey==='sev'?' on':'')+'" style="width:118px">'
        +   thFilter('심각도',['오류','주의','정보'],sevSel,'tgSev','sev')
        +   '<span class="sortbtn" onclick="event.stopPropagation();tgSort(\'sev\')" title="정렬">'
        +     (sortKey==='sev'? '<span class="sar">'+(sortDir==='asc'?'\u25b2':'\u25bc')+'</span>' : '\u21c5')
        +   '</span></th>'
        + '<th>내용</th>'
        + '<th class="thcell" style="width:118px">'+thFilter('영역',['워크스페이스','개발룸','모델','배포','결재','플랫폼'],catSel,'tgCat','cat')+'</th>'
        /* 한 계정이 여러 워크스페이스에 소속된다. 어느 쪽 일인지 모르면 판단이 안 선다
           (공통정책 2.2 4번). 전역 알림은 워크스페이스가 없어 `-` 로 둔다 */
        + '<th class="thcell" style="width:138px">'+thFilter('워크스페이스',WSOPT,wsSel,'tgWsF','ws')+'</th>'
        + sortTh('at','발생 일시')
        + '</tr></thead><tbody>'
        + view.map(function(x){
            const i=NOTI.indexOf(x);
            /* 읽지 않은 건은 왼쪽 강조선으로 가른다. 색만으로 가르면 다크에서 묻힌다 */
            return '<tr class="nrow'+(x.read?'':' unread')+(sel.indexOf(i)>=0?' rowsel':'')+'" onclick="go('+i+')">'
             + '<td onclick="event.stopPropagation()">'
             +   '<label class="chk"><input type="checkbox"'+(sel.indexOf(i)>=0?' checked':'')+' onchange="tgSel('+i+')"'
             +   ' aria-label="선택"><span class="cbx"></span></label></td>'
             + '<td><span class="stbadge '+SEV[x.sev]+'">'+x.sev+'</span></td>'
             + '<td><div class="ntitle">'+esc(x.t)+'</div>'
             +     '<div class="nbody">'+esc(x.b)+'</div></td>'
             /* 어디로 가는지 미리 보인다. 행을 눌러 봐야 아는 것보다 낫다 —
                워크스페이스 환경 비교표와 같은 규격이다 */
             + '<td><span class="gocell">'+x.cat
             +   '<span class="entgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
             +     '<path d="M14 4h6v6M20 4l-8 8M10 6H5a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1v-5"/></svg></span>'
             + '</span></td>'
             /* 전역 알림(노드 이상·플랫폼 설정 변경)은 워크스페이스가 없다 */
             + '<td>'+(x.ws==='-'? '<span class="dash">-</span>' : '<span class="mver">'+x.ws+'</span>')+'</td>'
             + '<td><span class="nwhen" title="'+x.at+'">'+when(x.at)+'</span></td></tr>';
          }).join('')
        + '</tbody></table></div>'
      : '<div class="state">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
        + (readTab==='unread' && !q && !sevSel.length && !catSel.length
           ? '<h3>읽지 않은 알림이 없습니다.</h3><p>새 알림이 오면 여기에 표시됩니다.</p>'
             + '<button class="btn ghost" onclick="setReadTab(\'all\')">전체 보기</button>'
           : '<h3>조건에 맞는 알림이 없습니다.</h3><p>검색어나 필터를 바꿔 보세요.</p>'
             + '<button class="btn ghost" onclick="resetCond()">조건 초기화</button>')
        + '</div>');

  $('pager').innerHTML = view.length ? pager(tot,pages) : '';
  const el=$('q'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function toolbar(){
  const n=unread();   /* 모두 읽음 버튼 활성 판정에 쓴다 */
  return '<div class="toolbar">'
   /* 읽음 여부를 먼저 가르고 그 안에서 검색한다. 무엇을 보고 있는지가 왼쪽 끝에 있다 */
   + '<div class="segmented">'
   +   '<button class="'+(readTab==='all'?'on':'')+'" onclick="setReadTab(\'all\')">전체</button>'
   /* 세그먼트에 건수를 두지 않는다. GNB `알림` 배지가 같은 값을 이미 알린다
      (공통정책 1.8 · 내 작업함 목업과 같은 규격) */
   +   '<button class="'+(readTab==='unread'?'on':'')+'" onclick="setReadTab(\'unread\')">안 읽음</button>'
   + '</div>'
   + '<div class="searchzone"><div class="searchbar">'
   +   '<svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
   +   '<input id="q" value="'+esc(q)+'" placeholder="항목 이름 또는 값을 입력해 주세요." oninput="q=this.value;page=1;drawList()">'
   + '</div></div>'
   + (q||sevSel.length||catSel.length
      ? '<button class="txtbtn" onclick="resetCond()">조건 초기화</button>' : '')
   /* 목록 전체에 걸리는 액션이라 목록 위에 둔다(공통정책 3.6).
      페이지 헤더는 생성·설정 자리다 — 다른 화면과 같은 규칙이다 */
   /* 건수가 쌓이는 목록이라 다운로드를 둔다(공통정책 2.2 · 3.5).
      본인이 받은 것만 나온다 — 전체 이력은 감사 로그 소관이다 */
   + '<button class="cbtn" title="다운로드" onclick="dlNoti()">'
   +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'
   +   '<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg></button>'
   + '<button class="btn ghost"'
   +   (n? ' onclick="askAllRead()"' : ' disabled title="읽지 않은 알림이 없습니다."')
   +   '>모두 읽음</button>'
   + '</div>'
   /* 선택한 것이 있을 때만 띄운다. 늘 두면 아무것도 안 고른 상태에서 누를 것이 없다 */
   /* 건수는 바로 앞 `N건 선택` 에 있다. 버튼에 또 적지 않는다.
      선택 중에도 `모두 읽음` 을 감추지 않는다 — 전체 선택은 지금 페이지만 고르므로
      건수가 쌓이면 페이지를 돌아야 한다. 둘은 대상이 다르다 */
   + (sel.length
      ? '<div class="selbar"><span><b>'+sel.length+'건</b> 선택</span>'
        + '<button class="btn ghost" onclick="readSelected()">읽음</button>'
        /* 항목을 누르면 바로 읽음이 된다(5.5). 잘못 눌렀을 때 되돌릴 수단을 둔다 —
           읽음은 삭제가 아니라 표시라 되돌려도 잃는 것이 없다 */
        + '<button class="btn ghost" onclick="unreadSelected()">안 읽음</button>'
        + '<button class="txtbtn" onclick="sel=[];drawList()">선택 해제</button></div>'
      : '');
}

/* 페이지당 건수는 표 상단 좌측, 총 건수·이동은 하단(공통정책 3.7 · 라이브러리) */
function pager(tot,pages){
  return '<div class="pager"><span>총 '+tot+'건</span>'
   + '<div style="display:flex;align-items:center;gap:14px">'
   +   '<div class="pgnum">'
   +     '<button'+(page<=1?' disabled':'')+' aria-label="이전" onclick="page--;drawList()">\u2039</button>'
   +     '<input class="pgin" value="'+page+'" onchange="page=Math.min('+pages+',Math.max(1,+this.value||1));drawList()">'
   +     '<span class="pgtot">/ <span>'+pages+'</span></span>'
   +     '<button'+(page>=pages?' disabled':'')+' aria-label="다음" onclick="page++;drawList()">\u203a</button>'
   +   '</div>'
   +   '<select class="sel" style="padding:7px 10px" onchange="per=+this.value.replace(/[^0-9]/g,\'\');page=1;drawList()">'
   +     [20,50,100].map(function(n){ return '<option'+(n===per?' selected':'')+'>'+n+'개씩 보기</option>'; }).join('')
   +   '</select>'
   + '</div></div>';
}

/* 페이지 헤더에는 액션을 두지 않는다. 이 화면에서 만들거나 설정할 것이 없다 */
function drawAct(){ }

/* ══════════ 액션 ══════════ */
/* 행을 누르면 읽음 처리하고 대상 화면으로 보낸다(알림 정책 5.5·5.5) */
function go(i){
  NOTI[i].read = true;
  drawList();
  /* [검토용] 실제 화면에서는 토스트 없이 바로 이동한다.
     이동은 눈으로 확인되는 결과라 따로 알리지 않는다(공통정책 7.6) */
  toast('ok', NOTI[i].to + ' 화면으로 이동합니다.');
}
/* 필터가 걸려 있어도 전체를 처리한다(정책 5.5). 지금 보이는 것만으로 읽히지 않게
   확인 알럿에 건수를 밝힌다 */
/* 다운로드 — 조건이 걸려 있으면 그 결과만, 아니면 전체.
   `모두 읽음` 이 필터와 무관하게 전체를 대상으로 하는 것과 다르다 —
   읽음은 상태를 바꾸는 것이고 다운로드는 지금 보는 것을 뽑는 것이다 */
function dlNoti(){
  const rows=list();
  const filtered = q || sevSel.length || catSel.length || readTab==='unread';
  openConfirm('알림 내역 다운로드',
    (filtered? '지금 보이는 <b>'+rows.length+'건</b>' : '전체 <b>'+rows.length+'건</b>')
    + '을 CSV로 내려받습니다.<br>'
    + '<b>알림내역_'+NOW.toISOString().slice(0,10).replace(/-/g,'')+'.csv</b>',
    function(){ toast('ok','알림 내역을 다운로드했습니다.'); }, '다운로드');
}

/* 읽음을 되돌린다. 배지가 다시 늘어난다 */
function unreadSelected(){
  const n=sel.length;
  sel.forEach(function(i){ NOTI[i].read = false; });
  sel=[]; drawList();
  /* `되돌렸습니다` 로 쓰지 않는다. 실행 취소로 읽히는데 방금 읽은 것이 아니어도
     고를 수 있다 — 오래전에 읽은 알림도 안 읽음으로 바꿀 수 있다.
     `읽음으로 표시했습니다` 와 술어를 맞춘다 */
  toast('ok', n+'건을 안 읽음으로 표시했습니다.');
}

function askAllRead(){
  const n=unread();
  openConfirm('모두 읽음',
    '읽지 않은 알림 <b>'+n+'건</b>을 모두 읽음으로 표시합니다.<br>지금 보이는 목록과 관계없이 전부 처리합니다.',
    allRead, '표시');
}
/* 목록에서 사라지지 않는다. 읽음 표시만 지운다(5.5) */
function allRead(){
  const n=unread();
  base().forEach(function(x){ x.read = true; });
  sel=[]; drawList();
  toast('ok', n+'건을 읽음으로 표시했습니다.');
}
function resetCond(){ q=''; sevSel=[]; catSel=[]; wsSel=[]; page=1; drawList(); }

/* ── 확인 알럿 ─────────────────────────────────── */
function openConfirm(title, body, onOk, okLabel){
  $('cfTitle').textContent = title;
  $('cfBody').innerHTML = body;
  const ok=$('cfOk');
  ok.textContent = okLabel||'확인';
  ok.onclick = function(){ closeConfirm(); if(onOk) onOk(); };
  $('mdConfirm').classList.add('on');
}
function closeConfirm(){ $('mdConfirm').classList.remove('on'); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeConfirm(); closeNoti(); } });

/* ── 선택 ──────────────────────────────────────────
   지금 보이는 쪽만 대상으로 한다. 걸러진 것까지 고르면 무엇을 처리했는지 알 수 없다 */
function tgSel(i){ const k=sel.indexOf(i); if(k<0) sel.push(i); else sel.splice(k,1); drawList(); }
function allSel(view){ return view.length>0 && view.every(function(x){ return sel.indexOf(NOTI.indexOf(x))>=0; }); }
function tgAll(on){
  const view=curView();
  if(on){ view.forEach(function(x){ const i=NOTI.indexOf(x); if(sel.indexOf(i)<0) sel.push(i); }); }
  else  { view.forEach(function(x){ const k=sel.indexOf(NOTI.indexOf(x)); if(k>=0) sel.splice(k,1); }); }
  drawList();
}
function curView(){ const r=list(); return r.slice((page-1)*per, page*per); }
/* 이동하지 않고 읽음만 처리한다. 20건 중 3건만 봤는데 모두 읽음을 누르면 나머지를 놓친다 */
function readSelected(){
  const n=sel.length;
  sel.forEach(function(i){ NOTI[i].read = true; });
  sel=[]; drawList();
  toast('ok', n+'건을 읽음으로 표시했습니다.');
}
/* 읽음 탭을 바꾸면 선택이 남아 있어도 화면에 없는 건이 된다. 함께 비운다 */
function setReadTab(v){ readTab=v; sel=[]; page=1; drawList(); }

/* ══════════ 토스트 ══════════ */
function toast(t,msg){
  const w=$('toasts'); if(!w) return;
  const d=document.createElement('div');
  d.className='toast '+t;
  d.innerHTML='<span class="dot"></span><span>'+msg+'</span><button class="x" onclick="this.parentNode.remove()">\u2715</button>';
  w.appendChild(d);
  setTimeout(function(){ d.remove(); }, t==='ok'?3000:5000);
}

/* ══════════ 팝오버 SYS-NOTI-P01 ══════════
   목록과 같은 NOTI 를 쓴다. 팝오버는 최근 것을 훑는 자리라 최대 5건만 둔다.
   더 보려면 전체 보기로 간다(알림 정책 5.2·5.3) */
const POP_MAX=5;

function drawPop(){
  const n=unread();
  const b=$('notiBadge');
  if(b){ b.textContent = n>99? '99+' : n; b.style.display = n? '' : 'none'; }
  const el=$('notiList');
  if(!el) return;
  const rows=base().slice(0, POP_MAX);
  if(!rows.length){ el.innerHTML='<div class="noti-empty">받은 알림이 없습니다.</div>'; return; }
  el.innerHTML = rows.map(function(x){
    const i=NOTI.indexOf(x);
    return '<button class="noti-item'+(x.read?'':' unread')+'" onclick="go('+i+')">'
     + '<div class="noti-r1">'
     +   '<span class="noti-sev '+SEV[x.sev]+'">'+x.sev+'</span>'
     +   '<span class="noti-t">'+esc(x.t)+'</span>'
     +   '<span class="noti-at">'+when(x.at)+'</span>'
     + '</div>'
     + '<p class="noti-b">'+esc(x.b)+'</p>'
     + '<span class="noti-go">'+x.to
     +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>'
     + '</button>';
  }).join('');
}

/* [검토용] 이 화면에서는 GNB 로 팝오버를 열지 않으므로 규격을 볼 수단을 데모 바에 둔다 */
function demoNoti(e){
  if(e) e.stopPropagation();
  drawPop();
  document.getElementById('notiWrap').classList.add('open');
}

/* 공통 레이아웃 목업에서 GNB 알림을 누르면 이 함수가 돈다.
   이 화면에서는 지금 여기라 호출하지 않는다 */
function toggleNoti(e){
  e.preventDefault(); e.stopPropagation();
  const w=$('notiWrap');
  if(w.classList.contains('open')){ w.classList.remove('open'); return false; }
  drawPop(); w.classList.add('open');
  return false;
}
function closeNoti(){ const w=$('notiWrap'); if(w) w.classList.remove('open'); }
document.addEventListener('click', closeNoti);

/* ══════════ 데모 ══════════ */
function setState(v,btn){
  dstate=v; page=1;
  if(btn){ document.querySelectorAll('#demoBar .st').forEach(function(b){ b.classList.remove('on'); }); btn.classList.add('on'); }
  drawList();
}
function setRole(v,btn){
  role=v; page=1;
  if(btn){ document.querySelectorAll('#demoBar .rl').forEach(function(b){ b.classList.remove('on'); }); btn.classList.add('on'); }
  /* 퍼스널 영역은 GNB 하단 — 워크스페이스를 벗어난 자리라 플랫폼 역할만 표시한다.
     워크스페이스 역할(관리자·편집자·뷰어)은 대상마다 달라 한 값으로 적을 수 없다 */
  const el=$('roleName'); if(el) el.textContent = (v==='super')? '최고 관리자' : '일반 사용자';
  drawList();
}
function toggleGnb(btn){
  const on=document.body.classList.toggle('gnb-fold-on');
  btn.title = on?'사이드바 펼치기':'사이드바 접기';
  btn.querySelector('svg').innerHTML = on
    ? '<path d="M10 6l6 6-6 6"/><path d="M5 5v14"/>'
    : '<path d="M14 6l-6 6 6 6"/><path d="M19 5v14"/>';
}

drawList();
</script>
