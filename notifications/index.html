<!doctype html>
<!--
  콘체르토 매니저 — 알림 목업 v0.1 (2026-08-27)
  색·컴포넌트 규격의 정본은 컴포넌트 라이브러리다. 이 파일에서 새 값을 만들지 않는다.

  ── 화면 구성 ───────────────────────────────────
  SYS-NOTI-L01   알림 (전체 보기)
  SYS-NOTI-P01   알림 팝오버 — GNB 하단 알림에서 연다. 같은 파일에 둔다

  ── 팝오버와 목록 ───────────────────────────────
  같은 데이터를 쓴다. 한쪽에서 읽음 처리하면 다른 쪽 배지도 함께 바뀐다.
  팝오버는 최근 5건만 훑고 대상으로 넘어가는 자리, 목록은 검색·필터로 지나간 것을
  찾는 자리다(알림 정책 5.2·5.3). 공통 레이아웃 목업에도 같은 팝오버가 들어간다 —
  헤더·GNB 는 그쪽이 정본이므로 규격이 갈리면 공통 레이아웃을 따른다.

  ── 왜 목록인가 ─────────────────────────────────
  팝오버는 최근 몇 건을 훑고 대상 화면으로 넘어가는 자리다. 지나간 것을 찾으려면
  검색·필터·페이지네이션이 필요하고, 그것은 팝오버 폭에 들어가지 않는다.
  내 작업함과 같은 규격을 쓴다 — 지나간 기록을 훑는 목록이라는 성격이 같다.

  ── 상세를 두지 않는 이유 ────────────────────────
  알림 한 건에 담긴 것은 심각도·제목·본문·발생 시각·대상뿐이다. 목록 행에 다 들어간다.
  더 알아야 할 것은 대상 화면에 있으므로 행을 누르면 그쪽으로 보낸다(알림 정책 5.4).

  ── 받는 범위 ───────────────────────────────────
  플랫폼 전체에 걸리는 사건(노드 이상 · 구성 요소 연결 · 플랫폼 설정 변경 · 가입 신청)은
  최고 관리자만 받는다(알림 정책 5.7). 데모 바 `권한` 으로 전환해 확인한다 —
  최고 관리자 16건, 워크스페이스 관리자 12건.

  ── 읽음 ────────────────────────────────────────
  행을 누르면 읽음 처리되고 대상으로 이동한다. `모두 읽음` 은 표시만 지우고
  목록에서 없애지 않는다(알림 정책 5.5).

  개별 읽음이 이동을 겸하므로 골라서 읽음만 하는 수단을 따로 둔다 — 20건 중 3건만
  처리했는데 `모두 읽음` 을 누르면 나머지를 놓친다. 선택은 지금 보이는 쪽만 대상이다.

  ── 읽음 구분 ───────────────────────────────────
  `전체` · `안 읽음` 세그먼트다. 값이 둘이고 배타적이라 체크박스로 두지 않는다 —
  체크박스는 켜졌는지 봐야 알고 세그먼트는 지금 무엇을 보는지가 항상 보인다.
  기본은 `전체` 다. 지나간 것을 찾는 목록이기도 하다.

  ── 삭제를 두지 않는 이유 ────────────────────────
  보관 기간이 지나면 시스템이 지운다(정책 5.6). 알림은 통지 기록이라 사용자가 지우면
  무엇을 통지받았는지 남지 않는다. 읽음 처리가 이미 `처리했다` 는 표시다.

  ── 확인 대상 ───────────────────────────────────
  ⚠ 조회 API 와 보관 기간(90일) 은 알림 정책 7장 확인 항목이다.
  ⚠ 알림을 GNB 하단에 두는 지금 자리가 맞는지 확인이 필요하다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콘체르토 매니저 · 알림</title>
<style>
/* ===== 컴포넌트 라이브러리 역할 토큰 (정본) ===== */
:root{
  --background:#f4f6fc; --foreground:#171d33;
  --card:#ffffff; --card-foreground:#171d33;
  --muted:#eef1f9; --muted-foreground:#565f7e;
  /* 용도별 표면 — 표면·호버·선택을 한 토큰으로 쓰면 인접했을 때 구분이 사라진다 */
  --hover:#fafbfe; --hover-strong:#dce2f1; --selected:#dde6f8; --selected-soft:#f2f6fd; --thead:#edf0f7;
  --border:#dce2f1; --border-strong:#b9c3dd; --input:#dce2f1;
  --primary:#3346c9; --primary-foreground:#ffffff; --primary-hover:#26368f;
  --accent:#4f6fe6; --accent-foreground:#0a1026;
  --success:#2f9e6a; --warning:#c98a2e; --destructive:#d64a51; --destructive-hover:#b93b42;
  --ring:#4f6fe6; --underline:#a8b0c8;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --radius:12px;
  /* 레이아웃 전용 (라이브러리 미정의 · 개정 대상) */
  --flyout:#ffffff; --card-2:#f0f3fb; --faint:#8b93ad;
  --shadow:rgba(23,29,51,.10);
  --header-h:58px; --panel-w:440px; --gnb-w:236px;
}
.dark{
  --background:#0d0f14; --foreground:#e6e8ee;
  --card:#16181f; --card-foreground:#e6e8ee;
  --muted:#1c1f27; --muted-foreground:#969ba6;
  --hover:#1b1e26; --hover-strong:#262a33; --selected:#252b38; --selected-soft:#1e2430; --thead:#212530;
  --border:#262a33; --border-strong:#3d4454; --input:#262a33;
  --primary:#4159d6; --primary-foreground:#ffffff; --primary-hover:#35489f;
  --accent:#7d97f0; --accent-foreground:#0a1026;
  --success:#46b17f; --warning:#d9a441; --destructive:#e0585f; --destructive-hover:#c74a51;
  --ring:#7d97f0; --underline:#4d5566;
  --flyout:#181b22; --card-2:#1c1f27; --faint:#6f7686;
  --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:light}
body.dark{color-scheme:dark}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{display:grid;grid-template-columns:var(--gnb-w) 1fr;grid-template-rows:var(--header-h) 1fr;height:calc(100vh - 46px);overflow:hidden;grid-template-areas:"brand header" "gnb main"}

/* ===== 공통 레이아웃 ===== */
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--border)}
.logo-mark svg{width:24px;height:24px}
.brand b{font-size:15.5px;font-weight:700}
.brand b .ai{color:var(--accent)}
.header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border)}
.breadcrumb{color:var(--muted-foreground);font-size:13px}
.breadcrumb b{color:var(--foreground);font-weight:600}
.breadcrumb a{color:var(--muted-foreground);text-decoration:none}
.breadcrumb a:hover{color:var(--foreground)}
.hr{display:flex;align-items:center;gap:9px}
.ws{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer}
.ws .chev{display:grid;place-items:center;color:var(--muted-foreground)}
.ws .chev svg{width:14px;height:14px}
.gnb{grid-area:gnb;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border);overflow:visible}
.banner{margin:14px 12px 8px;height:120px;border-radius:12px;background:linear-gradient(135deg,#7386b2 0%,#8698c4 100%);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 18px}
.banner .bt{font-size:21px;font-weight:800;color:#fff;line-height:1.05;z-index:1;letter-spacing:.5px}
.banner .kv{position:absolute;right:-26px;bottom:-34px;width:170px;height:170px;z-index:0}
.banner .ph-tag{position:absolute;bottom:8px;right:10px;font-size:9px;color:rgba(255,255,255,.62);z-index:1}
.nav{padding:6px 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted-foreground);text-decoration:none;font-size:14px;margin-bottom:3px;position:relative}
.nav a svg{width:19px;height:19px;flex:0 0 auto}
.nav a:hover{background:var(--hover);color:var(--foreground)}
.nav a.active{background:var(--selected);color:var(--foreground);font-weight:600}
.nav a.has-fly::after{content:"›";margin-left:auto;color:var(--faint);font-size:16px}
.flywrap{position:relative}
.flyout{position:absolute;left:calc(100% + 6px);top:0;width:210px;background:var(--flyout);border:1px solid var(--border);border-radius:11px;padding:10px;box-shadow:0 12px 30px var(--shadow);opacity:0;visibility:hidden;transform:translateX(-6px);transition:.13s;z-index:70}
.flywrap:hover .flyout{opacity:1;visibility:visible;transform:translateX(0)}
.flyout a{display:flex;align-items:center;padding:9px 11px;border-radius:8px;color:var(--muted-foreground);text-decoration:none;font-size:13.5px;margin-bottom:2px}
.flyout a:hover{background:var(--hover);color:var(--foreground)}
/* 메뉴 배지는 두지 않는다. `RBAC` 는 내부 용어이고(7.9) 하나만 붙어 왜 이것만인지
   알 수 없다. 규칙서의 `사용자 및 역할(RBAC)` 괄호는 문서용 식별이지 화면 라벨이 아니다 */
.gnb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.worklist{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted-foreground);font-size:14px;margin-bottom:3px;cursor:pointer}
.worklist svg{width:19px;height:19px;color:var(--muted-foreground)}
.cbadge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:700;display:grid;place-items:center}
.worklist:hover{background:var(--hover);color:var(--foreground)}
/* 지금 보고 있는 화면을 밝힌다. GNB 메뉴와 같은 규격이다(.nav a.active) */
.worklist.active{background:var(--selected);color:var(--foreground);font-weight:600}
  /* 지금 보고 있는 화면을 GNB 에서도 표시한다. 내 작업함과 같은 규격 */
  .notice-common.active{background:var(--selected);color:var(--foreground);font-weight:600}

  /* ── 알림 팝오버 (알림 정책 5장) ─────────────────────────
     GNB 하단에서 열리므로 오른쪽 위로 띄운다. 사이드바 폭 밖으로 나간다 */
  .noti-wrap{position:relative}
  .noti-pop{position:absolute;left:calc(100% + 8px);bottom:0;width:360px;max-height:440px;
    background:var(--flyout);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 10px 28px var(--shadow);display:none;flex-direction:column;z-index:60}
  .noti-wrap.open .noti-pop{display:flex}
  .noti-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
  .noti-head h4{margin:0;font-size:14px;font-weight:700;color:var(--foreground)}
  /* 텍스트 버튼 — 흐린 색, 호버 시 밑줄(라이브러리) */
  .noti-allread{margin-left:auto;background:none;border:0;font-family:inherit;font-size:12.5px;
    color:var(--muted-foreground);cursor:pointer;padding:0}
  .noti-allread:hover{text-decoration:underline;color:var(--foreground)}
  .noti-list{overflow:auto;flex:1}
  /* 읽지 않은 건은 왼쪽 강조선으로 가른다. 색만으로 가르면 다크에서 묻힌다 */
  .noti-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
    padding:13px 16px 13px 13px;border-left:3px solid transparent;cursor:pointer;font-family:inherit}
  .noti-item:hover{background:var(--hover)}
  .noti-item.unread{border-left-color:var(--primary);background:var(--selected-soft)}
  .noti-item:last-child{border-bottom:0}
  .noti-r1{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .noti-t{font-size:13px;font-weight:600;color:var(--foreground);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noti-at{font-size:11.5px;color:var(--faint);flex:0 0 auto}
  .noti-b{font-size:12.5px;color:var(--muted-foreground);line-height:1.5;margin:0}
  /* 이동 대상 — 호버 전에는 흐리게 두고 호버하면 드러낸다 */
  .noti-go{display:inline-flex;align-items:center;gap:2px;margin-top:6px;
    font-size:11px;color:var(--faint);opacity:.7;transition:opacity .12s}
  .noti-go svg{width:12px;height:12px}
  .noti-item:hover .noti-go{opacity:1;color:var(--primary)}
  .noti-sev{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;border:1px solid;flex:0 0 auto}
  .noti-sev.cr{color:var(--destructive);border-color:var(--destructive)}
  .noti-sev.wa{color:var(--warning);border-color:var(--warning)}
  .noti-sev.ok{color:var(--success);border-color:var(--success)}
  .noti-foot{padding:11px 16px;border-top:1px solid var(--border);text-align:center}
  .noti-foot button{background:none;border:0;font-family:inherit;font-size:12.5px;
    color:var(--muted-foreground);cursor:pointer}
  .noti-foot button:hover{text-decoration:underline;color:var(--foreground)}
  .noti-empty{padding:38px 16px;text-align:center;font-size:12.5px;color:var(--muted-foreground)}
.worklist.active svg{color:var(--foreground)}
.notice-common{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted-foreground);text-decoration:none;font-size:14px;margin-bottom:10px}
.notice-common svg{width:19px;height:19px}
.worklist .cbadge,.notice-common .cbadge{margin-left:auto}
.notice-common:hover{background:var(--hover);color:var(--foreground)}

.persona{position:relative}
.persona .pbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--card-2);border:1px solid var(--border-strong);width:100%}
.av{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);display:grid;place-items:center;font-size:12px;color:var(--accent);flex:0 0 auto}
.persona .who{line-height:1.25;text-align:left}
.persona .who b{font-size:13px;display:block}
.persona .who span{font-size:11px;color:var(--faint)}
.persona .up{margin-left:auto;display:grid;place-items:center;color:var(--faint)}
.persona .up svg{width:14px;height:14px}
.main{grid-area:main;overflow:auto;position:relative}
/* ===== 페이지 ===== */
/* 페이지는 화면 폭을 다 쓴다. 우측 여백을 두지 않는다.
   패널이 열리면 목록 영역이 패널 폭만큼 줄어 전체 폭 = 목록 + 패널이 된다 */
.page{padding:26px 28px 48px;max-width:none;transition:padding-right .22s ease}
body.panel-on .page{padding-right:calc(var(--panel-w) + 28px)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.phead h1{font-size:21px;margin:0 0 5px;letter-spacing:-.3px}
.phead p{margin:0;font-size:13px;color:var(--muted-foreground)}
.pact{display:flex;gap:8px;flex:0 0 auto}
.btn{padding:8px 15px;background:var(--primary);color:var(--primary-foreground);border:0;border-radius:8px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){background:var(--primary-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--foreground)}
.btn.ghost:hover:not(:disabled){background:var(--hover);border-color:var(--foreground)}
.btn.danger{background:var(--destructive);color:#fff}
/* 진입 버튼은 외곽선, 최종 확인만 채움 */
.btn.danger-line{background:transparent;border:1px solid color-mix(in srgb,var(--destructive) 45%,var(--border));color:var(--destructive)}
.btn.danger-line:hover:not(:disabled){background:color-mix(in srgb,var(--destructive) 8%,transparent);border-color:var(--destructive)}
.btn.danger:hover:not(:disabled){background:var(--destructive-hover)}
.btn svg{width:14px;height:14px}
.btn.sm{padding:6px 11px;font-size:12px}

/* 탭 */
/* 탭 줄 — 탭과 액션을 한 줄에 둔다. 섹션 제목을 두면 탭 라벨과 같은 말이 두 번 나온다.
   헤더 우측은 화면 전체에 걸리는 액션 자리다(개발룸 목업 규격) */
.tabrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--border);margin-bottom:16px}
.tabrow .tabs{border-bottom:0;margin-bottom:0}
.tabrow > div:last-child{padding-bottom:8px}
/* 조회 시각 — 언제 잰 값인지 밝힌다 */
.asof{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted-foreground)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{padding:10px 16px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted-foreground);font-size:13.5px;font-family:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.tabs button.on{color:var(--foreground);border-bottom-color:var(--primary)}
.tabs .cnt{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--muted);color:var(--muted-foreground)}
.tabs button.on .cnt{background:var(--primary);color:var(--primary-foreground)}

/* 툴바 */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;padding:0 11px;background:var(--card);border:1px solid var(--border);border-radius:8px;min-width:260px}
.search svg{width:14px;height:14px;color:var(--muted-foreground);flex:0 0 auto}
.search input{border:0;background:transparent;color:var(--foreground);font-family:inherit;font-size:13px;padding:9px 0;width:100%;outline:none}
.sel{padding:9px 11px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted-foreground);font-size:12.5px;font-family:inherit;color-scheme:light dark}
.tspacer{margin-left:auto}
.cbtn{width:34px;height:34px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border-strong);border-radius:8px;color:var(--muted-foreground)}
.cbtn:hover{color:var(--foreground);border-color:var(--accent)}
.cbtn svg{width:15px;height:15px}

/* 테이블 */
.tblwrap{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:visible}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
/* 헤더 배경은 --muted, 행 호버는 --hover 로 분리한다.
   같은 토큰을 쓰면 마우스를 올린 행이 헤더처럼 보인다 */
table.tbl th{text-align:left;color:var(--muted-foreground);font-weight:600;padding:10px 12px;
  border-bottom:1px solid var(--border);background:var(--thead);white-space:nowrap;user-select:none}
table.tbl th.sortable{cursor:pointer}

table.tbl th.sortable:hover{color:var(--foreground)}
table.tbl th .sar{color:var(--accent);margin-left:3px;font-size:10px}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--foreground);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--hover)}
/* 패널이 열려 있는 대상 표시. .sel 은 select 요소 클래스(126행)와 이름이 겹쳐 쓰지 않는다 */
table.tbl tbody tr.rowsel{background:var(--selected)}

  /* ── 알림 행 (알림 정책 5.5·5.5) ─────────────────────────
     읽지 않은 건은 왼쪽 강조선으로 가른다. 색만으로 가르면 다크에서 묻힌다 */
  .tbl tbody tr.nrow td:first-child{border-left:3px solid transparent}
  .tbl tbody tr.nrow.unread td:first-child{border-left-color:var(--primary)}
  .tbl tbody tr.nrow.unread{background:var(--selected-soft)}
  .tbl tbody tr.nrow.unread:hover{background:var(--selected)}
  /* 제목은 무엇이 일어났는지, 본문은 왜 그렇게 됐는지다. 한 셀에 두되 층위를 가른다 */
  .ntitle{font-size:13px;font-weight:600;color:var(--foreground);margin-bottom:3px}
  .tbl tbody tr.unread .ntitle{font-weight:700}
  .nbody{font-size:12px;color:var(--muted-foreground);line-height:1.5}
  /* 하루 이내는 상대 시각이라 정확한 값은 호버로 본다 */
  .nwhen{font-size:12px;color:var(--muted-foreground);border-bottom:1px dotted var(--underline);cursor:help}
  /* 이동 표시 — 호버 전에는 흐리게 두고 호버하면 드러낸다.
     늘 진하게 두면 목록이 아이콘으로 어수선해진다 */
  .gocell{display:inline-flex;align-items:center}
  .entgo{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;
    border:1px solid var(--border);color:var(--faint);vertical-align:middle;margin-left:7px;
    opacity:.5;transition:opacity .12s}
  .entgo svg{width:11px;height:11px}
  tr:hover .entgo{opacity:1;border-color:var(--foreground);color:var(--foreground);background:var(--card)}
  /* 선택 액션 — 고른 것이 있을 때만 뜬다. 목록 위에 붙여 대상과 액션을 가깝게 둔다 */
  .selbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px;
    background:var(--selected-soft);border:1px solid var(--border);border-radius:9px;
    font-size:12.5px;color:var(--muted-foreground)}
  .selbar b{color:var(--foreground)}
  /* 텍스트 버튼 — 라이브러리 정본. .lnk 는 다른 화면으로 가는 링크라 성격이 다르다.
     button 요소는 폰트를 물려받지 않으므로 크기·굵기를 명시한다 */
  .txtbtn{border:0;background:transparent;color:var(--muted-foreground);
    font-size:12px;font-weight:400;font-family:inherit;cursor:pointer;padding:2px 4px}
  .txtbtn:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
  /* 정렬 — 다른 목업과 같은 규격(공통정책 3.1) */
  .sortable{cursor:pointer}
  .sortable:hover{color:var(--foreground)}
  .sar{color:var(--accent);margin-left:3px;font-size:10px}
  /* 심각도 열은 필터와 정렬이 같이 붙어 아이콘을 따로 둔다 */
  .sortbtn{margin-left:5px;color:var(--faint);cursor:pointer;font-size:11px}
  .sortbtn:hover{color:var(--foreground)}
  /* 선택 열 체크박스 — 브라우저 기본색이 나오지 않게 강조색을 지정한다.
     라이브러리 토큰만 쓴다(--primary) */
  /* 표 안 선택 열 — `.chk` 커스텀 규격을 쓴다. 라벨이 없으므로 간격을 지운다 */
  .tbl .chk{gap:0}
  .tbl .chk .cbx{width:15px;height:15px}
  .tbl .chk input:checked + .cbx::after{left:4px;top:.5px}
table.tbl tbody tr.rowsel:hover{background:var(--selected)}
/* 카드는 흰 면 위라 --selected 를 쓰면 그 카드만 다른 상태처럼 보인다.
   테두리가 선택을 알리고 배경은 거들기만 한다 */
.wcard.rowsel{border-color:var(--accent);background:var(--selected-soft)}
/* 행 이름 — 클릭해 다른 화면으로 가는 것만 밑줄을 둔다.
   .mname 은 이동 대상, .rname 은 강조만 하는 식별자(키 이름·작업 ID·사용자명 등) */
.mname{display:inline-block;font-weight:600;color:var(--foreground);cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--underline);text-underline-offset:3px}
a.mname:hover{text-decoration-color:var(--foreground)}
tr:hover .mname{text-decoration-color:var(--foreground)}
.rname{font-weight:600;color:var(--foreground);text-decoration:none}
.mver{color:var(--muted-foreground);font-size:11.5px;margin-left:6px}
/* 외부 배포는 상세에 볼 정보가 거의 없어 호출 주소를 목록에서 바로 보여준다.
   장문이라 말줄임으로 처리하고 전체는 툴팁·상세에서 확인한다(공통정책 1.2) */
.epcell{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  vertical-align:bottom;font-size:11.5px;color:var(--muted-foreground)}
.dash{color:var(--muted-foreground)}
/* 흐린 글씨 — 값은 있으나 부가 정보인 자리에 쓴다. 빈 값(-)에는 .dash 를 쓴다(1.7) */
.sub{margin-left:4px;color:var(--muted-foreground)}
/* 목록 상태 배지 — 사유가 있으면 호버로 보인다.
   앵커 기본 여백(`.tip-anchor{margin-left:5px}`)을 지운다. 클래스 하나로 두면
   명시도가 같아 뒤에 오는 `.tip-anchor` 가 이겨 배지가 5px 들여쓰인다 */
.tip-anchor.stwrap2{margin-left:0}
.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted-foreground);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}

/* 상태 배지 */
.stbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
.stbadge.ok{color:var(--success);border-color:var(--success)}
.stbadge.wa{color:var(--warning);border-color:var(--warning)}
.stbadge.wn{color:var(--warning);border-color:var(--warning)}
.stbadge.cr{color:var(--destructive);border-color:var(--destructive)}
.stbadge.mu{color:var(--muted-foreground)}
/* 값 하나를 드러내는 자리 — 복사 아이콘을 옆에 붙인다 */
.pwbox{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:var(--muted);border:1px solid var(--border);border-radius:9px}
.pwv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:600;
  letter-spacing:.02em;color:var(--foreground);user-select:all}
.pwwarn{margin:8px 0 0;font-size:11.5px;line-height:1.6;color:var(--destructive)}
.pwact{margin:16px 0 0;font-size:13px;line-height:1.6;color:var(--foreground)}
/* 감사 로그 작업 — 배지가 아니라 글자색으로 가른다 */
/* 값 우측 상단에 복사 아이콘을 띄운다 */
.rawwrap{position:relative}
.rawcopy{position:absolute;top:8px;right:8px;background:var(--card)}
.rawwrap .code{max-height:52vh;overflow:auto;padding-right:44px}
/* 패널에서는 앞부분만 보인다. 전문은 모달에서 본다 */
.rawpeek{max-height:120px;overflow:hidden;position:relative}
.rawpeek::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40px;
  background:linear-gradient(to bottom,transparent,var(--muted))}
/* 긴 값이 들어가는 열 — 폭을 잡아 다른 컬럼을 밀어내지 않게 한다 */
.wcell{max-width:220px}
.cellwrap{display:flex;align-items:center;gap:6px;min-width:0;margin-left:0}
/* 셀 안 툴팁은 넓게 편다. 값이 여러 줄이라 좁으면 줄이 계속 바뀐다 */
.cellwrap .tip{white-space:normal;width:320px;max-width:none;text-align:left;line-height:1.7}
.more2{flex:0 0 auto;font-size:11px;color:var(--muted-foreground);
  border:1px solid var(--border);border-radius:4px;padding:0 5px;line-height:16px}
/* 두 축을 한 드롭다운에 담는다. 갈래 라벨로 나눈다 */
.fdd.wide{min-width:190px}
.fgrp{padding:5px 10px 3px;font-size:11px;font-weight:600;color:var(--muted-foreground)}
/* 수치 셀 — 자릿수를 맞춰 위아래로 견주기 쉽게 한다(컴포넌트 라이브러리 v0.5) */
.num{font-variant-numeric:tabular-nums}
.stbadge.ac{color:var(--accent);border-color:var(--accent)}
.stbadge.load::before{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);white-space:nowrap}

/* 더보기 */
.more{position:relative;display:inline-block}
.morebtn{width:28px;height:28px;display:grid;place-items:center;background:transparent;border:0;border-radius:7px;color:var(--muted-foreground);font-size:16px;line-height:1}
.morebtn:hover{background:var(--hover);color:var(--foreground)}
.rowmenu{position:absolute;right:0;top:calc(100% + 4px);min-width:160px;background:var(--flyout);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 12px 30px var(--shadow);z-index:85;display:none}
.more.open{z-index:85}
.more.open .rowmenu{display:block}
/* 아래 공간이 부족하면 위로 펼친다 — 스크롤 영역 경계에서 잘리는 것을 막는다 */
.more.up .rowmenu{top:auto;bottom:calc(100% + 4px)}
.rowmenu button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:7px;font-size:12.5px;color:var(--foreground)}
.rowmenu button:hover{background:var(--hover)}
.rowmenu button.d{color:var(--destructive)}
/* 상태로 일시적으로 막힌 작업 — 있다는 것은 알리되 지금은 실행할 수 없음을 보인다 */
.rowmenu button:disabled{color:var(--faint);cursor:not-allowed}
.rowmenu button:disabled:hover{background:transparent}
.rowmenu hr{border:0;border-top:1px solid var(--border);margin:5px 0}

/* 페이지네이션 */
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap;gap:10px}
.pgnum{display:flex;align-items:center;gap:6px}
.pgnum button{width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);border-radius:7px;font-size:13px;color:var(--muted-foreground);cursor:pointer}
.pgnum button:hover:not(:disabled){border-color:var(--accent);color:var(--foreground)}
.pgnum button:disabled{opacity:.4;cursor:not-allowed}
.pgnum .pgin{width:46px;height:29px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--foreground);font-size:12.5px;font-family:inherit;color-scheme:light dark}
.pgnum .pgtot{font-size:12.5px;color:var(--muted-foreground)}

/* 상태 화면 */
.state{padding:64px 20px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:11px}
.state svg{width:38px;height:38px;color:var(--muted-foreground);opacity:.5;margin-bottom:12px}
.state h3{margin:0 0 6px;font-size:14px;font-weight:600}
.state p{margin:0 0 16px;font-size:12.5px;color:var(--muted-foreground)}
.skrow{height:14px;border-radius:5px;background:linear-gradient(90deg,var(--muted) 25%,var(--border) 50%,var(--muted) 75%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* 사이드 패널 */
/* 목록이 패널 폭만큼 줄어들어 가려지지 않으므로 배경막을 두지 않는다 */
.panel{position:fixed;top:var(--header-h);right:0;bottom:0;width:var(--panel-w);max-width:92vw;background:var(--card);border-left:1px solid var(--border);z-index:90;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:-14px 0 40px var(--shadow)}
.panel.on{transform:translateX(0)}
.pnhead{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
.pnhead .r1{display:flex;align-items:flex-start;gap:10px}
.pnhead h2{margin:0;font-size:16px;letter-spacing:-.2px;flex:1;word-break:break-all}
.pnhead .ver{font-size:12px;color:var(--muted-foreground);font-weight:400;margin-left:7px}
.pnexp{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border-strong);background:transparent;border-radius:7px;color:var(--muted-foreground);cursor:pointer;flex:0 0 auto}
.pnexp:hover{border-color:var(--accent);color:var(--foreground)}
.pnexp svg{width:14px;height:14px}
.pnclose{width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;border-radius:7px;color:var(--muted-foreground);font-size:17px;flex:0 0 auto}
.pnclose:hover{background:var(--hover)}
.pntags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.pnbody{padding:6px 20px 20px;overflow:auto;flex:1}
.sec{padding:16px 0;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 11px;font-size:12.5px;font-weight:700;color:var(--muted-foreground);letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.dl{display:grid;grid-template-columns:112px 1fr;gap:8px 12px;font-size:12.5px}
  /* 본문 폭 전체를 쓰는 섹션은 2열로 둔다(라이브러리 v0.4) */
  .dl.two{grid-template-columns:112px minmax(0,1fr) 112px minmax(0,1fr);gap:10px 12px}
  .dl.two dd{padding-right:24px}
/* 소속 워크스페이스 — 마이페이지와 같은 규격. 조작이 없는 확인용 목록이라
   테이블 대신 링크 행으로 둔다(공통정책 2.1 — 다른 리소스는 링크로만) */
  /* 제목 옆 상태 배지 — 배포 상세와 같은 규격 */
  .stwrap{margin-left:8px;display:inline-flex;vertical-align:middle}
  .wscnt{margin-left:6px;font-size:12px;font-weight:400;color:var(--muted-foreground)}
  .wslist{margin-top:10px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .wsrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);
    text-decoration:none;color:var(--foreground);font-size:13px;cursor:pointer}
  .wsrow:last-child{border-bottom:0}
  .wsrow:hover{background:var(--hover)}
  .wsic{width:17px;height:17px;color:var(--muted-foreground);flex:0 0 auto}
  .wsic svg{width:100%;height:100%}
  .wsn{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--underline)}
  .wsrow:hover .wsn{text-decoration-color:var(--foreground)}
  .wsrole{margin-left:auto;font-size:11.5px;color:var(--muted-foreground)}
  @media (max-width:860px){ .dl.two{grid-template-columns:112px 1fr} .dl.two dd{padding-right:0} }
.dl dt{color:var(--muted-foreground)}
.dl dd{margin:0;word-break:break-all}
.desc{font-size:12.5px;color:var(--muted-foreground);line-height:1.65;background:var(--muted);border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin-bottom:12px}
/* 이동 링크 — 색이 아니라 밑줄로 구분한다 */
.secact{display:flex;gap:7px;margin-top:12px}
.emptyline{font-size:12.5px;color:var(--muted-foreground);font-style:italic}

/* 모달 */
/* 모달·토스트 등장 — 라이브러리 v0.4 규격 */
@keyframes min{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.mdbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mdbg.on{display:flex}
/* 라이브러리 v0.6 규격이다 — 440px · 최대 높이 88vh · 머리/본문/바닥 각각 패딩 */
.modal{width:440px;max-width:100%;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px var(--shadow);animation:min .18s ease}
.modal.w520{width:520px}
.mdhead{padding:20px 22px 0}
.mdhead h3{margin:0 0 5px;font-size:15.5px}
.mdhead p{margin:0;font-size:12.5px;color:var(--muted-foreground);line-height:1.6}
.mdbody{padding:18px 22px}
.mdfoot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
/* 되돌릴 수 없고 하위 자원이 함께 사라지는 삭제는 이름을 다시 받는다(공통정책 7.5) */
.cfname{margin:0 22px 4px;padding-top:15px;border-top:1px solid var(--border)}
.cfname label{display:block;font-size:12px;color:var(--muted-foreground);margin-bottom:8px;line-height:1.55}
.cfname label b{color:var(--foreground);font-weight:600}
.f{margin-bottom:16px}
/* 폼 라벨 — 라이브러리 .field > label 규격. 굵기를 주지 않아 입력값이 앞선다 */
.f label{display:block;font-size:12.5px;color:var(--muted-foreground);margin-bottom:6px}
.f label .req{color:var(--destructive);margin-left:2px}
.inp{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--foreground);font-size:13px;font-family:inherit;color-scheme:light dark}
.inp:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
.inp.err{border-color:var(--destructive)}
.hint{font-size:11.5px;color:var(--muted-foreground);margin-top:5px;line-height:1.55}
.errmsg{font-size:11.5px;color:var(--destructive);margin-top:5px}
.row2{display:grid;grid-template-columns:150px 1fr;gap:8px}
.noderow{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.noderow:has(input:checked){border-color:var(--primary);background:var(--selected)}
.noderow .nn{font-weight:600;font-size:13px}
.noderow .nm2{font-size:11.5px;color:var(--muted-foreground);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.noderow .rt{margin-left:auto}
.selall{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--muted);border:1px solid var(--border);border-radius:9px;margin-bottom:10px;font-size:12.5px;font-weight:600}
.selall button{border:0;background:transparent;color:var(--muted-foreground);font-size:12px;font-weight:600}

/* 토스트 */
.toast-wrap{position:fixed;top:74px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;width:340px;max-width:calc(100vw - 44px)}
/* ⚠ 라이브러리 규격은 진행 바(.prog)가 붙는 구조라 flex-start·overflow:hidden 이다.
   여기는 진행 바가 없어 center 로 둔다. 등장 동작(tin)은 공통 규격을 따른다 */
.toast{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px var(--shadow);min-width:280px;animation:tin .22s ease}
.toast .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.toast.ok .dot{background:var(--success)}
.toast.cr .dot{background:var(--destructive)}
.toast .x{margin-left:auto;border:0;background:transparent;color:var(--muted-foreground);font-size:14px}

/* 검증 컨트롤 (목업 전용) */

/* 스크린 ID 표기 (목업 전용 · 핸드오프용) */

.secnote{font-size:11.5px;color:var(--muted-foreground);line-height:1.6;margin-top:9px;padding:9px 11px;background:var(--muted);border:1px solid var(--border);border-radius:8px}

/* 검색 (공통정책 3.3) */
/* 검색창과 조건 초기화를 한 줄에 둔다. 세로 배치는 조건 칩을 쌓던 때 구조라
   칩을 없앤 지금은 검색창 아래가 비어 도구 영역 높이가 흔들린다 */
/* 검색창은 남는 폭을 다 쓴다. 조건 초기화는 각 필터에 있어 별도 버튼을 두지 않는다 */
.searchzone{display:flex;align-items:center;flex:1;min-width:280px}
.searchzone .searchbar{flex:1;min-width:0}
.searchbar{position:relative;display:flex;align-items:center;gap:0;background:var(--card);border:1px solid var(--border);border-radius:8px}
.searchbar:focus-within{outline:2px solid var(--ring);outline-offset:-1px;border-color:var(--ring)}

.searchbar .sicon{width:14px;height:14px;color:var(--muted-foreground);margin-left:11px;flex:0 0 auto}
.searchbar input{border:0;background:transparent;color:var(--foreground);font-family:inherit;font-size:13px;padding:9px 30px 9px 11px;width:100%;outline:none}

.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.schip{display:inline-flex;align-items:center;gap:7px;padding:4px 8px 4px 10px;background:var(--muted);border:1px solid var(--border);border-radius:7px;font-size:12px;color:var(--foreground)}

.schip button{border:0;background:transparent;color:var(--muted-foreground);font-size:13px;line-height:1;padding:0;cursor:pointer}
.schip button:hover{color:var(--destructive)}
.chips .clr{border:0;background:transparent;color:var(--muted-foreground);font-size:12px;font-weight:600;padding:4px 6px}
.andmark{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.5px}

/* 다중 선택 필터 (공통정책 3.2) */

/* 툴팁 (공통정책 4.7 · 컴포넌트 라이브러리 원본) */
.tbltop{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground)}
/* 라벨과 아이콘 사이 간격. 붙어 있으면 라벨 일부처럼 읽힌다 */
.tip-anchor{position:relative;display:inline-flex;align-items:center;margin-left:5px;vertical-align:middle}
.tip-anchor .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--flyout);color:var(--foreground);border:1px solid var(--border-strong);font-size:12px;font-weight:400;line-height:1.5;padding:8px 11px;border-radius:7px;opacity:0;visibility:hidden;transition:.12s;z-index:70;pointer-events:auto;box-shadow:0 6px 18px var(--shadow);width:max-content;max-width:340px;white-space:normal;text-align:left}
/* 화살표는 툴팁 표면색을 쓰고 테두리 위로 1px 겹쳐 이음매를 가린다 */
.tip-anchor .tip::after{content:"";position:absolute;top:calc(100% - 1px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--flyout)}
.tip-anchor:hover .tip,.tip-anchor:focus-within .tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.tip-ic{width:16px;height:16px;border-radius:50%;border:1px solid var(--muted-foreground);color:var(--muted-foreground);font-size:11px;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex:0 0 auto}
.tip-anchor:hover .tip-ic,.tip-anchor:focus-within .tip-ic{border-color:var(--foreground);color:var(--foreground)}
.phead h1{display:inline-flex;align-items:center;gap:8px}

/* 페이지 타이틀 툴팁 — 화면 상단이라 아래로 펼침(잘림 방지) */
/* 모달 안에서는 아래로 연다. 위로 열면 모달 상단 경계에서 잘린다.
   모달은 overflow:auto 라 밖으로 나갈 수 없다 */
.tip-anchor.below .tip,.modal .tip-anchor .tip{top:calc(100% + 8px);bottom:auto;left:0;transform:translateX(0) translateY(-4px)}
.modal .tip-anchor:hover .tip,.modal .tip-anchor:focus-within .tip{transform:translateX(0) translateY(0)}
.modal .tip-anchor .tip::after{top:auto;bottom:100%;left:14px;transform:none;border-top-color:transparent;border-bottom-color:var(--flyout)}
.modal .tip-anchor .tip::before{bottom:auto;top:-10px}
/* 모달 폭 안에 들어오게 제한한다 */
.modal .tip-anchor .tip{max-width:280px}

/* 페이지 타이틀은 화면 최상단이라 위로 열면 잘린다. 아래로 연다 */
.dhead .tip-anchor .tip,
.phead .tip-anchor .tip{top:calc(100% + 8px);bottom:auto;left:0;transform:translateX(0) translateY(-4px);max-width:300px}
.dhead .tip-anchor:hover .tip,.dhead .tip-anchor:focus-within .tip,
.phead .tip-anchor:hover .tip,.phead .tip-anchor:focus-within .tip{transform:translateX(0) translateY(0)}
.dhead .tip-anchor .tip::after,
.phead .tip-anchor .tip::after{top:auto;bottom:100%;left:14px;transform:none;border-top-color:transparent;border-bottom-color:var(--flyout)}
.dhead .tip-anchor .tip::before,
.phead .tip-anchor .tip::before{bottom:auto;top:-10px}

/* 사이드 패널(.pnbody)과 본문(.main)은 overflow:auto 라 밖으로 나갈 수 없다.
   가운데 정렬하면 좁은 영역에서 왼쪽이 잘리므로 앵커 기준 왼쪽 정렬하고 폭을 제한한다.
   패널이 열리면 본문 폭이 더 줄어 상세·룸 화면도 같은 처리를 한다 */
.pnbody .tip-anchor .tip,
#detailBody .tip-anchor .tip,
#roomBody .tip-anchor .tip,
#formBody .tip-anchor .tip{left:0;transform:translateX(0) translateY(4px);max-width:260px}
.pnbody .tip-anchor:hover .tip,.pnbody .tip-anchor:focus-within .tip,
#detailBody .tip-anchor:hover .tip,#detailBody .tip-anchor:focus-within .tip,
#roomBody .tip-anchor:hover .tip,#roomBody .tip-anchor:focus-within .tip,
#formBody .tip-anchor:hover .tip,#formBody .tip-anchor:focus-within .tip{transform:translateX(0) translateY(0)}
.pnbody .tip-anchor .tip::after,
#detailBody .tip-anchor .tip::after,
#roomBody .tip-anchor .tip::after,
#formBody .tip-anchor .tip::after{left:14px;transform:none}
.tip-anchor.below:hover .tip,.tip-anchor.below:focus-within .tip{transform:translateX(0) translateY(0)}
.tip-anchor.below .tip::after{top:auto;bottom:100%;left:14px;transform:none;border-top-color:transparent;border-bottom-color:var(--flyout)}

/* 다중 선택 필터 (공통정책 3.2) */

/* 툴팁 유지 — 말풍선 위에서도 호버가 끊기지 않도록 간격을 브리지로 연결 */
.tip-anchor .tip::before{content:"";position:absolute;left:0;right:0;height:10px;bottom:-10px}
.tip-anchor.below .tip::before{bottom:auto;top:-10px}

/* 하단 미리보기 바 (시안 확인용) */

.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:800;background:#0f1320;color:#c9cfe0;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;font-size:12px;border-top:1px solid #2a2f45;}

.demo-bar .demo-label{color:#7f88a8;margin-right:4px;}
/* 라벨과 버튼을 한 덩어리로 묶어 그룹째 줄이 바뀌게 한다 */
.demo-bar .dgrp{display:inline-flex;align-items:center;gap:6px;margin-right:14px;}
/* 목록 구획 제목 — 성격이 다른 항목을 가른다 */
/* 값 태그 — 읽기만 하는 라벨. 배경 없이 테두리로 구분 (라이브러리 v0.3) */
/* 본인 CDE 행 — 목록에서 내 것을 바로 찾을 수 있게 한다 */
table.tbl tbody tr.rowme{background:var(--hover)}
table.tbl tbody tr.rowme:hover{background:var(--hover-strong)}
.vtag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:transparent;border:1px solid var(--border);color:var(--muted-foreground)}
/* 공용 표시 — 라이브러리의 .vtag 를 쓴다. 새 클래스를 만들지 않는다.
   강조색은 선택 상태와 혼동되고 회색 텍스트만 두면 비활성으로 읽힌다.
   테두리가 있어야 라벨로 읽힌다. 이름 링크 밖에 두어 클릭 영역과 분리한다(2.3)
   카드는 우측 상단에 더보기 버튼이 있어 배지가 겹치지 않도록 이름 영역을 좁힌다 */
.wcard .ch .vtag{margin-left:6px;flex:0 0 auto}
.wcard .ch .stwrap{margin-left:6px;flex:0 0 auto}
.wcard .ch .stbadge{font-size:11px;padding:2px 9px}
/* 배지 자체가 앵커다. 목록 상단 카드는 위로 열면 잘리므로 아래로 연다 */
.stwrap{display:inline-flex}
.stwrap .tip{top:calc(100% + 8px);bottom:auto;left:0;transform:translateX(0) translateY(-4px);max-width:280px}
.stwrap:hover .tip,.stwrap:focus-within .tip{transform:translateX(0) translateY(0)}
.stwrap .tip::after{top:auto;bottom:100%;left:14px;transform:none;border-top-color:transparent;border-bottom-color:var(--flyout)}
.stwrap .tip::before{bottom:auto;top:-10px}
table.tbl .wsname .vtag{margin-left:8px}
/* 목록에서 왼쪽 강조선으로 한 번 더 구분한다. 배경은 건드리지 않는다 —
   --muted 는 테이블 헤더·화면 배경과 값이 가까워 배경으로 쓰면 묻힌다.
   목록은 세로로 훑는 화면이라 왼쪽 선이 스캔 방향과 맞는다 */
table.tbl tbody tr.pinrow td:first-child{box-shadow:inset 3px 0 0 var(--border-strong)}
.wcard.pincard{box-shadow:inset 3px 0 0 var(--border-strong)}
.demo-bar button{background:#1c2136;border:1px solid #2f3654;color:#c9cfe0;border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;}
.demo-bar button:hover{border-color:var(--accent);color:#fff;}
.demo-bar .vw.on,.demo-bar .st.on,.demo-bar .rl.on,.demo-bar .gw.on,.demo-bar .mb.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.demo-bar button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

/* GNB 접기 */
.gnb-fold{display:flex;align-items:center;justify-content:flex-end;margin-top:10px}
.foldbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border-strong);background:transparent;border-radius:8px;color:var(--muted-foreground);cursor:pointer}
.foldbtn:hover{border-color:var(--accent);color:var(--foreground)}
.foldbtn svg{width:14px;height:14px}

body.gnb-fold-on{--gnb-w:68px}
body.gnb-fold-on .brand b,
body.gnb-fold-on .nav > a .lb,
body.gnb-fold-on .nav .flywrap > a .lb,
body.gnb-fold-on .worklist .lb,
body.gnb-fold-on .notice-common .lb,
body.gnb-fold-on .persona .who,
body.gnb-fold-on .persona .up,
body.gnb-fold-on .banner .bt,
body.gnb-fold-on .banner .ph-tag{display:none}
body.gnb-fold-on .banner{display:none}
body.gnb-fold-on .brand{justify-content:center;padding:0}
body.gnb-fold-on .nav{padding:14px 8px 6px}
body.gnb-fold-on .nav a{justify-content:center;padding:11px 0}
body.gnb-fold-on .nav a.has-fly::after{content:none}
body.gnb-fold-on .gnb-bottom{padding:10px 8px}
body.gnb-fold-on .worklist,
body.gnb-fold-on .notice-common{justify-content:center;padding:10px 0}
body.gnb-fold-on .worklist .cbadge,
body.gnb-fold-on .notice-common .cbadge{position:absolute;top:4px;right:6px;left:auto;margin:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
body.gnb-fold-on .persona .pbtn{justify-content:center;padding:8px 0}
body.gnb-fold-on .gnb-fold{justify-content:center}

/* 필터 (공통정책 3.2) — 선택지가 적어 펼쳐 제공. 단일 필드 다중 값 OR / 필드 간 AND */

.fclear:hover,.chips .clr:hover,.selall button:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}

/* 컬럼 헤더 — 도움말 팝오버(2.3) + 필터(3.2) */
th .thwrap{display:inline-flex;align-items:center;gap:5px}
.thic{width:15px;height:15px;border-radius:50%;border:1px solid var(--muted-foreground);color:var(--muted-foreground);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex:0 0 auto}
.thfilter{width:18px;height:18px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--muted-foreground);border-radius:4px;cursor:pointer;flex:0 0 auto}
.thfilter:hover{background:var(--hover-strong);color:var(--foreground)}
.thfilter.on{color:var(--primary)}
.dark .thfilter.on{color:var(--accent)}
.thfilter svg{width:12px;height:12px}
.thpop{position:absolute;left:0;top:calc(100% + 6px);width:230px;background:var(--flyout);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:12px;font-weight:400;color:var(--foreground);line-height:1.55;box-shadow:0 12px 30px var(--shadow);z-index:75;display:none;white-space:normal;text-align:left}
th.thcell{position:relative}
/* 클릭이 아니라 호버·포커스로 연다. 다른 툴팁과 방식을 맞춘다 */
th.thcell:hover .thpop,th.thcell:focus-within .thpop{display:block}
.fdd{position:absolute;left:0;top:calc(100% + 6px);min-width:210px;background:var(--flyout);border:1px solid var(--border);border-radius:10px;padding:7px;box-shadow:0 12px 30px var(--shadow);z-index:80;display:none;font-weight:400}
th.thcell.fdd-on .fdd{display:block}
.fdd label{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--foreground);cursor:pointer;white-space:nowrap}
.fdd label:hover{background:var(--hover)}
.fdd label input{accent-color:var(--primary)}
.fdd label .fc{margin-left:auto;font-size:11px;color:var(--faint)}
.fdd hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.fdd .fbtns{display:flex;justify-content:flex-end;gap:6px;padding:2px}
.fdd .fbtns button{padding:5px 11px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;border:1px solid var(--border-strong);background:transparent;color:var(--muted-foreground)}
.fdd .fbtns button.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);font-weight:600}

/* 상세 패널 섹션 접기 — 기본 펼침, 개별 접기 가능 */
.sec > h4{cursor:pointer;user-select:none}
.sec > h4 .fold{margin-left:auto;display:grid;place-items:center;color:var(--muted-foreground);transition:transform .15s}
.sec > h4 .fold svg{width:14px;height:14px}
.sec.closed > h4 .fold{transform:rotate(-90deg)}
.sec.closed .secbody{display:none}
.secbody{padding-top:2px}
/* 패널 항목 도움말 */
.dl dt{display:flex;align-items:center;gap:5px}
/* 가져오기 진행률 (기술문서 §7.3 — 3단계 디커플링) */
.prog{margin-top:8px}
.prog .plabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-foreground);margin-bottom:5px}
.prog .pbar{height:5px;border-radius:3px;background:var(--muted);overflow:hidden}
.prog .pfill{height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.prog .psteps{display:flex;gap:4px;margin-top:6px}
.prog .pstep{flex:1;font-size:10.5px;text-align:center;color:var(--faint);padding:3px 0;border-radius:5px;background:var(--muted)}
.prog .pstep.on{color:var(--primary);font-weight:600;background:color-mix(in srgb,var(--primary) 12%,transparent)}
.prog .pstep.done{color:var(--success)}

/* ── 배포 마법사 ─────────────────────────────────────── */
.wiz{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
/* 라이브러리 v0.6 규격이다 — 폭 230px · sticky */
.wnav{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 12px;position:sticky;top:0}
.wnav h6{margin:0 0 10px;font-size:11px;font-weight:700;color:var(--muted-foreground);letter-spacing:.4px}
.wstep{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.wstep:hover{background:var(--hover)}
.wstep .no{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted-foreground)}
.wstep .tx{font-size:12.5px;color:var(--muted-foreground);line-height:1.45;padding-top:2px}
.wstep .tx b{display:block;font-size:12.5px;color:var(--foreground);font-weight:600}
.wstep .tx span{font-size:11px;color:var(--faint)}
.wstep.on{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.wstep.on .no{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}

.dark .wstep.on .tx b{color:var(--accent)}
.wstep.done .no{background:color-mix(in srgb,var(--success) 16%,transparent);border-color:var(--success);color:var(--success)}
.wstep.err .no{background:color-mix(in srgb,var(--destructive) 14%,transparent);border-color:var(--destructive);color:var(--destructive)}
.wstep.lock{opacity:.5;cursor:not-allowed}
.wbody{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:22px 24px}
.wbody h3{margin:0 0 4px;font-size:16px;letter-spacing:-.2px}
.wbody .sub{font-size:12.5px;color:var(--muted-foreground);margin-bottom:18px;line-height:1.6}
.wfoot{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.wfoot .btns{display:flex;gap:8px;align-items:center}

/* 마법사 폼 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:600;color:var(--muted-foreground)}
.fld .hint{font-size:11px;color:var(--faint);line-height:1.5}
.optcard{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:transparent}
.optcard:hover{border-color:var(--accent)}
.optcard.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 7%,transparent)}
.optcard input{margin-top:3px;accent-color:var(--primary)}
.optcard .oc-t{font-size:13px;font-weight:600;color:var(--foreground);margin-bottom:3px}
.optcard .oc-d{font-size:11.5px;color:var(--muted-foreground);line-height:1.55}
.optcard .oc-tag{display:inline-block;margin-top:6px;font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--muted);color:var(--faint)}
.optcard.on .oc-tag{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.dark .optcard.on .oc-tag{color:var(--accent)}

.adv{border:1px solid var(--border);border-radius:10px;margin-top:16px}
/* overflow:hidden 을 두면 툴팁이 잘린다. 모서리는 안쪽 요소에서 다듬는다 */
.adv > summary{border-radius:9px 9px 0 0}
.adv:not([open]) > summary{border-radius:9px}
.adv > .advbody{border-radius:0 0 9px 9px}
.adv > summary{padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--foreground);cursor:pointer;background:var(--muted);list-style:none;display:flex;align-items:center;justify-content:space-between}
.adv > summary::-webkit-details-marker{display:none}
.adv > summary .chg{font-size:11px;font-weight:600;color:var(--primary);margin-left:auto}
/* 설정 없음 표시도 같은 자리를 쓴다. 규칙이 없으면 .fold 가 auto 를 가져가 붙는다 */
/* 접힘 표시 — 기본 삼각형을 지웠으니 대체를 둔다. 패널 섹션(.sec .fold)과 같은 규격 */
.adv > summary .chg + .fold,
.adv > summary .fold{margin-left:auto;display:grid;place-items:center;color:var(--muted-foreground);
  transform:rotate(-90deg);transition:transform .15s}
.adv[open] > summary .fold{transform:rotate(0)}
.adv > summary .fold svg{width:14px;height:14px}
.advbody{padding:14px}
.advgrp{margin-bottom:14px}
.advgrp:last-child{margin-bottom:0}
.advgrp h6{margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--faint)}
.advrow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:5px 0}
.advrow label{font-size:12px;color:var(--foreground)}
.advrow .sw{justify-self:end}

.review{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.review h6{margin:0;padding:10px 14px;font-size:11.5px;font-weight:700;background:var(--muted);color:var(--muted-foreground)}
.review dl{margin:0;padding:12px 14px;display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:12.5px}
.review dt{color:var(--muted-foreground)}
.review dd{margin:0;color:var(--foreground);word-break:break-all}
.errbox{border:1px solid color-mix(in srgb,var(--destructive) 30%,transparent);background:color-mix(in srgb,var(--destructive) 8%,transparent);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.errbox b{display:block;font-size:12.5px;color:var(--destructive);margin-bottom:7px}
.errbox a{display:block;font-size:12px;color:var(--foreground);padding:3px 0;cursor:pointer;text-decoration:none}
.errbox a:hover{color:var(--destructive)}
/* 동작 확인 — 요청 한 칸, 응답 한 칸. 대화가 쌓이지 않는다 */
.tst{display:flex;flex-direction:column;gap:12px}
.tstf{display:flex;flex-direction:column;gap:6px}
.tstf label{font-size:12px;font-weight:500;color:var(--muted-foreground)}
.tstin{resize:vertical;min-height:56px;font-family:inherit;line-height:1.6}
.tstact{display:flex;justify-content:flex-end;margin-top:-4px}
.tstout{padding:11px 13px;background:var(--card-2);border:1px solid var(--border);
  border-radius:9px;font-size:13px;line-height:1.7;white-space:pre-wrap;min-height:44px}
.tstout.err{border-color:var(--destructive);color:var(--destructive)}
.tstmeta{font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.tstlead{margin:0 0 2px;font-size:12px;color:var(--muted-foreground)}
.tstex{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px;
  font-size:11.5px;color:var(--faint)}
.exbtn{padding:4px 10px;background:var(--card);border:1px solid var(--border);
  border-radius:20px;color:var(--muted-foreground);font-family:inherit;font-size:11.5px;
  cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exbtn:hover{border-color:var(--border-strong);color:var(--foreground)}
.code{background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--foreground);line-height:1.65;white-space:pre;overflow-x:auto}
.sw{position:relative;width:38px;height:21px;border-radius:11px;background:var(--border);cursor:pointer;transition:.15s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on{background:var(--primary)}
.sw.on::after{left:19px}
.warnbox{display:flex;gap:9px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--warning) 32%,transparent);background:color-mix(in srgb,var(--warning) 9%,transparent);border-radius:9px;font-size:12px;line-height:1.6;color:var(--foreground);margin-top:10px}
.warnbox b{color:var(--warning)}

/* ── 배포 상세 페이지 DEP-L01.D01 ─────────────────── */
.dhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
/* 룸 화면 액션 — 개발룸은 별도로 만들고 지우는 대상이라 헤더 우측에 진입점을 둔다 */
.dact{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.back,.dhead .back{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--border-strong);background:var(--card);border-radius:8px;color:var(--muted-foreground);cursor:pointer}
.back:hover,.dhead .back:hover{border-color:var(--accent);color:var(--foreground)}
  /* 아이콘 크기를 규칙으로 둔다. 마크업마다 inline 으로 적으면 화면마다 달라진다 */
  .back svg,.dhead .back svg{width:15px;height:15px}
.dhead .dinfo{flex:1;min-width:0}
.dhead h1{margin:0 0 6px;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dhead .dmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.dcard .ct{font-size:11.5px;color:var(--muted-foreground);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.dcard .cv{font-size:15px;font-weight:600;color:var(--foreground);word-break:break-all}
.dcard .cv.sm{font-size:12.5px;font-weight:400;font-family:ui-monospace,Menlo,monospace}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.dtabs button{padding:10px 16px;border:0;background:transparent;font-size:13.5px;color:var(--muted-foreground);font-family:inherit;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button:hover{color:var(--foreground)}
.dtabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.dark .dtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.dsec{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.dsec > h4{margin:0 0 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.mcard .mt{font-size:11px;color:var(--muted-foreground);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.mcard .mv{font-size:19px;font-weight:700;color:var(--foreground);letter-spacing:-.4px}
.mcard .mv small{font-size:12px;font-weight:400;color:var(--muted-foreground);margin-left:3px}
.mcard .mu{font-size:10.5px;color:var(--faint);margin-top:4px}
.chart{height:150px;background:var(--muted);border:1px solid var(--border);border-radius:9px;display:flex;align-items:flex-end;gap:3px;padding:12px}
.chart .bar{flex:1;background:color-mix(in srgb,var(--primary) 55%,transparent);border-radius:2px 2px 0 0;min-height:3px}
.logbox{background:var(--muted);border:1px solid var(--border);border-radius:9px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.85;max-height:260px;overflow-y:auto;padding:10px 12px}
.logrow{display:flex;gap:9px;white-space:nowrap}
.logrow .ln{color:var(--faint);flex:0 0 22px;text-align:right}
.logrow .ch{flex:0 0 62px;font-weight:600}
.logrow .ch.app{color:var(--success)}
.logrow .ch.infra{color:var(--warning)}
.logrow .ch.system{color:var(--accent)}
.logrow .tm{color:var(--faint);flex:0 0 74px}
.logrow .msg{color:var(--foreground);white-space:pre-wrap}
.logbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.chbtn{padding:5px 11px;border:1px solid var(--border-strong);background:transparent;border-radius:20px;font-size:12px;color:var(--muted-foreground);font-family:inherit;cursor:pointer}
.chbtn.on{background:color-mix(in srgb,var(--primary) 14%,transparent);border-color:var(--primary);color:var(--primary);font-weight:600}
.dark .chbtn.on{color:var(--accent);border-color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--success);margin-left:auto}
.live .ld{width:6px;height:6px;border-radius:50%;background:var(--success);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bmgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.bmgrid .full{grid-column:1/-1}

/* ── 외부 배포 가져오기 DEP-F01 ────────────────── */
.impbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.impbar .found{font-size:13px;color:var(--foreground)}
.impbar .found b{color:var(--primary)}
.dark .impbar .found b{color:var(--accent)}
.impnote{display:flex;gap:9px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);background:color-mix(in srgb,var(--warning) 8%,transparent);border-radius:9px;font-size:12px;line-height:1.65;color:var(--foreground);margin-bottom:16px}
.impnote b{color:var(--warning);display:block;margin-bottom:3px}
.podcell{display:flex;flex-direction:column;gap:3px}
.podcell .pn{font-size:13px;font-weight:600;color:var(--foreground)}
.hwtag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--muted);color:var(--muted-foreground);font-family:ui-monospace,Menlo,monospace}
.impfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.impfoot .sel{font-size:13px;color:var(--muted-foreground)}
.impfoot .sel b{color:var(--foreground)}
table.tbl tr.need td{background:color-mix(in srgb,var(--destructive) 5%,transparent)}

/* ── 진단 (기술문서 §10.5 — 원인 설명 + 조치 권고) ── */
.diag{display:flex;gap:12px;padding:14px 16px;border-radius:11px;margin-bottom:18px;
  border:1px solid color-mix(in srgb,var(--destructive) 30%,transparent);
  background:color-mix(in srgb,var(--destructive) 7%,transparent)}
.diag.warn{border-color:color-mix(in srgb,var(--warning) 32%,transparent);background:color-mix(in srgb,var(--warning) 8%,transparent)}
.diag .dic{width:20px;height:20px;flex:0 0 auto;margin-top:1px;color:var(--destructive)}
.diag.warn .dic{color:var(--warning)}
.diag .dtx{flex:1;min-width:0}
.diag .dtt{font-size:13px;font-weight:600;color:var(--foreground);margin-bottom:5px}
.diag .dds{font-size:12.5px;color:var(--muted-foreground);line-height:1.65;margin-bottom:8px}
.diag .drc{font-size:12.5px;color:var(--foreground);line-height:1.65;padding:8px 11px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.diag .drc b{color:var(--muted-foreground);font-size:11px;display:block;margin-bottom:3px}
.diag .dact{margin-top:10px;display:flex;gap:8px}

/* ── 설정 변경 모달 ── */
.cfggrp{margin-bottom:18px}
.cfggrp:last-child{margin-bottom:0}
.cfggrp .gh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cfggrp .gh h5{margin:0;font-size:12.5px;font-weight:600;color:var(--foreground)}
.cfggrp .gh .gtag{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600}
.cfggrp .gh .gtag.now{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.cfggrp .gh .gtag.rst{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.cfggrp .gh .gtag{background:var(--muted);color:var(--muted-foreground)}
.cfggrp .gh .gtag.now{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.cfgrow .sw{justify-self:end}
.cfgrow .stepper{justify-self:end}
.cfgrow .dash{font-size:12.5px}
.cfggrp .gd{font-size:11.5px;color:var(--faint);line-height:1.55;margin-bottom:10px}
.cfgrow{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;padding:7px 0}
.cfgrow label{font-size:12.5px;color:var(--foreground)}
.cfgrow .chgd{font-size:10.5px;color:var(--warning);margin-left:6px}
.rstwarn{display:flex;gap:9px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--warning) 32%,transparent);background:color-mix(in srgb,var(--warning) 9%,transparent);border-radius:9px;font-size:12px;line-height:1.6;color:var(--foreground);margin-top:14px}
.rstwarn b{color:var(--warning)}

/* 컬럼 도움말 — 상태값 목록 */
.thpop dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 9px;font-size:11.5px}
.thpop dt{font-weight:600;color:var(--foreground);white-space:nowrap}
.thpop dd{margin:0;color:var(--muted-foreground);line-height:1.5}
.thpop{width:290px}

/* ── 워크스페이스 ─────────────────────────────────── */
.wsname{display:flex;align-items:center;gap:9px}
.roomcell{display:flex;gap:6px;flex-wrap:wrap}
.quota{display:flex;flex-direction:column;gap:4px;min-width:120px}
.quota .qrow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted-foreground)}
.quota .qv{font-variant-numeric:tabular-nums;color:var(--foreground);font-size:11px;flex:0 0 auto}

/* 워크스페이스 상세 — 탭 */

/* 자원 점유 현황 카드 */
/* 상세 자원 카드 — 항목이 4개로 고정이라 열 수도 고정한다 */
.qcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
@media (max-width:1080px){ .qcards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){  .qcards{grid-template-columns:1fr} }
.qcard{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.qcard .qnote{font-size:11px;color:var(--faint);margin-top:6px}
.qcard .qt{font-size:11.5px;color:var(--muted-foreground);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.qcard .qn{font-size:17px;font-weight:700;color:var(--foreground);letter-spacing:-.3px;margin-bottom:8px}
.qcard .qn small{font-size:12px;font-weight:400;color:var(--muted-foreground)}
/* 멤버 역할 선택 */
.rolesel{padding:5px 9px;border:1px solid var(--border);background:transparent;border-radius:7px;font-size:12px;color:var(--foreground);font-family:inherit}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);flex:0 0 auto}
.memcell{display:flex;align-items:center;gap:9px}
.keyval{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted-foreground);background:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 8px}

/* 신청 이력 */
.reqtype{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--muted);color:var(--muted-foreground);font-weight:600}

/* 패널 타이틀 하단 설명 — 무엇인지 바로 알 수 있게 상단에 둔다 */
.pndesc{margin:0 0 9px;font-size:12.5px;line-height:1.6;color:var(--muted-foreground)}
.pndesc.none{color:var(--faint)}

/* ── 카드 뷰 ─────────────────────────────────────── */
.viewtg{display:flex;gap:2px;background:var(--muted);border:1px solid var(--border-strong);border-radius:8px;padding:2px}
.viewtg button{width:30px;height:26px;display:grid;place-items:center;border:0;background:transparent;border-radius:6px;color:var(--muted-foreground);cursor:pointer}
.viewtg button.on{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px var(--shadow)}
.viewtg svg{width:14px;height:14px}
/* 카드 목록 — 열 수를 고정하고 폭에 맞춰 늘린다.
   auto-fill 은 화면이 넓어질수록 열이 계속 늘어 카드가 잘게 쪼개진다 */
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media (max-width:1440px){ .cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1080px){ .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:720px){  .cardgrid{grid-template-columns:1fr} }
/* 패널이 열리면 목록 영역이 패널 폭만큼 줄어드므로 열도 하나 줄인다 */
/* 패널이 열려도 3열을 유지한다. 1920px에서 카드 폭이 380px 확보되고
   목록을 그대로 둔 채 대상을 바꿔가며 비교할 수 있다 */
body.panel-on .cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1440px){ body.panel-on .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1080px){ body.panel-on .cardgrid{grid-template-columns:1fr} }
/* 카드는 그리드 셀 높이를 채우고 푸터를 바닥에 붙인다.
   내용이 적은 카드도 같은 높이가 되어 목록이 흐트러지지 않는다 */
.wcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;position:relative;transition:border-color .15s;
  display:flex;flex-direction:column}
.wcard:hover{border-color:var(--accent)}
.wcard .ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;padding-right:28px}
.wcard .ch .wsic{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.wcard .ch .wsic svg{width:16px;height:16px}
.wcard .ch .nm{flex:1;min-width:0}
.wcard .ch .nm b{display:block;font-size:14px;font-weight:600;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .cdesc{font-size:12px;color:var(--muted-foreground);line-height:1.55;margin-bottom:12px;min-height:19px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .cdesc.none{color:var(--faint)}
.wcard .crooms{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;min-height:30px}
/* 갈 수 없는 룸 — 상태로 막힌 작업이라 미노출이 아니라 비활성으로 둔다 */
.roombtn:disabled,.roombtn.off{border-color:var(--border);color:var(--faint);cursor:not-allowed}
.roombtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border-strong);background:transparent;border-radius:7px;font-size:11.5px;color:var(--muted-foreground);cursor:pointer;font-family:inherit}
.roombtn:hover{border-color:var(--accent);color:var(--foreground)}
.roombtn .rdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto}
/* 환경 셀 — 룸 상태를 점과 라벨로 나열한다. 룸이 늘어도 컬럼이 늘지 않는다 */
.envcell{display:inline-flex;align-items:center;gap:14px;white-space:nowrap}
.envone{display:inline-flex;align-items:baseline;gap:7px}
.envlb{font-size:11.5px;color:var(--faint)}
.envv{font-size:12px;color:var(--foreground)}
.envv.err{color:var(--destructive);font-weight:600}
.envv.mu{color:var(--muted-foreground)}
/* 패널 환경 탭 — 운영룸·개발룸 구분 */
.roombtn.add{color:var(--primary);border-style:dashed}
.roombtn .rdot.ok{background:var(--success)}
.roombtn .rdot.cr{background:var(--destructive)}
.roombtn .rdot.mu{background:var(--faint)}
.roombtn .rdot.ac{background:var(--warning)}
.wcard .cfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
.wcard .cres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;color:var(--muted-foreground)}
.wcard .cres b{font-weight:600;color:var(--foreground)}
/* 이동 버튼 — 화살표를 우측 끝에 고정 (라이브러리 Button 이동 변형) */
.resblock .rh .all .ar{margin-left:6px}
/* 다중 선택 · 태그 입력형 (라이브러리 폼·입력 요소) */
.msel{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:var(--card);border:1px solid var(--border);border-radius:8px;min-height:40px;align-items:center}
.msel.err{border-color:var(--destructive)}
.msel:focus-within{border-color:var(--ring)}
.msel .tag{display:inline-flex;align-items:center;gap:6px;background:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 6px 3px 9px;font-size:12px;color:var(--foreground)}
.msel .tag button{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;font-size:14px;line-height:1;padding:0}
.msel .tag button:hover{color:var(--foreground)}
.msel input{border:0;background:transparent;outline:none;color:var(--foreground);font-family:inherit;font-size:13px;flex:1;min-width:90px;padding:4px}
/* 아이콘 선택 — 용도 유형 8종 중 하나 */
.icopick{display:flex;gap:7px;flex-wrap:wrap}
.icopick button{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);display:grid;place-items:center;cursor:pointer;padding:0}
.icopick button svg{width:18px;height:18px}
.icopick button:hover{border-color:var(--border-strong);color:var(--foreground)}
.icopick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.mopt{position:relative}
.mopt .list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--flyout);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);z-index:40;max-height:190px;overflow:auto;padding:4px}
.mopt .list button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:0;font-family:inherit;font-size:12.5px;color:var(--foreground);cursor:pointer;border-radius:6px}
.mopt .list button:hover{background:var(--hover)}
.mopt .list .none{padding:9px 10px;font-size:12px;color:var(--muted-foreground)}
.wcard .cmore{position:absolute;top:12px;right:12px}

/* 연관 리소스 */
.resblock{margin-bottom:16px}
.resblock:last-child{margin-bottom:0}
.resblock .rh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.resblock .rh h5{margin:0;font-size:12.5px;font-weight:600;color:var(--foreground)}
.resblock .rh .cnt{font-size:12px;color:var(--muted-foreground);font-weight:400}
/* 전체 보기 — 이동이지만 부가 동선이라 흐린 색 + 호버 밑줄 */
.resblock .rh .all{margin-left:auto;font-size:12px;color:var(--muted-foreground);cursor:pointer;background:0;border:0;font-family:inherit}
.resblock .rh .all:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
/* 주요 이벤트 — 원문 로그가 아니라 배포에 일어난 일이라 채널 배지·행 번호를 두지 않는다 */
.evlist{list-style:none;margin:0;padding:0}
.evlist li{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.evlist li:last-child{border-bottom:0}
.evlist .tm{flex:0 0 46px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.evlist li.bad .msg{color:var(--destructive)}
/* 구간별 처리 시간 — 막대 길이로 비율을, 숫자로 실제 값을 보여준다.
   길이만으로는 몇 ms 인지 알 수 없고 숫자만으로는 어디가 튀는지 안 보인다 */
.wf{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.wfrow{display:flex;align-items:center;gap:12px;font-size:12.5px}
.wfrow .wfn{flex:0 0 100px;color:var(--muted-foreground)}
.wfrow .wfbar{flex:1;height:20px;background:var(--muted);border-radius:5px;overflow:hidden;min-width:0}
.wfrow .wffill{display:block;height:100%;background:var(--accent);border-radius:5px}
.wfrow .wffill.bad{background:var(--destructive)}
.wfrow .wfms{flex:0 0 88px;text-align:right;font-variant-numeric:tabular-nums}
.wfrow.total{border-top:1px solid var(--border);padding-top:11px;margin-top:2px;font-weight:600}
.wfrow.total .wfn{color:var(--foreground)}
/* ── 마법사 재구성 DEP-W01 ─────────────────────────
   좌측 단계 목록 + 플랫폼 기본값 / 우측 폼.
   잠긴 값은 단계를 차지하지 않고 좌측에 목록으로 둔다 */

/* 좌측 — 플랫폼 기본값 */
.wnav
.wnav
.wnav
.wnav
.wnav
.wnav

/* 단계 상태 */
.wstep.done .no{background:var(--success);color:#fff;border-color:var(--success)}
.wstep.err .no{background:var(--destructive);color:#fff;border-color:var(--destructive)}

/* 본문 머리 */
.whead{margin-bottom:20px}
  .wtabs{display:flex;gap:4px;margin:-4px 0 18px;border-bottom:1px solid var(--border)}
  .wtab{padding:9px 16px;background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--muted-foreground);font-family:inherit;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;margin-bottom:-1px}
  .wtab:hover{color:var(--foreground)}
  .wtab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .wtb{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;
    background:var(--primary);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700}
  .wtab:not(.on) .wtb{background:var(--border-strong);color:var(--card)}
  .pk .rec{flex:0 0 auto;padding:2px 8px;border-radius:20px;font-size:10px;line-height:1.5;
    font-weight:600;white-space:nowrap;
    background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
  .atools{display:flex;gap:8px;align-items:center;margin-bottom:14px}
  /* 목록 검색 — 라이브러리 v0.3 .mssearch. 다중 선택 목록 밖에서도 같은 규격을 쓴다 */
  .mssearch{flex:1;min-width:0;position:relative}
  .mssearch svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);
    width:13px;height:13px;color:var(--muted-foreground);pointer-events:none}
  .mssearch input{width:100%;padding:6px 9px 6px 27px;border:1px solid var(--border);
    border-radius:7px;background:var(--card);color:var(--foreground);font-size:12px;font-family:inherit}
  .mssearch input:focus{outline:none;border-color:var(--accent)}
  .inp.sm{padding:6px 10px;font-size:12.5px}
  .chipbtn{padding:7px 13px;background:var(--card);border:1px solid var(--border);
    border-radius:8px;color:var(--muted-foreground);font-family:inherit;font-size:12.5px;cursor:pointer}
  .chipbtn:hover{border-color:var(--border-strong);color:var(--foreground)}
  .chipbtn.on{background:color-mix(in srgb,var(--primary) 10%,transparent);
    border-color:var(--primary);color:var(--primary);font-weight:600}
  .alist{border:1px solid var(--border);border-radius:10px}
  /* 툴팁이 목록 경계에 잘리지 않게 한다. 모서리는 첫·마지막 행에서 다듬는다 */
  .alist .arow:first-child{border-top-left-radius:9px;border-top-right-radius:9px}
  .alist .arow:last-child{border-bottom-left-radius:9px;border-bottom-right-radius:9px}
  .asec{margin:0;padding:9px 14px;background:var(--muted);font-size:11.5px;font-weight:600;
    color:var(--muted-foreground);letter-spacing:.3px}
  .arow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--border)}
  .asec + .arow{border-top:0}
  .arow .argk{flex:0 0 250px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--foreground);
    display:inline-flex;align-items:center;white-space:nowrap}
  .arow .argv{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
  .arow .argv .inp{max-width:220px}
  .arow .arga{flex:0 0 110px;display:flex;justify-content:flex-end;align-items:center;gap:6px}
  .arow.chg{background:color-mix(in srgb,var(--primary) 4%,transparent)}
  .arow.lock .argk{color:var(--faint)}
  .lockv{font-size:11px;color:var(--faint)}
  .lockval{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted-foreground)}
  /* 엔진 인자 전용. cbadge·rst 는 다른 화면에서 쓰는 이름이라 접두어를 붙인다 */
  .argchg{padding:1px 7px;border-radius:9px;font-size:10px;font-weight:600;
    background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
  .argrst{width:22px;height:22px;display:grid;place-items:center;background:transparent;border:0;
    border-radius:6px;color:var(--muted-foreground);cursor:pointer;font-size:13px;
    font-family:inherit;line-height:1}
  .argrst:hover{background:var(--muted);color:var(--foreground)}
  .aempty{padding:26px;text-align:center;font-size:12.5px;color:var(--muted-foreground)}

  /* 그룹별 탐색(비교 2 채택) — 좌측 카테고리, 우측 본문 */
  .catwrap{display:flex;gap:16px;align-items:flex-start}
  .catnav{flex:0 0 190px;display:flex;flex-direction:column;gap:2px}
  .catnav button{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 12px;border:0;background:transparent;border-radius:8px;
    color:var(--muted-foreground);font-family:inherit;font-size:12px;text-align:left;cursor:pointer}
  .catnav button:hover{background:var(--hover);color:var(--foreground)}
  .catnav button.on{background:color-mix(in srgb,var(--primary) 10%,transparent);
    color:var(--primary);font-weight:600}
  .catnav .cd{width:5px;height:5px;border-radius:50%;background:var(--primary);flex:0 0 auto}
  .catbody{flex:1;min-width:0}
  /* 차트 명시 필드와 엔진 인자 목록을 가른다 — 저장되는 층이 다르다 */
  .advsub{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--foreground)}
  .advnote{margin:0 0 12px;font-size:12px;color:var(--muted-foreground);line-height:1.6}
  /* 그룹마다 항목 수가 달라(1~9개) 전환할 때 화면이 튄다. 높이를 고정한다 */
  .catbody .alist{height:340px;overflow:auto}
  .catnav{position:sticky;top:0}
  /* 목록 안 툴팁은 아래로 띄운다. 위로 띄우면 첫 행에서 화면 밖으로 나간다 */
  .alist .tip-anchor .tip{top:calc(100% + 8px);bottom:auto;left:0;
    transform:translateX(0) translateY(-4px);max-width:280px}
  .alist .tip-anchor:hover .tip,.alist .tip-anchor:focus-within .tip{
    transform:translateX(0) translateY(0)}
  .alist .tip-anchor .tip::after{top:auto;bottom:100%;left:14px;transform:none;
    border-top-color:transparent;border-bottom-color:var(--flyout)}
  .alist .tip-anchor .tip::before{bottom:auto;top:-10px}
  /* 스크롤 영역 안이라 위아래 모두 잘릴 수 있다. 툴팁을 우측으로 띄운다 */
  .alist .tip-anchor .tip{top:50%;bottom:auto;left:calc(100% + 10px);
    transform:translateY(-50%) translateX(-4px);max-width:260px}
  .alist .tip-anchor:hover .tip,.alist .tip-anchor:focus-within .tip{
    transform:translateY(-50%) translateX(0)}
  .alist .tip-anchor .tip::after{top:50%;bottom:auto;left:-10px;
    transform:translateY(-50%);border-color:transparent;border-right-color:var(--flyout)}
  .alist .tip-anchor .tip::before{top:0;bottom:0;left:-10px;right:auto;width:10px;height:auto}
  /* 잠긴 항목 묶음 — 조작 가능한 것 아래에 둔다 */
  .locksec{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .argu{margin-left:7px;font-size:11.5px;color:var(--muted-foreground)}
  @media (max-width:860px){ .catwrap{flex-direction:column} .catnav{flex-direction:row;flex-wrap:wrap;flex:0 0 auto} }

  /* 목록에 없는 인자 — 점선 테두리로 카탈로그 항목과 구분한다 */
  .customargs{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
    display:flex;flex-direction:column;gap:8px}
  .arow.custom{border:1px dashed var(--border-strong);border-radius:8px;padding:8px 14px;
    background:transparent}
  .arow.custom .argk .inp.mono{font-family:ui-monospace,Menlo,monospace}
  .carowerr{font-size:11.5px;color:var(--destructive);padding:0 4px 4px;margin-top:-4px}
  .tgl{width:38px;height:21px;padding:0;border:0;border-radius:11px;background:var(--border-strong);
    cursor:pointer;position:relative;transition:background .15s}
  .tgl.on{background:var(--primary)}
  .tgl .tk{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
    background:#fff;transition:left .15s}
  .tgl.on .tk{left:19px}
  .tgt{font-size:12px;color:var(--muted-foreground)}
  /* 체크박스 — 넣느냐 마느냐를 받는다. 토글은 켜고 끄는 상태를 뜻해 성격이 다르다 */
  .chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .chk input{position:absolute;opacity:0;width:0;height:0}
  .chk .cbx{width:16px;height:16px;flex:0 0 auto;border:1.5px solid var(--border-strong);
    border-radius:4px;background:var(--card);position:relative;transition:.12s}
  .chk:hover .cbx{border-color:var(--foreground)}
  .chk input:checked + .cbx{background:var(--primary);border-color:var(--primary)}
  .chk input:checked + .cbx::after{content:'';position:absolute;left:4.5px;top:1px;
    width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .chk input:focus-visible + .cbx{box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
  .cbt{font-size:12px;color:var(--muted-foreground)}
  .chk input:checked ~ .cbt{color:var(--foreground)}
.whead h3{margin:0 0 4px;font-size:17px;font-weight:700}
.whead p{margin:0;font-size:12.5px;color:var(--muted-foreground)}

/* 구획 — 같은 성격의 입력을 묶는다 */
/* 워크스페이스 목업과 같은 카드 규격. 여백만 두면 입력이 배경 위에 맨몸으로 떠 있다 */
  .fsec{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:18px 20px;margin-bottom:14px}
  /* 모달 안은 이미 카드다. 안에 또 카드를 두지 않고 여백으로만 나눈다 */
  .mdbody .fsec{background:none;border:0;border-radius:0;padding:0;margin-top:16px;margin-bottom:0}
.fsec h4{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.fnote{margin-top:10px;padding:9px 12px;background:var(--muted);border:1px solid var(--border);
  border-radius:8px;font-size:11.5px;color:var(--muted-foreground);line-height:1.6}

/* 두 갈래 선택 — 무엇이 달라지는지 함께 보여준다 */
.pick{display:flex;flex-direction:column;gap:8px}
  /* 흐름 요약 — 텍스트와 화살표만. 도형·연결선은 두지 않는다 */
