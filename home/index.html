<!doctype html>
<!--
  콘체르토 매니저 — 홈 목업 v0.1 (2026-08-28)
  색·컴포넌트 규격의 정본은 컴포넌트 라이브러리다. 이 파일에서 새 값을 만들지 않는다.
  셸(헤더·GNB·플라이아웃)은 공통 레이아웃 목업 규격을 그대로 쓴다.

  ── 화면 구성 ───────────────────────────────────
  HOME-L01   홈

  ── 이 화면이 답하는 것 ─────────────────────────
  1  나한테 할 일이 있나        확인 필요 항목
  2  자원이 남았나              워크스페이스 자원
  3  각 메뉴가 어떤 상태인가     메뉴별 현황
  4  무슨 일이 있었나           최근 알림

  ⚠ 모니터링 개요와 축이 다르다. 모니터링은 시스템을 보고 홈은 내 일을 본다.
    노드·슬롯 단위는 모니터링 소관이다(워크스페이스 정책 10. 11번).

  ── 미정 ────────────────────────────────────────
  · 홈이 워크스페이스 단위인지 계정 단위인지. 지금은 스위처가 고른 워크스페이스 기준이되
    메뉴별 현황의 워크스페이스 카드만 소속 전체를 보인다
  · 최근 활동(감사 로그 요약)을 둘지
  · 각 카드의 수치를 어느 API 로 받는지 — 메뉴마다 따로인지 홈 전용 집계가 있는지

  ── 셸 원본 주석 ────────────────────────────────
  콘체르토 매니저 — 공통 레이아웃 v0.4 (2026-08-26)
  색·토큰 기준은 워크스페이스 목업 v0.2 를 정본으로 삼아 맞춘다.

  v0.4
    · 플랫폼 설정 플라이아웃을 5메뉴로 맞췄다(사용자 및 역할 · 보안 및 감사 ·
      인프라 자원 · 카탈로그 · 연동 및 알림). 종전 4메뉴는 `외부 연동` · `알림 채널` 이라
      플랫폼 설정 목업·용어집과 어긋나 있었다.
    · `RBAC` 배지를 뺐다. 내부 용어이고(공통정책 7.9) 규칙서의 괄호 표기는
      문서용 식별이지 화면 라벨이 아니다.
    · 페이지 타이틀을 메뉴명과 맞췄다 — `모델 레지스트리` → `모델`,
      `글로벌 모니터링` → `모니터링`.

  v0.3
    · 토큰 블록을 목업 v0.2 와 동일하게 통일
      죽은 토큰 제거(--surface · --active · --link), --faint 값 정정,
      누락 토큰 추가(--flyout · --shadow · --underline · --panel-w)
    · 호버 7곳을 --hover 로 — .nav a · .flyout a · .notice-common · .pmenu a
      · .lang-row · .lang-list button (기존 --card-2)
      · .worklist (기존 --card, 면 색과 같아 반응이 보이지 않던 문제)
    · 버튼 테두리 2곳(.persona .pbtn · .foldbtn) --border → --border-strong
    · 하드코딩 그림자 rgba(0,0,0,.55) → var(--shadow) 3곳

  --card-2 는 호버가 빠지면서 용도가 하나로 정리됐다 —
  카드 위에 얹는 컨트롤의 배경(.ws · .pbtn · .toggle · .mp-f input).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콘체르토 매니저 · 공통 레이아웃 (v0.3)</title>
<!--
  콘체르토 매니저 — 공통 레이아웃 (프론트 핸드오프용)
  · 컴포넌트 라이브러리 v0.2 색상 토큰에 맞춤. (: 라이브러리에 없던 레이아웃 전용 색 sidebar·flyout·border-soft·faint·active를 기존 라이브러리 토큰으로 치환 — 모든 색이 라이브러리 역할 토큰만 참조)
  · 치환 매핑: sidebar·header(크롬)→card(흰 크롬), flyout→card, border-soft→border, faint→muted-foreground, active(선택)→border, 메뉴 hover·칩→card-2(muted). 본문 캔버스만 background. 라이브러리 밖 색 제거.
  · 언어·테마 위치: 1안(프로필 팝오버) 확정 반영.
  · 프로토타입 비교 요소(안 토글·변경요소 표시·TO-BE 마킹) 제거.
  · GNB 키비주얼: 제공된 키비주얼 이미지 기준 CSS 재현(디자인 확정 시 교체).
  · 실제 아이콘·간격·모션은 디자인 라이브러리로 확정. 본 파일은 구조·배치 전달용.
-->
<style>
  /* ── 색상 토큰: 컴포넌트 라이브러리 v0.2 기준 (단일 소스) ────────────────
     라이브러리 정의 토큰은 값·이름을 그대로 사용한다.
     ★ 표시는 레이아웃 전용으로 라이브러리에 추가 요청한 토큰(개정 대상). */
  :root{
    --background:#f4f6fc; --foreground:#171d33;
    --card:#ffffff; --card-foreground:#171d33;
    --muted:#eef1f9; --muted-foreground:#565f7e;
    /* 용도별 표면 — 표면·호버·선택을 한 토큰으로 쓰면 인접했을 때 구분이 사라진다 */
    --hover:#fafbfe; --hover-strong:#dce2f1; --selected:#dde6f8; --selected-soft:#f2f6fd; --thead:#edf0f7;
    --border:#dce2f1; --border-strong:#b9c3dd; --input:#dce2f1;
    --primary:#3346c9; --primary-foreground:#ffffff; --primary-hover:#26368f;
    --accent:#4f6fe6; --accent-foreground:#0a1026;
    --success:#2f9e6a; --warning:#c98a2e; --destructive:#d64a51; --destructive-hover:#b93b42;
    --ring:#4f6fe6; --underline:#a8b0c8;
    --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    --radius:12px;
    /* 레이아웃 전용 (라이브러리 미정의 · 개정 대상) */
    --flyout:#ffffff; --card-2:#f0f3fb; --faint:#8b93ad;
    --shadow:rgba(23,29,51,.10);
    --header-h:58px; --panel-w:440px; --gnb-w:236px;
  }
  .dark{
    --background:#0d0f14; --foreground:#e6e8ee;
    --card:#16181f; --card-foreground:#e6e8ee;
    --muted:#1c1f27; --muted-foreground:#969ba6;
    --hover:#1b1e26; --hover-strong:#262a33; --selected:#252b38; --selected-soft:#1e2430; --thead:#212530;
    --border:#262a33; --border-strong:#3d4454; --input:#262a33;
    --primary:#4159d6; --primary-foreground:#ffffff; --primary-hover:#35489f;
    --accent:#7d97f0; --accent-foreground:#0a1026;
    --success:#46b17f; --warning:#d9a441; --destructive:#e0585f; --destructive-hover:#c74a51;
    --ring:#7d97f0; --underline:#4d5566;
    --flyout:#181b22; --card-2:#1c1f27; --faint:#6f7686;
    --shadow:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--background);color:var(--foreground);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{display:grid;grid-template-columns:var(--gnb-w) 1fr;grid-template-rows:var(--header-h) 1fr;height:calc(100vh - 46px);overflow:hidden;grid-template-areas:"brand header" "gnb main"}

  /* 브랜드 */
  .brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--border)}
  .logo-mark{display:grid;place-items:center;width:24px;height:24px;flex:0 0 auto;color:var(--foreground)}
  .logo-mark svg{width:24px;height:24px}
  .brand b{font-size:15.5px;font-weight:700}
  .brand b .ai{color:var(--accent)}

  /* 헤더 */
  .header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border)}
  .breadcrumb{color:var(--muted-foreground);font-size:13px}.breadcrumb b{color:var(--foreground);font-weight:600}
  .hr{display:flex;align-items:center;gap:9px}
  /* 워크스페이스 스위처 — 다른 화면과 같은 규격(워크스페이스 정책 2.7.1) */
  .hr{display:flex;align-items:center;gap:9px}
.ws{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer}
  .wswrap{position:relative}
  .wswrap.open .wsdd{display:block}
  .ws{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer}
/* 워크스페이스 스위처 — 배포 목업과 같은 규격(워크스페이스 정책 2.7.1) */
.wswrap{position:relative}
.ws{font-family:inherit;color:var(--foreground)}
.ws:disabled{cursor:default;opacity:.75}
.ws:disabled .chev{display:none}
/* 헤더 우측에 있으므로 오른쪽 끝을 버튼에 맞추고 왼쪽으로 펼친다.
   left:0 으로 두면 버튼보다 넓은 목록이 화면 밖으로 밀려난다 */
.wsdd{display:none;position:absolute;top:calc(100% + 5px);right:0;min-width:262px;max-width:min(320px,calc(100vw - 40px));z-index:120;
  background:var(--flyout);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 14px 34px var(--shadow);overflow:hidden}
.wswrap.open .wsdd{display:block}
.wsdd .wssearch{padding:9px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--flyout)}
.wsdd .wssearch input{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;
  background:transparent;color:var(--foreground);font-size:12.5px;font-family:inherit}
.wsdd .wslist{max-height:274px;overflow-y:auto;padding:5px}
.wsdd .wsitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;background:transparent;
  border-radius:7px;font-size:12.5px;color:var(--foreground);font-family:inherit;cursor:pointer;text-align:left}
.wsdd .wsitem:hover{background:var(--hover)}
.wsdd .wsitem.on{background:var(--selected);font-weight:600}
.wsdd .wsitem .wic{width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.wsdd .wsitem .wic svg{width:12px;height:12px}
.wsdd .wsitem .wnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsdd .wsitem .wck{color:var(--accent);flex:0 0 auto}
.wsdd hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.wsdd .wsempty{padding:16px 12px;text-align:center;font-size:12px;color:var(--faint)}
.ws .chev{color:var(--muted-foreground)}


  /* GNB */
  .gnb{grid-area:gnb;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border);overflow:visible}
  /* 브랜드 키비주얼 배너 */
  .banner{margin:14px 12px 8px;height:120px;border-radius:12px;background:linear-gradient(135deg,#7386b2 0%,#8698c4 100%);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 18px}
  .banner .bt{font-size:21px;font-weight:800;color:#fff;line-height:1.05;z-index:1;letter-spacing:.5px}
  .banner .kv{position:absolute;right:-26px;bottom:-34px;width:170px;height:170px;z-index:0}
  .banner .ph-tag{position:absolute;bottom:8px;right:10px;font-size:9px;color:rgba(255,255,255,.62);z-index:1}
  .nav{padding:6px 12px;flex:0 0 auto}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted-foreground);text-decoration:none;font-size:14px;margin-bottom:3px;position:relative}
  .nav a svg{width:19px;height:19px;flex:0 0 auto}
  .nav a:hover{background:var(--hover);color:var(--foreground)}
  .nav a.active{background:var(--border);color:var(--foreground);font-weight:600}
  .nav a.has-fly::after{content:"›";margin-left:auto;color:var(--muted-foreground);font-size:16px}

  /* 플라이아웃 (플랫폼 설정 호버) */
  .flywrap{position:relative}
  .flyout{position:absolute;left:calc(100% + 6px);top:0;width:210px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px;box-shadow:0 12px 30px var(--shadow);opacity:0;visibility:hidden;transform:translateX(-6px);transition:.13s;z-index:70}
  .flywrap:hover .flyout{opacity:1;visibility:visible;transform:translateX(0)}
  .flyout a{display:flex;align-items:center;padding:9px 11px;border-radius:8px;color:var(--muted-foreground);text-decoration:none;font-size:13.5px;margin-bottom:2px}
  .flyout a:hover{background:var(--hover);color:var(--foreground)}
  .flyout a.on{background:var(--border);color:var(--foreground);font-weight:600}
  .flyout a .tb{font-size:9.5px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:5px;padding:1px 5px;margin-left:6px}

  /* 하단: 내 작업함 + 퍼스널 */
  .gnb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
  .worklist{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted-foreground);font-size:14px;margin-bottom:3px;cursor:pointer}
  .worklist svg{width:19px;height:19px;color:var(--muted-foreground)}
  .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:700;display:grid;place-items:center}
  .worklist:hover{background:var(--hover);color:var(--foreground)}
.notice-common{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted-foreground);text-decoration:none;font-size:14px;margin-bottom:10px}
  .notice-common svg{width:19px;height:19px}
  .worklist .badge,.notice-common .badge{margin-left:auto}

  /* ── 알림 팝오버 (알림 정책 5장) ─────────────────────────
     GNB 하단에서 열리므로 오른쪽 위로 띄운다. 사이드바 폭 밖으로 나간다 */
  .noti-wrap{position:relative}
  .noti-pop{position:absolute;left:calc(100% + 8px);bottom:0;width:360px;max-height:440px;
    background:var(--flyout);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 10px 28px var(--shadow);display:none;flex-direction:column;z-index:60}
  .noti-wrap.open .noti-pop{display:flex}
  .noti-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
  .noti-head h4{margin:0;font-size:14px;font-weight:700;color:var(--foreground)}
  /* 텍스트 버튼 — 흐린 색, 호버 시 밑줄(라이브러리) */
  .noti-allread{margin-left:auto;background:none;border:0;font-family:inherit;font-size:12.5px;
    color:var(--muted-foreground);cursor:pointer;padding:0}
  .noti-allread:hover{text-decoration:underline;color:var(--foreground)}
  .noti-list{overflow:auto;flex:1}
  /* 읽지 않은 건은 왼쪽 강조선으로 가른다. 색만으로 가르면 다크에서 묻힌다 */
  .noti-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
    padding:13px 16px 13px 13px;border-left:3px solid transparent;cursor:pointer;font-family:inherit}
  .noti-item:hover{background:var(--hover)}
  .noti-item.unread{border-left-color:var(--primary);background:var(--selected-soft)}
  .noti-item:last-child{border-bottom:0}
  .noti-r1{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .noti-t{font-size:13px;font-weight:600;color:var(--foreground);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noti-at{font-size:11.5px;color:var(--faint);flex:0 0 auto}
  .noti-b{font-size:12.5px;color:var(--muted-foreground);line-height:1.5;margin:0}
  /* 이동 대상 — 호버 전에는 흐리게 두고 호버하면 드러낸다 */
  .noti-go{display:inline-flex;align-items:center;gap:2px;margin-top:6px;
    font-size:11px;color:var(--faint);opacity:.7;transition:opacity .12s}
  .noti-go svg{width:12px;height:12px}
  .noti-item:hover .noti-go{opacity:1;color:var(--primary)}
  .noti-sev{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;border:1px solid;flex:0 0 auto}
  .noti-sev.cr{color:var(--destructive);border-color:var(--destructive)}
  .noti-sev.wa{color:var(--warning);border-color:var(--warning)}
  .noti-sev.ok{color:var(--success);border-color:var(--success)}
  .noti-foot{padding:11px 16px;border-top:1px solid var(--border);text-align:center}
  .noti-foot button{background:none;border:0;font-family:inherit;font-size:12.5px;
    color:var(--muted-foreground);cursor:pointer}
  .noti-foot button:hover{text-decoration:underline;color:var(--foreground)}
  .noti-empty{padding:38px 16px;text-align:center;font-size:12.5px;color:var(--muted-foreground)}
.notice-common:hover{background:var(--hover);color:var(--foreground)}
  .notice-common .rdot2{position:absolute;left:24px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--destructive)}
  .persona{position:relative}
  .persona .pbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--card-2);border:1px solid var(--border-strong);cursor:pointer;width:100%}
  .persona .pbtn:hover{border-color:var(--accent)}
  .av{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);display:grid;place-items:center;font-size:12px;color:var(--accent);flex:0 0 auto}
  .persona .who{line-height:1.25;min-width:0;text-align:left}
  .persona .who b{font-size:13px;display:block}
  .persona .who span{font-size:11px;color:var(--muted-foreground)}
  .persona .up{margin-left:auto;color:var(--muted-foreground);transition:transform .15s}
  .persona.open .up{transform:rotate(180deg)}
  .pmenu{position:absolute;left:0;bottom:calc(100% + 8px);width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px;box-shadow:0 12px 30px var(--shadow);opacity:0;visibility:hidden;transform:translateY(6px);transition:.13s;z-index:70}
  .persona.open .pmenu{opacity:1;visibility:visible;transform:translateY(0)}
  .persona.open .pbtn{border-color:var(--accent)}
  .pmenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted-foreground);text-decoration:none;font-size:13px}
  .pmenu a:hover{background:var(--hover);color:var(--foreground)}
  .pmenu a svg{width:16px;height:16px}
  .pmenu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
  .pm-head{display:flex;align-items:center;gap:10px;padding:6px 10px 8px}
  .pm-head .av{width:32px;height:32px;flex:0 0 auto}
  .pm-who{line-height:1.35;min-width:0}
  .pm-who b{font-size:13px;display:block}
  .pm-who span{font-size:11px;color:var(--muted-foreground);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pmenu .theme{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;font-size:13px;color:var(--muted-foreground);cursor:pointer}
  .toggle{width:38px;height:20px;border-radius:11px;background:var(--card-2);border:1px solid var(--border);position:relative;transition:.15s;flex:0 0 auto}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted-foreground);transition:.15s}
  .toggle.on{background:rgba(111,155,239,.3);border-color:var(--accent)}
  .toggle.on::after{left:20px;background:var(--accent)}
  /* 언어: 한 줄 → 클릭 시 인라인 펼침 */
  .lang-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted-foreground);font-size:13px;cursor:pointer}
  .lang-row:hover{background:var(--hover);color:var(--foreground)}
  .lang-row svg.gl{width:16px;height:16px;flex:0 0 auto}
  .lang-row .cur{margin-left:auto;color:var(--muted-foreground);font-size:12px}
  .lang-row .cv{margin-left:6px;color:var(--muted-foreground);transition:transform .15s}
  .lang-row .cv svg{width:13px;height:13px;display:block}
  .lang-row.open .cv{transform:rotate(180deg)}
  .lang-list{max-height:0;overflow:hidden;transition:max-height .18s ease}
  .lang-list.open{max-height:140px}
  .lang-list button{display:flex;align-items:center;width:100%;gap:10px;padding:8px 10px 8px 36px;border:0;background:transparent;border-radius:8px;color:var(--muted-foreground);font-size:12.5px;text-align:left;cursor:pointer}
  .lang-list button:hover{background:var(--hover);color:var(--foreground)}
  .lang-list button .ck{margin-left:auto;color:var(--accent);opacity:0}
  .lang-list button.sel .ck{opacity:1}
  .lang-list button.sel{color:var(--foreground)}
  .lang-list button .ck svg{width:14px;height:14px;display:block}

  /* 메인 */
  .main{grid-area:main;background:var(--background);overflow-y:auto;overflow-x:hidden;padding:24px 28px;min-height:0}
  /* ═══════ 홈 (HOME-L01) ═══════
     중요도에 따라 크기를 가른다. 같은 크기로 늘어놓으면 무엇을 먼저 봐야 할지 안 정해진다.

     1행  확인 필요 항목 (넓게) + 최근 알림 (우측 세로)
     2행  워크스페이스 자원 4장
     3행  배포 · 모니터링 (크게) — 지금 돌고 있는 것
     4행  워크스페이스 · 개발룸 · 모델 (작게) — 갖고 있는 것 */
  /* 두 열 높이를 맞춘다. 행 높이가 달라(할 일 한 줄 · 알림 두 줄) 각자 두면 어긋난다.
     내용이 넘치면 그 카드 안에서 스크롤한다 */
  .hgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);
    gap:16px;align-items:stretch;margin-bottom:22px}
  .hgrid>div{display:flex;flex-direction:column;min-width:0}
  .hgrid .hsec{display:flex;flex-direction:column;margin-bottom:18px}
  .hgrid .hsec.last{margin-bottom:0}
  /* 왼쪽은 한 덩어리라 남은 높이를 다 쓴다. 오른쪽은 둘로 나뉜다 */
  .hgrid>div:first-child .hsec{flex:1}
  /* 카드 높이에 맞춰 행을 균등하게 벌린다. 다섯이 우측 두 카드와 같은 높이에 들어간다 */
  .hgrid>div:first-child .todos{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .hgrid>div:first-child .todo{flex:1;min-height:0}
  /* 비어 있어도 자리를 지킨다. 왼쪽이 줄면 오른쪽 두 카드와 높이가 어긋난다 */
  .hgrid>div:first-child .todos.empty{display:block;overflow:visible}
  .hgrid>div:last-child .hsec:first-child{flex:1}
  .hgrid>div:last-child .hsec:first-child .nlist{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .hgrid>div:last-child .hsec:first-child .nrow{flex:1;min-height:0}
  .hgrid .hstate{flex:1;display:grid;place-content:center}
  /* 결재 행 — 알림 목록과 같은 카드 규격을 쓴다 */
  .taskrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 15px;border-bottom:1px solid var(--border);font-size:12.5px;
    color:var(--muted-foreground)}
  .taskrow:last-child{border-bottom:0}
  /* 인사말 줄 — 조회 기준을 우측에 둔다. 제목과 같은 줄이라 스크롤 전에 눈에 든다.
     셸에 `.ph-row` 가 이미 있어 이름을 가른다 */
  .phrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .phscope{margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    border:0;background:transparent;padding:4px 2px;
    font-family:inherit;font-size:12.5px;color:var(--muted-foreground);cursor:pointer}
  .phscope:hover{color:var(--foreground)}
  .phscope svg{width:12px;height:12px;opacity:.65}

  .hsec{margin-bottom:22px}
  .hsec.last{margin-bottom:0}
  .hsec:last-child{margin-bottom:0}
  .hsec-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;
    margin-bottom:11px;letter-spacing:-.2px;flex:0 0 auto}
  /* 건수는 색이 아니라 굵기로 강조한다. 빨간 배지는 GNB 알림 배지와 같아 보인다 */
  .hcnt{font-size:13.5px;font-weight:700;color:var(--destructive)}
  /* 계정 축 도움말 — 스위처와 다른 기준으로 도는 자리라 왜 그런지 밝힌다.
     라이브러리 `.tip-ic` 규격 */
  .tipic{width:15px;height:15px;border-radius:50%;border:1px solid var(--muted-foreground);
    color:var(--muted-foreground);font-size:10px;font-weight:400;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:help;flex:0 0 auto}
  .tipic:hover{border-color:var(--foreground);color:var(--foreground)}
  .hmore{margin-left:auto;display:inline-flex;align-items:center;gap:3px;
    border:0;background:transparent;color:var(--muted-foreground);
    font-family:inherit;font-size:12px;cursor:pointer;padding:3px 4px}
  .hmore:hover{color:var(--foreground)}
  .hmore svg{width:12px;height:12px}

  /* 할 일 — 조치가 필요한 것. 가장 넓은 자리를 준다.
     자원은 필요할 때 보지만 결재는 놓치면 남이 기다린다 */
  /* 카드 하나로 감싸고 안에서 구분선으로 가른다. 카드를 여럿 늘어놓으면
     `확인 필요 항목` 이라는 한 덩어리가 아니라 낱개로 읽힌다 */
  .todos{background:var(--card);border:1px solid var(--border);border-radius:11px;
    overflow:hidden}
  /* 심각도는 왼쪽 색 띠로 둔다. 배지를 쓰면 최근 알림과 형태가 같아진다 */
  .todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:12px 15px 12px 12px;background:transparent;border:0;
    border-bottom:1px solid var(--border);cursor:pointer;font-family:inherit;
    border-left:3px solid transparent}
  .todo:last-child{border-bottom:0}
  .todo:hover{background:var(--hover)}
  /* 위험만 색을 준다. 다섯 중 넷이 주황이면 주황이 기본색처럼 보여
     정작 급한 것이 안 걸린다. 주의는 띠가 있다는 것으로 조치 대상임을 표시한다 */
  .todo.cr{border-left-color:var(--destructive)}
  .todo.wa{border-left-color:var(--border-strong)}
  .todo.wa:hover{border-left-color:var(--accent)}
  .todo-b{flex:1;min-width:0}
  .todo-t{display:block;font-size:13px;color:var(--foreground);line-height:1.5}
  .todo-t b{font-weight:700}
  .todo-s{display:block;font-size:11.5px;color:var(--faint);margin-top:3px}
  /* 조치 문구 — 눌러서 무엇을 하는지 적는다. `›` 만 두면 어디로 가는지 모른다 */
  .todo-a{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
    font-size:12px;color:var(--muted-foreground);white-space:nowrap}
  .todo-a svg{width:12px;height:12px}
  .todo:hover .todo-a{color:var(--foreground)}
  /* 비어 있을 때 — 한 줄로 줄이되 자리는 남긴다 */
  .todos.empty{padding:14px 15px;font-size:12.5px;color:var(--muted-foreground);flex:0 0 auto}

  /* 자원 — 이 워크스페이스가 얼마나 쓰는가만 둔다.
     노드·슬롯 단위는 모니터링 소관이다(워크스페이스 정책 10. 11번) */
  /* 자원 넷은 한 덩어리다. 카드로 쪼개면 서로 견주기 어렵다 —
     한 카드 안에 세로 구분선으로 가른다 */
  .rescards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    overflow:hidden}
  .rescard{padding:14px 16px;border-right:1px solid var(--border);
    border-bottom:1px solid var(--border)}
  .rescard:last-child{border-right:0}
  /* 좁은 화면에서 줄이 바뀌면 세로선이 어긋난다. 가로선을 함께 두고
     마지막 줄만 지운다 — 넷이 한 줄이면 가로선이 안 보인다 */
  @media (min-width:1100px){ .rescard{border-bottom:0} }
  .res-t{font-size:11.5px;color:var(--muted-foreground);margin-bottom:7px}
  .res-v{font-size:21px;font-weight:700;letter-spacing:-.4px;margin-bottom:9px;
    font-variant-numeric:tabular-nums}
  .res-v small{font-size:12px;font-weight:600;color:var(--muted-foreground);margin-left:5px}
  .res-s{font-size:11px;color:var(--faint);margin-top:8px}

  /* 메뉴 카드 — 전체가 링크다. 카드 안에 또 링크를 두면 어디를 눌러야 할지 갈린다 */
  .mcards{display:grid;gap:12px}
  /* 지금 돌고 있는 것 — 둘로 나눠 넓게 */
  .mcards.big{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  /* 갖고 있는 것 — 셋으로 나눠 좁게 */
  .mcards.sm{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  /* 행 수가 달라도 카드 높이가 같아야 한다. 값과 하위 행 사이를 늘려 맞춘다 */
  .mcard{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--border);border-radius:11px;padding:15px 17px;
    cursor:pointer;font-family:inherit}
  .mcard:hover{background:var(--hover);border-color:var(--border-strong)}
  .mc-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .mc-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;
    background:var(--muted);color:var(--muted-foreground);flex:0 0 auto}
  .mc-ic svg{width:15px;height:15px}
  .mc-t{font-size:13px;font-weight:700;color:var(--foreground)}
  .mc-go{margin-left:auto;display:inline-flex;align-items:center;gap:3px;
    font-size:11.5px;color:var(--muted-foreground)}
  .mc-go svg{width:11px;height:11px}
  .mcard:hover .mc-go{color:var(--foreground)}
  .mc-v{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:11px;
    font-variant-numeric:tabular-nums;flex:1}
  /* 큰 카드는 값도 크게 — 중요도를 크기로 가른다 */
  .mcards.big .mc-v{font-size:30px}
  .mc-v small{font-size:12px;font-weight:600;color:var(--muted-foreground);margin-left:4px}
  .mc-rows{border-top:1px solid var(--border);padding-top:9px;flex:0 0 auto}
  .mc-r{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;color:var(--muted-foreground);padding:3px 0}
  .mc-n{color:var(--foreground)}
  .mc-r .stbadge{font-size:11px;padding:1px 8px}

  /* 최근 알림 — 지나간 기록이다. 조치할 것은 왼쪽 `확인 필요 항목` 가 담는다.
     우측에 세로로 두어 조치와 기록을 나란히 보되 무게를 가른다 */
  .nlist{background:var(--card);border:1px solid var(--border);border-radius:11px;
    overflow:hidden}
  .nrow{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    padding:11px 14px;background:transparent;border:0;border-bottom:1px solid var(--border);
    cursor:pointer;font-family:inherit}
  .nrow:last-child{border-bottom:0}
  .nrow:hover{background:var(--hover)}
  .nrow .stbadge{flex:0 0 auto;margin-top:1px;font-size:11px;padding:2px 9px}
  .n-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--foreground)}
  .n-b{display:block;font-size:11.5px;font-weight:400;color:var(--muted-foreground);
    margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .n-w{font-size:11px;color:var(--faint);flex:0 0 auto}

  /* 상태 배지 — 라이브러리 규격 */
  .stbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:3px 11px;border-radius:20px;border:1px solid var(--border);
    color:var(--muted-foreground);white-space:nowrap}
  .stbadge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .stbadge.ok{color:var(--success);border-color:var(--success)}
  .stbadge.wa{color:var(--warning);border-color:var(--warning)}
  .stbadge.cr{color:var(--destructive);border-color:var(--destructive)}
  /* 정보는 조치가 필요 없다. 색을 빼고 테두리만 둔다 */
  .stbadge.mu{color:var(--faint);border-color:var(--border)}
  .stbadge.ac{color:var(--accent);border-color:var(--accent)}

  /* 자원 막대 — 라이브러리 규격. 임계값을 넘을 때만 색을 쓴다 */
  .hbar{height:6px;background:var(--border);border-radius:20px;overflow:hidden}
  .hbar i{display:block;height:100%;border-radius:20px;
    background:color-mix(in srgb,var(--primary) 55%,transparent)}
  .hbar.warn i{background:var(--warning)}
  .hbar.crit i{background:var(--destructive)}

  /* 빈 상태 — 라이브러리 규격 */
  .hstate{background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:34px 20px;text-align:center}
  .hstate svg{width:32px;height:32px;color:var(--muted-foreground);opacity:.5;margin-bottom:10px}
  .hstate h4{margin:0 0 5px;font-size:13px;font-weight:600;color:var(--foreground)}
  .hstate p{margin:0;font-size:12px;color:var(--muted-foreground)}
  .hstate .btn{margin-top:14px}

  /* 로딩 — 뼈대만 보인다. 자리를 잡아 두어야 값이 들어올 때 화면이 튀지 않는다 */
  .sk{background:var(--muted);border-radius:6px;animation:skp 1.2s ease-in-out infinite}
  @keyframes skp{0%,100%{opacity:.55}50%{opacity:.9}}
  .skcard{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
  .skline{height:11px;margin-bottom:9px}
  .skline.t{width:40%;height:9px}
  .skline.v{width:62%;height:20px;margin-bottom:11px}
  .skline.b{width:100%;height:6px;border-radius:20px}
  .skline:last-child{margin-bottom:0}

  /* 토스트 — 라이브러리 규격 */
  .toast-wrap{position:fixed;top:74px;right:22px;z-index:300;display:flex;
    flex-direction:column;gap:10px;width:340px;max-width:calc(100vw - 44px)}
  .toast{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--card);
    border:1px solid var(--border);border-radius:10px;font-size:12.5px;
    box-shadow:0 10px 30px var(--shadow);min-width:280px;animation:tin .22s ease}
  .toast .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .toast.ok .dot{background:var(--success)}
  .toast .x{margin-left:auto;border:0;background:transparent;
    color:var(--muted-foreground);font-size:14px;cursor:pointer}
  @keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

  /* 버튼 — 라이브러리 규격 */
  .btn{padding:8px 15px;background:var(--primary);color:var(--primary-foreground);
    border:0;border-radius:8px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--foreground)}
  .btn.ghost:hover{background:var(--hover);border-color:var(--foreground)}

  .body-ph{border:1px dashed var(--border);border-radius:12px;min-height:340px;display:grid;place-items:center;color:var(--muted-foreground);font-size:13px;text-align:center;line-height:1.9;background:repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(255,255,255,.012) 12px,rgba(255,255,255,.012) 24px)}
  .body-ph b{color:var(--muted-foreground);font-weight:600;display:block;margin-bottom:2px}
  #page .ph{margin-bottom:20px}
  #page .ph h1{font-size:22px;margin:0 0 6px;letter-spacing:-.2px}
  #page .ph p{font-size:12.5px;color:var(--muted-foreground);margin:0}
  #page .ph-row{display:flex;align-items:flex-start;justify-content:space-between}
  #page .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
  #page .tab{padding:9px 14px;font-size:13px;color:var(--muted-foreground);border-bottom:2px solid transparent;cursor:pointer}
  #page .tab.on{color:var(--foreground);border-bottom-color:var(--accent)}
  .addbtn{padding:8px 15px;background:var(--primary);color:#fff;border:0;border-radius:8px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
  .addbtn:hover{background:var(--primary-hover)}
  /* 마이페이지 */
  .mp-form{max-width:560px}
  .mp-sec{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:20px 22px;margin-bottom:14px}
  .mp-sec h3{font-size:14px;margin:0 0 14px}
  .mp-f{margin-bottom:14px}
  .mp-f label{display:block;font-size:12.5px;color:var(--muted-foreground);margin-bottom:6px}
  .mp-f input{width:100%;padding:9px 12px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;color:var(--foreground);font-size:13px;font-family:inherit}
  .mp-f input:disabled{color:var(--muted-foreground)}
  .mp-act{display:flex;justify-content:flex-end;gap:8px}
  .mp-hint{font-size:11px;color:var(--muted-foreground);margin:6px 0 0;line-height:1.5}

/* ══════════ 알림 SYS-NOTI-P01 (알림 정책 3·5장) ══════════

   ⚠ 조회 API·전체 보기 화면은 확인 대상(알림 정책 7장) */
var NOTI = [
  {sev:'오류', t:'배포 생성에 실패했습니다', b:'llama-3-2-1b-prod · 요청한 가속기를 확보하지 못했습니다.',

   at:'38분 전', to:'개발룸', read:false},
  {sev:'주의', t:'CDE 만료가 임박했습니다',    b:'yj-jupyter-01 · 2026-09-01 에 회수됩니다.',
   at:'2시간 전', to:'개발룸', read:false},
  {sev:'정보', t:'노드 캐싱이 완료되었습니다',    b:'qwen3-32b v3.6 · 3개 노드에 내려받았습니다.',
   at:'2026-08-26 17:40', to:'모델', read:true},
  {sev:'정보', t:'CDE 신청이 승인되었습니다', b:'ai-service-team · 관리자(admin)님이 승인했습니다.',
   at:'2026-08-26 14:02', to:'내 작업함', read:true},
  {sev:'오류', t:'배치 작업이 실패했습니다',  b:'job-20260819-03 · 가속기 메모리가 모자랍니다.',
   at:'2026-08-25 09:31', to:'개발룸', read:true},
  /* 플랫폼 전체에 걸리는 사건은 최고 관리자만 받는다(정책 3.2·3.5·5.6) */
  {sev:'오류', t:'노드가 응답하지 않습니다',   b:'gpu-node-02 · 슬롯 4개가 확인 불가 상태입니다.',
   at:'2026-08-27 07:12', to:'모니터링', read:false},
  {sev:'정보', t:'가입 신청이 접수되었습니다', b:'최서현(sh.choi) · 승인 여부를 처리해 주세요.',
   at:'2026-08-24 17:05', to:'내 작업함', read:true}
];
var SEVCLS = {'오류':'cr','주의':'wa','정보':'ok'};

function notiUnread(){ return NOTI.filter(function(x){ return !x.read; }).length; }

function drawNoti(){
  var n = notiUnread();
  var b = document.getElementById('notiBadge');
  if(b){ b.textContent = n>99 ? '99+' : n; b.style.display = n ? '' : 'none'; }
  var el = document.getElementById('notiList');
  if(!el) return;
  if(!NOTI.length){ el.innerHTML = '<div class="noti-empty">받은 알림이 없습니다.</div>'; return; }
  el.innerHTML = NOTI.map(function(x,i){
    return '<button class="noti-item'+(x.read?'':' unread')+'" onclick="notiGo('+i+')">'
      + '<div class="noti-r1">'
      +   '<span class="noti-sev '+SEVCLS[x.sev]+'">'+x.sev+'</span>'
      +   '<span class="noti-t">'+x.t+'</span>'
      +   '<span class="noti-at">'+x.at+'</span>'
      + '</div>'
      /* 어디로 가는지 미리 보인다. 눌러 봐야 아는 것보다 낫다 */
      + '<p class="noti-b">'+x.b+'</p>'
      + '<span class="noti-go">'+x.to
      +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
      +     '<path d="M9 6l6 6-6 6"/></svg></span>'
      + '</button>';
  }).join('');
}

function toggleNoti(e){
  e.preventDefault(); e.stopPropagation();
  var w = document.getElementById('notiWrap');
  var on = w.classList.contains('open');
  /* 팝오버 둘이 동시에 열리지 않게 한다 */
  var p=document.getElementById('persona'); if(p) p.classList.remove('open');
  if(on){ w.classList.remove('open'); return false; }
  drawNoti(); w.classList.add('open');
  return false;
}
function closeNoti(){ var w=document.getElementById('notiWrap'); if(w) w.classList.remove('open'); }

/* 항목을 누르면 대상 화면으로 이동하고 그와 동시에 읽음 처리한다(5.3·5.4) */
function notiGo(i){
  NOTI[i].read = true;
  drawNoti(); closeNoti();
  alert(NOTI[i].to + ' 화면으로 이동합니다.');
}
/* 목록에서 사라지지 않는다. 읽음 표시만 지운다(5.5) */
function notiAllRead(){ NOTI.forEach(function(x){ x.read = true; }); drawNoti(); }

document.addEventListener('click', closeNoti);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNoti(); });

  models: {crumb:'모델', html:`
    <div class="ph-row"><div class="ph"><h1>모델</h1><p>등록된 모델과 사양을 관리합니다.</p></div><button class="addbtn">＋ 모델 등록</button></div>
    <div class="body-ph"><div><b>모델</b>화면 구성은 화면정의서에서 정의합니다.<br>이 문서는 공통 레이아웃 전달용입니다.</div></div>`},

function onComposeEnd(fn, el){ composing=false; fn(el.value); }

function tgWs(e){
  e.stopPropagation();
  const w=document.getElementById('wsWrap'), o=w.classList.contains('open');
  document.querySelectorAll('.more').forEach(function(x){ x.classList.remove('open'); });
  if(o){ w.classList.remove('open'); return; }
  wsQ=''; drawWsDd(); w.classList.add('open');
  setTimeout(function(){ const i=w.querySelector('.wssearch input'); if(i) i.focus(); }, 30);

function drawWsDd(keepFocus){
  const dd=document.getElementById('wsDd'); if(!dd) return;
  /* 전환 목록도 조회 범위를 따른다. 갈 수 없는 워크스페이스를 보여줄 이유가 없다 */
  /* 전환 목록도 조회 범위를 따른다. 갈 수 없는 워크스페이스를 보여줄 이유가 없다.
     공용 워크스페이스는 전 계정이 소속된다(워크스페이스 정책 2장) */
  const scope=WSLIST.filter(function(w){
    return w==='공용 워크스페이스' || myWs().indexOf(w)>=0;
  });
  const hit=scope.filter(function(w){ return !wsQ || w.toLowerCase().indexOf(wsQ.toLowerCase())>=0; });
  dd.innerHTML =
     '<div class="wssearch"><input placeholder="워크스페이스 검색" value="'+wsQ+'" oninput="wsSearch(this.value)" oncompositionstart="onComposeStart()" oncompositionend="onComposeEnd(wsSearch,this)" onclick="event.stopPropagation()"></div>'
   + '<div class="wslist" onclick="event.stopPropagation()">'
   /* 여러 워크스페이스를 할당받은 사용자와 최고 관리자는 전체를 한 화면에서 볼 필요가 있다 */
   + (!wsQ? '<button class="wsitem'+(isAll()?' on':'')+'" onclick="pickWs(\'전체\')">'
       + '<span class="wic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>'
       + '<span class="wnm">전체</span>'
       + (isAll()? '<span class="wck">✓</span>' : '')+'</button><hr>' : '')
   + (hit.length
      ? hit.map(function(w){
          return '<button class="wsitem'+(wsCur===w?' on':'')+'" onclick="pickWs(\''+w+'\')">'
           + '<span class="wic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="10" height="18" rx="1"/><path d="M14 8h5a1 1 0 011 1v11a1 1 0 01-1 1H4"/></svg></span>'
           + '<span class="wnm">'+w+'</span>'
           + (wsCur===w? '<span class="wck">✓</span>' : '')+'</button>';
        }).join('')
      : '<div class="wsempty">검색 결과가 없습니다.</div>')
   + '</div>';
  if(keepFocus){ const i=dd.querySelector('.wssearch input'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
}

  const a={role:'', acc:{use:0,cap:0}, cpu:{use:0,cap:0}, mem:{use:0,cap:0}, sto:{use:0,cap:0},
           prod:0, dev:0, cde:{run:0,name:'',left:0}, job:{run:0,wait:0},
           model:{n:0,recent:'',ago:'',caching:0}, dep:{n:0,ok:0,bad:0},
           mon:{rule:0,node:0,dead:0}, task:{req:0,mine:0}};
  ws.forEach(function(w){

    ['acc','cpu','mem','sto'].forEach(function(k){ a[k].use+=d[k].use; a[k].cap+=d[k].cap; });

    a.cde.run+=d.cde.run; a.job.run+=d.job.run; a.job.wait+=d.job.wait;
    a.model.n+=d.model.n; a.model.caching+=d.model.caching;
    a.dep.n+=d.dep.n; a.dep.ok+=d.dep.ok; a.dep.bad+=d.dep.bad;
    a.mon.rule+=d.mon.rule; a.mon.node+=d.mon.node; a.mon.dead+=d.mon.dead;
    a.task.req+=d.task.req; a.task.mine+=d.task.mine;
  });

  a.model.recent=''; a.cde.name='';
  return {one:false, ws:'전체', d:a, n:ws.length};
}

  const head = '<div class="ph">'
    + '<div class="phrow">'
    +   '<h1>안녕하세요, '+HROLE[role].name+'님</h1>'
    /* 누르면 헤더 스위처가 열린다. 헤더와 형태를 가른다 —
       헤더는 테두리 있는 버튼(조작 대상), 여기는 배경 없는 텍스트(읽는 값)다.
       같은 생김새로 두면 드롭다운이 둘로 보인다 */
    +   '<button class="phscope" onclick="tgWs(event)" title="워크스페이스 전환">'
    +     scopeLabel
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'
    +   '</button>'
    + '</div>'
    + '<p>소속 워크스페이스의 자원과 배포 현황, 처리할 일을 확인하세요.</p>'
    + '</div>';

  /* 로딩 — 자리를 잡아 두어야 값이 들어올 때 화면이 튀지 않는다 */
  if(hstate==='loading'){
    return head
     + '<div class="hgrid"><div>'
     +   '<div class="hsec"><div class="hsec-h">확인 필요 항목</div>'
     +   '<div class="todos">'+skCard()+skCard()+skCard()+'</div></div></div>'
     + '<div>'
     +   '<div class="hsec"><div class="hsec-h">최근 알림</div>'
     +   '<div class="nlist">'+skCard()+skCard()+'</div></div>'
     +   '<div class="hsec last"><div class="hsec-h">내 작업함</div>'
     +   '<div class="nlist">'+skCard()+'</div></div>'
     + '</div></div>'
     + '<div class="hsec"><div class="hsec-h">워크스페이스 자원</div>'
     + '<div class="rescards">'+skCard()+skCard()+skCard()+skCard()+'</div></div>';
  }

  /* 오류 — 조회 실패는 영역을 대체한다(공통정책 4.1) */
  if(hstate==='error'){
    return head + hEmpty(
      '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
      '데이터를 불러오지 못했습니다.',
      '잠시 후 다시 시도해 주세요.',
      '<button class="btn ghost" onclick="setHState(\'default\')">다시 시도</button>');
  }

  /* 소속이 0인 상태는 없다. 공용 워크스페이스는 전 계정이 소속된다(워크스페이스 정책 2장).
     다만 공용은 자원을 배정받지 않으므로 프로젝트 워크스페이스가 없으면
     자원 섹션만 빈다 — 모델·배포는 공용 것을 볼 수 있다 */
  const noRes = hstate==='empty';

  const h=homeData(), d=h.d, all=!h.one;
  /* 조치할 것은 다 보여 준다. 접어 두면 있는지도 모른다 —
     `모두 보기` 를 눌러야 아는 것이 접기와 다르지 않다.
     넘치면 카드 안에서 스크롤한다 */
  const todosAll = todoList(), recent = recentList();

  let s = head;

  /* ── 1행 — 조치할 것(넓게) + 지나간 기록(우측) ── */
  s += '<div class="hgrid"><div>'
    + '<div class="hsec">'
    /* 건수만 둔다. 빨간 배지는 GNB 알림 배지와 같아 보여 무겁다 — 굵기로 강조한다.
       계정 축임은 도움말로 내린다. 제목 줄에 셋을 두면 자리를 많이 먹는다 */
    +   '<div class="hsec-h">확인 필요 항목'
    +     (todosAll.length? '<span class="hcnt">'+todosAll.length+'건</span>' : '')
    +     tipIc('스위처와 무관하게 소속 워크스페이스 전체를 대상으로 합니다. 결재·알림은 개인에게 오는 것이라 워크스페이스로 좁히지 않습니다.')
    /* 넘치는 것은 접지 않고 카드 안에서 스크롤한다. 더 파고들 것은 각 화면에 있다 */
    +   '</div>'
    +   (todosAll.length
        ? '<div class="todos">'
          /* 배지를 쓰지 않는다. 최근 알림이 배지 목록이라 형태가 같으면 같은 것으로 읽힌다 —
             심각도는 왼쪽 색 띠로, 조치는 우측 문구로 드러낸다 */
          + todosAll.map(function(x){
              return '<button class="todo '+x.c+'" onclick="go(\'' + x.go + '\')">'
               + '<span class="todo-b">'
               +   '<span class="todo-t">'+x.t+'</span>'
               +   '<span class="todo-s">'+x.ws+' · '+x.s+'</span>'
               + '</span>'
               + '<span class="todo-a">'+x.act
               +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>'
               + '</button>';
            }).join('')
          + '</div>'
        /* 비어 있으면 한 줄로 줄인다. 자리는 유지한다 — 배치가 매번 바뀌면
           어디에 뭐가 있는지 익숙해지지 않는다. 홈은 매일 여는 화면이다 */
        : '<div class="todos empty">확인할 것이 없습니다.</div>')
    + '</div></div>';

  /* 우측 열 — 지나간 기록과 결재. 조치와 나란히 두되 무게를 가른다 */
  s += '<div><div class="hsec">'
    + '<div class="hsec-h">최근 알림'
    +   tipIc('스위처와 무관하게 소속 워크스페이스 전체를 대상으로 합니다.')
    +   '<button class="hmore" onclick="go(\'notifications\')">전체 보기'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '</div>'
    + (recent.length
       ? '<div class="nlist">'
         + recent.map(function(x){
             return '<button class="nrow" onclick="go(\'notifications\')">'
              + '<span class="stbadge '+x.c+'"><span class="d"></span>'+x.sev+'</span>'
              + '<span class="n-t">'+x.t+'<span class="n-b">'+x.b+'</span></span>'
              + '<span class="n-w">'+x.w+'</span>'
              + '</button>';
           }).join('')
         + '</div>'
       : hEmpty('<path d="M6 8a6 6 0 1112 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10 21a2 2 0 004 0"/>','받은 알림이 없습니다.','새 알림이 오면 여기에 표시됩니다.'))
    + '</div>'

    /* 결재도 계정 축이라 알림 아래에 둔다. 확인 필요 항목이 조치할 것을 담고
       여기는 지금 얼마나 있는지를 말한다 */
    + '<div class="hsec last">'
    + '<div class="hsec-h">내 작업함'
    +   tipIc('스위처와 무관하게 소속 워크스페이스 전체를 대상으로 합니다.')
    +   '<button class="hmore" onclick="go(\'tasks\')">전체 보기'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '</div>'
    + '<div class="nlist">'
    +   '<div class="taskrow"><span>승인 요청</span>'
    +     '<span class="mc-n">'+(d.task.req? d.task.req+'건' : '없음')+'</span></div>'
    +   '<div class="taskrow"><span>내 신청</span>'
    +     (d.task.mine? '<span class="mc-n">대기 '+d.task.mine+'건</span>' : '<span class="mc-n">없음</span>')+'</div>'
    + '</div>'
    + '</div></div></div>';

  /* ── 2행 — 자원 ── */
  s += '<div class="hsec">'
    /* 스위처를 따르는 것이 기본이라 밝히지 않는다. 예외인 계정 축에만 표시한다 */
    + '<div class="hsec-h">워크스페이스 자원'
    +   '<button class="hmore" onclick="go(\'workspaces\')">전체 보기'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '</div>'
    + (noRes
       ? hEmpty('<rect x="4" y="3" width="10" height="18" rx="1"/><path d="M14 8h5a1 1 0 011 1v11a1 1 0 01-1 1H4"/>',
                '배정받은 자원이 없습니다.',
                '프로젝트 워크스페이스에 참여하면 자원 현황이 표시됩니다.')
       : '<div class="rescards">'
         + resCard('가속기', d.acc, '장', '운영룸 '+d.prod+'장 · 개발룸 '+d.dev+'장')
         + resCard('CPU', d.cpu, 'Cores', pc(d.cpu)>=70? '여유가 적습니다' : '여유 있음')
         + resCard('메모리', d.mem, 'GB', pc(d.mem)>=70? '여유가 적습니다' : '여유 있음')
         + resCard('스토리지', d.sto, 'TB', '공유 볼륨 포함')
         + '</div>')
    + '</div>';

  /* ── 3행 — 지금 돌고 있는 것(크게) ── */
  s += '<div class="hsec"><div class="mcards big">'
    + mcard('dep','배포','deployments',
        d.dep.n, '개',
        /* 건수는 텍스트로 둔다. 배지는 상태에 쓰는 것이라 숫자에 붙이면
           무엇을 뜻하는지 흐려진다(공통정책 1.9). 눈에 걸려야 할 것만 색을 준다 */
        mrow('실행 중', mnum(d.dep.ok+'개'))
        + mrow('확인 필요', mnum(d.dep.bad? d.dep.bad+'개' : '없음')))
    + mcard('mon','모니터링','monitoring',
        pc(d.acc), '% 사용',
        mrow('가속기', mnum(d.acc.use+' / '+d.acc.cap+'장 사용'))
        + mrow('상태 확인 불가', mnum(d.mon.dead? d.mon.dead+'장' : '없음'))
        /* `3개 감시` 는 동사인지 명사인지 애매하다. 개수만 말한다 —
           규칙에 활성/비활성 상태가 있는지는 확인 대상이다 */
        + mrow('알림 규칙', mnum(d.mon.rule+'개')))
    + '</div></div>';

  /* ── 4행 — 갖고 있는 것(작게) ──
     워크스페이스는 소속 정보, 개발룸은 내가 쓰는 작업 환경이다. 답하는 질문이 다르다.
     운영룸은 배포 카드가 대신하므로 룸 요약을 워크스페이스 카드에 두지 않는다 */
  s += '<div class="hsec last"><div class="mcards sm">'
    /* 소속 수는 계정 축이라 스위처와 무관하게 고정한다. 스위처는 조회 범위를
       좁히는 것이지 소속을 바꾸는 것이 아니다 — 하위 행만 지금 보는 것을 따른다 */
    + mcard('ws','워크스페이스','workspaces',
        myWs().length, '개 소속',
        all
          ? myWs().map(function(w){ return mrow(w, mnum(HOME[w].role)); }).join('')
          : mrow('내 역할', mnum(d.role))
            + mrow('배정 가속기', mnum(d.acc.cap+'장'))
            + mrow('룸', mnum('운영룸 '+d.prod+'장 · 개발룸 '+d.dev+'장')))
    + mcard('dev','개발룸','workspaces',
        d.cde.run, '개 실행 중',
        (d.cde.name
          ? mrow('내 CDE', mnum(d.cde.name+' · '+d.cde.left+'일 남음'))
          : mrow('내 CDE', mnum('없음')))
        + mrow('배치 작업', mnum('실행 '+d.job.run+'건 · 대기 '+d.job.wait+'건'))
        + mrow('공유 볼륨', mnum(d.dev? '사용 중' : '없음')))
    + mcard('model','모델','models',
        d.model.n, '개',
        (d.model.recent
          ? mrow('최근 등록', mnum(d.model.recent))
          : mrow('최근 등록', mnum('워크스페이스를 고르면 표시됩니다')))
        + mrow('캐싱 중', d.model.caching? mnum(d.model.caching+'건') : mnum('없음'))
        + mrow('전역 모델', mnum('포함')))
    + '</div></div>';

  return s;
}

function setHState(v, btn){
  hstate=v;
  if(btn){ document.querySelectorAll('.demo-bar .st').forEach(function(b){ b.classList.remove('on'); }); btn.classList.add('on'); }
  render('overview');
}
/* 역할을 바꾸면 소속 워크스페이스가 달라진다. 스위처 값이 소속 밖이면 전체로 되돌린다 */
function setHRole(v, btn){
  role=v;
  if(myWs().indexOf(wsCur)<0){ wsCur='전체'; const el=document.getElementById('wsName'); if(el) el.textContent='전체'; }
  document.querySelectorAll('.demo-bar .rl').forEach(function(b){ b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  render(curPage);
}

function render(key, subLabel){
  var p=PAGES[key];
  if(!p) return;
  curPage = key;
  /* 홈은 스위처에 따라 값이 바뀌므로 그릴 때마다 다시 만든다 */
  document.getElementById('page').innerHTML = (key==='overview') ? drawHome() : p.html;
  setCrumb(p.crumb, subLabel || p.sub);
}
function nav(key){
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  var link=document.querySelector('.nav a[data-page="'+key+'"]');
  if(link) link.classList.add('active');
  render(key);
  return false;
}
function toast(t,msg){
  const w=document.getElementById('toasts'); if(!w) return;
  const d=document.createElement('div');
  d.className='toast '+t;
  d.innerHTML='<span class="dot"></span><span>'+msg+'</span>'
   + '<button class="x" onclick="this.parentNode.remove()">\u2715</button>';
  w.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}

/* [검토용] 홈 목업은 홈만 보여 준다. 다른 화면은 각자 목업이 있으므로
   이동은 토스트로 갈음한다(다른 목업과 같은 방식) */
const GONAME={workspaces:'워크스페이스', models:'모델', deployments:'배포',
  monitoring:'모니터링', tasks:'내 작업함', notifications:'알림', settings:'플랫폼 설정'};
function go(key){
  toast('ok', (GONAME[key]||key)+' 화면으로 이동합니다.');
  return false;
}
function navSub(key, label){
  nav(key);
  document.querySelectorAll('.flyout a').forEach(function(a){a.classList.toggle('on', a.textContent.indexOf(label)===0)});
  render(key, label);
  return false;
}
render('overview');

document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[href="#"]');
  if(a){ e.preventDefault(); }
}, true);

function toggleTheme(e){
  if(e) e.stopPropagation();
  var dark = !document.body.classList.toggle('dark');
  document.querySelectorAll('.toggle').forEach(function(t){t.classList.toggle('on', dark)});
}
function togglePersona(e){
  if(e) e.stopPropagation();
  closeNoti();
  document.getElementById('persona').classList.toggle('open');
}
document.addEventListener('click',function(e){
  var p=document.getElementById('persona');
  if(p && !p.contains(e.target)) p.classList.remove('open');
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ document.getElementById('persona').classList.remove('open'); }});
function toggleLang(e){
  e.stopPropagation();
  document.getElementById('langRow').classList.toggle('open');
  document.getElementById('langList').classList.toggle('open');
}
function pickLang(btn,name){
  event.stopPropagation();
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('langCur').textContent=name;
  document.getElementById('langRow').classList.remove('open');
  document.getElementById('langList').classList.remove('open');
}

/* 배지는 처음부터 그린다. 팝오버를 열지 않아도 읽지 않은 건수가 보여야 한다 */
drawNoti();

function toggleGnb(btn){
  const on=document.body.classList.toggle('gnb-fold-on');
  btn.title = on?'사이드바 펼치기':'사이드바 접기';
  btn.querySelector('svg').innerHTML = on
    ? '<path d="M10 6l6 6-6 6"/><path d="M5 5v14"/>'
    : '<path d="M14 6l-6 6 6 6"/><path d="M19 5v14"/>';
}
</script>

<div class="toast-wrap" id="toasts"></div>

<div class="demo-bar" id="demoBar">
  <span class="dgrp"><span class="demo-label">데이터:</span>
    <button class="st on" onclick="setHState('default',this)">기본</button>
    <button class="st" onclick="setHState('empty',this)">자원 미배정</button>
    <button class="st" onclick="setHState('loading',this)">로딩</button>
    <button class="st" onclick="setHState('error',this)">오류</button></span>
  <span class="dgrp"><span class="demo-label">역할:</span>
    <button class="rl on" onclick="setHRole('super',this)">최고 관리자</button>
    <button class="rl" onclick="setHRole('admin',this)">워크스페이스 관리자</button>
    <button class="rl" onclick="setHRole('editor',this)">편집자</button>
    <button class="rl" onclick="setHRole('viewer',this)">뷰어</button></span>
  <span class="dgrp"><span class="demo-label">테마:</span>
    <button onclick="document.body.classList.remove('dark')">라이트</button>
    <button onclick="document.body.classList.add('dark')">다크</button></span>
  <span class="dgrp"><span class="demo-label">사이드바:</span>
    <button onclick="document.body.classList.remove('gnb-fold-on')">펼침</button>
    <button onclick="document.body.classList.add('gnb-fold-on')">접힘</button></span>
</div>
</body>
